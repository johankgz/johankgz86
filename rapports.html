<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EA">
<link rel="apple-touch-icon" sizes="180x180" href="/icone-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="/icone-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="/icone-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="/icone-120.png">
<link rel="apple-touch-icon-precomposed" href="/icone-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icone-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Travaux 360">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Tous mes chantiers — Suivi travaux 360</title>

<style>
:root{--bg:#F4F1EA;--card:#fff;--field:#EFEBE1;--ink:#22201C;--ink-2:#6E675C;--ink-3:#8C8475;
 --rule:#E2DCCE;--accent:#B4621A;--accent-soft:#FBEDE0;--solar:#E8A33D;--solar-soft:#FBEDE0;
 --shadow:0 1px 0 rgba(34,32,28,.05)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;letter-spacing:-.01em;
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:0;z-index:10;background:rgba(241,243,247,.86);backdrop-filter:saturate(180%) blur(20px);
 -webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(34,32,28,.07);
 padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px}
h1{font-size:21px;font-weight:700;letter-spacing:-.03em;margin:0}
main{max-width:640px;margin:0 auto;padding:16px}
.block{background:var(--card);border-radius:var(--r-field);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.block h2{font-size:17px;font-weight:700;letter-spacing:-.02em;margin:0 0 12px}
input{width:100%;min-height:48px;padding:12px 14px;font-size:16px;font-family:inherit;color:var(--ink);
 background:var(--field);border:1px solid transparent;border-radius:var(--r-field)}
input:focus{outline:none;background:#fff;border-color:var(--accent);box-shadow:0 0 0 4px rgba(180,98,26,.16)}
label span{display:block;font-size:13.5px;color:var(--ink-2);margin-bottom:6px}
button{min-height:48px;padding:12px 18px;border:0;border-radius:var(--r-field);background:var(--accent);color:#fff;
 font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
button:active{transform:scale(.975)}
button.ghost{background:var(--accent-soft);color:var(--accent)}
.hint{font-size:13px;color:var(--ink-3);margin:10px 0 0}
.err{font-size:14px;color:#A6291F;margin:10px 0 0}
.travaux{background:var(--card);border-radius:var(--r-field);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.travaux .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;cursor:pointer}
.travaux .head b{flex:1;font-size:16px;letter-spacing:-.02em}
.travaux .head .n{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.travaux .head .barre{display:flex;gap:8px;flex-wrap:wrap;width:100%;margin-top:2px}
.travaux .head .ref{font-size:12px;font-weight:700;color:#fff;background:var(--accent);border-radius:var(--r-field);padding:3px 8px}
.fichiers{border-top:1px solid var(--rule);padding:6px 0}
.f{display:flex;align-items:center;gap:12px;padding:12px 16px;text-decoration:none;color:inherit;border-bottom:1px solid var(--rule)}
.f:last-child{border-bottom:0}
.f .t{flex:1}
.f .t b{display:block;font-size:15px;font-weight:600}
.f .t span{display:block;font-size:12.5px;color:var(--ink-3)}
.f .t span.lu{margin-top:3px;font-size:12px;font-weight:600;color:#0B7A45}
.f .t span.lu.na{color:#8C8475;font-weight:500}
.f .tag{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:var(--r-field);background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.f .tag.suivi{background:var(--solar-soft);color:#7A5200}
.f .tag.commande{background:#EDF0E4;color:#0B7A45}
.f .tag.photos{background:#EDEAFB;color:#5B3FD6}
.f .tag.reportage{background:#EDEAFB;color:#4B36AE;font-weight:700}
.f .tag.autoc{background:#E7EDF3;color:#2F4D68;font-weight:700}
.f .tag.carnet{background:#F3ECE2;color:#7A4B12;font-weight:700}
.f .tag.memoire{background:#EDEFEA;color:#4A5A34;font-weight:700}
.f .tag.doe{background:#E6EFEC;color:#1F5C4A;font-weight:700}
.f .tag.reception{background:#EDF0E4;color:#0B7A45;font-weight:700}
.f .tag.etiq{background:#F1F0EC;color:#6B6455}
.f .tag.sav{background:#F8E4E0;color:#B3332C;font-weight:700}
.vide{color:var(--ink-3);font-size:14.5px;text-align:center;padding:26px 10px}
.hint{font-size:13px;color:var(--ink-3)}
.actions{display:flex;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--rule)}
.actions button{min-height:40px;padding:9px 14px;border:0;border-radius:var(--r-field);font-size:13.5px;font-weight:600;
 font-family:inherit;cursor:pointer;background:var(--accent-soft);color:var(--accent)}
.actions button.danger{background:#F8E4E0;color:#A6291F}

html{-webkit-text-size-adjust:100%}
body{touch-action:manipulation}          /* le double appui ne zoome plus */
button,.act,.chip,label,input,select,textarea,a{touch-action:manipulation}

.f .sup{flex:0 0 auto;width:32px;height:32px;min-height:32px;padding:0;margin-left:6px;border:0;
 background:none;color:var(--ink-3);font-size:19px;line-height:1;cursor:pointer;border-radius:var(--r-field)}
.f .sup:hover,.f .sup:active{background:#F8E4E0;color:var(--danger)}

/* ---------- écrans larges : ordinateur et tablette ---------- */
@media (min-width:820px){
  body{padding:28px 24px 40px}
  main{max-width:1000px}
  .salut,.tete .salut{font-size:30px}
  .etapes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:22px}
  a.etape{border-bottom:1px solid var(--rule)}
  .colonnes{display:grid;grid-template-columns:1.25fr 1fr;gap:26px;align-items:start}
  .bulletin{padding:18px 22px}
  .bul-gauche .heure{font-size:34px}
}
@media (min-width:1180px){
  main{max-width:1120px}
}
@media (hover:hover){
  .notif:hover,.bref a:hover,a.etape:hover,a.appoint:hover,a.tuile:hover,.raccourci:hover{
    background:rgba(180,98,26,.06)}
  button.p:hover,button.act:hover{filter:brightness(.97)}
}

.f .part{flex:0 0 auto;margin-left:6px;padding:7px 12px;border:1px solid var(--rule);background:var(--card);
 color:var(--ink-2);font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer;border-radius:var(--r-field);white-space:nowrap}
.f .part:active{background:var(--field);color:var(--accent)}

.head .iti{margin-left:8px;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--rule);
 background:var(--card);color:var(--ink-2);font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;border-radius:var(--r-field)}
.head .iti:active{background:var(--field);color:var(--accent)}
.head .adr{display:block;font-size:12px;color:var(--ink-3);margin-top:3px}

.head .iti svg{color:var(--accent)}

.restaurer{border:1px solid var(--rule);background:var(--card);padding:13px 15px;margin-bottom:16px}
.restaurer .hint{margin:9px 0 0}
/* ---------- carte des chantiers, plein écran ---------- */
#carte{position:fixed;inset:0;z-index:70;background:#1A1815;display:flex;flex-direction:column;
 padding-top:env(safe-area-inset-top,0px)}
#carte[hidden]{display:none}
#carte .sk-bar{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;overflow-x:auto;
 padding:8px 10px;background:#262320;flex:0 0 auto;scrollbar-width:none}
#carte .sk-bar[hidden]{display:none}
#carte .sk-bar::-webkit-scrollbar{display:none}
#carte .sk-bar button{flex:0 0 auto;min-height:38px;padding:8px 12px;border-radius:var(--r-field);border:0;
 background:rgba(255,255,255,.1);color:#F4F1EA;font-size:13px;font-family:inherit;font-weight:600;
 cursor:pointer;white-space:nowrap}
#carte .sk-bar button:active{transform:scale(.96)}
#carte .sk-bar button.go{background:var(--accent);color:#fff}
#carte .sk-bar .title{flex:1 1 auto;color:#8C8475;font-size:13px;font-weight:500;padding-left:2px;
 overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:60px}
#carte .sk-bar .etat{color:#8C8475;font-size:12px;white-space:nowrap}
#carte .sk-wrap{flex:1 1 auto;min-height:0;position:relative;overflow:hidden}
#carte_q{flex:1 1 auto;min-width:110px;min-height:38px;padding:8px 12px;border:0;border-radius:var(--r-field);
 background:rgba(255,255,255,.12);color:#F4F1EA;font-family:inherit;font-size:15px}
#carte_q::placeholder{color:#8C8475}
#carte_q:focus{outline:none;background:rgba(255,255,255,.2)}
#carte_canvas{display:block;background:#1A1815;touch-action:none;cursor:grab}
#carte_canvas:active{cursor:grabbing}
#carte_fonds{position:absolute;top:8px;right:8px;z-index:3;width:min(270px,calc(100% - 16px));
 background:#fff;border-radius:12px;padding:6px;box-shadow:0 18px 44px -16px rgba(0,0,0,.55);
 display:flex;flex-direction:column;gap:2px;animation:fondsMenu .16s cubic-bezier(.2,.8,.2,1)}
#carte_fonds[hidden]{display:none}
#carte_fonds button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;min-height:44px;
 padding:7px 10px 7px 30px;border:0;border-radius:8px;background:none;color:#0C1119;text-align:left;
 font-family:inherit;cursor:pointer;position:relative;box-shadow:none}
#carte_fonds button b{font-size:13.5px;font-weight:600}
#carte_fonds button span{font-size:11.5px;color:#6B7684;font-weight:500}
#carte_fonds button[aria-checked="true"]{background:#FDF4EA}
#carte_fonds button[aria-checked="true"]::before{content:"";position:absolute;left:11px;top:50%;width:8px;height:8px;
 margin-top:-4px;border-radius:50%;background:#EA7A1E}
@media (hover:hover){ #carte_fonds button:hover{background:#F4F6F9} }
@keyframes fondsMenu{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){ #carte_fonds{animation:none} }
#carte_fiche{position:absolute;left:10px;right:10px;bottom:10px;background:var(--card);
 border:1px solid var(--rule);border-radius:var(--r-field);padding:12px 14px;
 box-shadow:0 18px 50px -20px rgba(0,0,0,.8)}
#carte_fiche[hidden]{display:none}
#carte_fiche .ref{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
#carte_fiche b{display:block;font-size:15px;margin:2px 0 3px}
#carte_fiche .adr{font-size:12.5px;color:var(--ink-3);margin:0 0 9px}
#carte_fiche .btns{display:flex;gap:6px;flex-wrap:wrap}
#carte_fiche .btns button{min-height:36px;padding:7px 11px;border:1px solid var(--rule);border-radius:var(--r-field);
 background:var(--card);color:var(--ink-2);font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
#carte_fiche .btns button.go{background:var(--accent);color:#fff;border-color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));
 z-index:90;background:#262320;color:#F4F1EA;padding:10px 16px;border-radius:var(--r-field);font-size:13.5px;
 max-width:calc(100% - 32px);text-align:center;box-shadow:0 12px 30px -14px rgba(0,0,0,.7)}
.toast[hidden]{display:none}
.barre-carte{display:flex;gap:8px;align-items:center;margin:0 0 14px}
.barre-carte button{min-height:38px;padding:9px 14px;border:1px solid var(--rule);border-radius:var(--r-field);
 background:var(--card);color:var(--ink-2);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
 display:inline-flex;align-items:center;gap:7px}
.barre-carte button:active{background:var(--field);color:var(--accent)}
.barre-carte button svg{color:var(--accent)}
.barre-carte[hidden]{display:none}


/* =====================================================================
   INSTRUMENT — la couche d'habillage du site
   ---------------------------------------------------------------------
   Direction : un instrument de mesure, pas un tableau de bord de vaisseau.
   Le vocabulaire est technique — traits d'un pixel, équerres de repère,
   chiffres en chasse fixe, graphite et orange électrique — mais les
   surfaces de travail restent claires et contrastées : la fiche se
   remplit dehors, en plein soleil, avec des gants.

   Deux couleurs, deux rôles, jamais l'un pour l'autre :
      orange  ce sur quoi on agit    (boutons, liens, onglet courant)
      cyan    ce que l'outil mesure  (chiffres, repères, carte, états)

   Tout part des variables ci-dessous. Une valeur suffit à reprendre le
   site entier.
   ===================================================================== */

/* ---------- une seule police, hébergée ici : elle marche hors réseau ---------- */
@font-face{
  font-family:"Plus Jakarta Sans";
  src:url("./polices/jakarta-var.woff2") format("woff2-variations");
  font-weight:200 800; font-style:normal; font-display:swap;
}

:root{
  /* graphite : le châssis */
  --g-900:#0A0E14;
  --g-800:#10161F;
  --g-700:#1A2230;
  --g-600:#27313F;
  --trait-tech:rgba(255,255,255,.10);

  /* surfaces de travail : claires, pour le plein soleil */
  --bg:#383E42;          /* anthracite : le site est un châssis, les fiches sont dessus */
  --card:#FFFFFF;
  --field:#EFF1F4;
  --champ-fond:#FFFFFF;
  --champ-bord:#D8DDE4;
  --rule:rgba(10,14,20,.09);
  --ink:#0C1119;
  --ink-2:#4B5563;
  --ink-3:#6B7684;

  /* ce sur quoi on agit */
  --accent:#B45309;
  --accent-fonce:#92400E;
  --accent-vif:#FB923C;          /* sur graphite, il faut qu'il brille */
  --accent-soft:#FDF4EA;

  /* ce que l'outil mesure */
  --data:#0E7490;
  --data-vif:#22D3EE;
  --data-soft:#E7F4F7;

  /* familles, toutes au même niveau */
  --violet:#5B5F80;      --violet-soft:#EFEFF4;
  --vert:#3F6B52;        --vert-soft:#EAF2ED;
  --ambre:#8A6524;       --ambre-soft:#F6F1E8;
  --rouge:#A03A33;       --rouge-soft:#F8EDEB;
  --solar:#8A6524;       --solar-soft:#F6F1E8;
  --danger:#A03A33;      --danger-soft:#F8EDEB;
  --ok:#3F6B52;          --ok-soft:#EAF2ED;

  /* géométrie : des angles francs, pas des galets */
  --r-card:10px;
  --r-field:8px;
  --r-pill:999px;

  --ombre-1:0 1px 2px rgba(10,14,20,.05);
  --ombre-2:0 1px 2px rgba(10,14,20,.05), 0 10px 24px -14px rgba(10,14,20,.35);
  --ombre-3:0 22px 48px -20px rgba(10,14,20,.45);
  --shadow:var(--ombre-2);

  --sans:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  /* tout est dans la même police : --mono ne change que les chiffres,
     qui restent tabulaires pour que les colonnes s'alignent */
  --mono:var(--sans);
}

html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  letter-spacing:-.006em;
}

/* ---------- les valeurs : mêmes lettres, chiffres alignés ----------
   références, dates, poids, compteurs : ce sont des valeurs. Elles
   gardent des chiffres tabulaires, donc de largeur égale : une valeur
   qui change ne fait pas danser la ligne. */
.mono,.ref,.num,.n,.etat,time,
input[type="number"],input[type="date"],input[type="time"],input[type="tel"]{
  font-variant-numeric:tabular-nums;
}

/* ---------- les intertitres ---------- */
h2.sec,.legend{
  font-size:11px;
  font-weight:600;
  letter-spacing:.11em;
  text-transform:uppercase;
  color:var(--ink-3);
}

/* ---------- surfaces ---------- */
.block,.travaux,.notifs,.restaurer{
  background:var(--card);
  border:1px solid var(--rule);
  border-radius:var(--r-card);
  box-shadow:var(--ombre-1);
}
.block h2{
  font-size:15.5px;font-weight:600;letter-spacing:-.015em;color:var(--ink);
}
h1{font-weight:600;letter-spacing:-.03em}
.hint{color:var(--ink-3);line-height:1.55}

/* ---------- champs : blancs, cernés, avec une amorce à gauche ---------- */
input[type="text"],input[type="search"],input[type="tel"],input[type="email"],
input[type="number"],input[type="date"],input[type="time"],input[type="url"],
input[type="password"],
input:not([type]),textarea,select{
  background:var(--champ-fond);
  border:1px solid var(--champ-bord);
  border-radius:var(--r-field);
  transition:border-color .16s ease, box-shadow .16s ease;
}
input::placeholder,textarea::placeholder{color:#9AA4B0}
input:hover:not(:focus),textarea:hover:not(:focus),select:hover:not(:focus){border-color:#BFC7D1}
input:focus,textarea:focus,select:focus{
  outline:none;background:#fff;
  border-color:var(--data);
  box-shadow:0 0 0 3px rgba(14,116,144,.16);
}
label span{font-weight:500;color:var(--ink-2)}

/* ---------- boutons ---------- */
button,.act,button.p{
  border-radius:var(--r-field);
  font-family:var(--sans);
  font-weight:600;
  letter-spacing:-.008em;
  transition:background .16s ease,color .16s ease,border-color .16s ease,
             box-shadow .16s ease,transform .08s ease;
}
button.p,.act.blue,.act.solid,button.go,.sk-bar button.go{
  background:var(--accent);color:#fff;border:1px solid transparent;
  box-shadow:0 1px 2px rgba(146,64,14,.3);
}
.act.ghost{
  background:#fff;color:var(--ink-2);
  border:1px solid var(--champ-bord);box-shadow:var(--ombre-1);
}
.act.danger{background:var(--rouge-soft);color:var(--rouge);border:1px solid rgba(160,58,51,.18);box-shadow:none}
button:active,.act:active,button.p:active{transform:translateY(1px)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,
textarea:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--data);outline-offset:2px;
}

/* ---------- pastilles et étiquettes ---------- */
.chip,.chips label{
  border-radius:var(--r-pill);
  border:1px solid var(--champ-bord);
  background:#fff;color:var(--ink-2);font-weight:500;
  transition:background .16s ease,border-color .16s ease,color .16s ease;
}
.chip.on,.chips label.on{
  background:var(--accent-soft);border-color:rgba(180,83,9,.4);
  color:var(--accent-fonce);font-weight:600;
}
.tag,.f .tag{
  border-radius:var(--r-pill);
  font-size:11px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;padding:4px 10px;
}
.ref{
  font-size:11.5px;font-weight:700;letter-spacing:.04em;
  border-radius:var(--r-field);
}

/* ---------- le châssis : en-tête sombre, trait technique ---------- */
header{
  background:var(--g-900);
  border-bottom:1px solid var(--trait-tech);
  color:#E7ECF2;
  position:relative;
}
header::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,var(--accent-vif),rgba(34,211,238,.55),transparent 72%);
}
header h1{color:#F2F5F9;font-weight:600}
header .hint,header .meta,header .etat{color:#8A97A6}
.menu-link,header a[href="./index.html"]{
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.18);
  border-radius:var(--r-field);
  color:#EDF1F6;
  box-shadow:none;
}
#hdrRef,header .ref{
  color:var(--data-vif);background:none;letter-spacing:.05em;font-weight:600;
}

/* ---------- barre d'onglets : une réglette ---------- */
nav#nav{
  gap:2px;padding:4px;margin:10px -2px 0;
  background:var(--g-800);
  border:1px solid var(--trait-tech);
  border-radius:10px;
}
nav#nav button{
  padding:7px 6px 6px;border-radius:7px;
  color:#8A97A6;font-weight:500;font-size:10.5px;
  letter-spacing:.02em;
}
nav#nav button[aria-current="true"]{
  color:#0A0E14;background:var(--accent-vif);
  font-weight:600;box-shadow:0 0 0 1px rgba(251,146,60,.5),0 6px 16px -8px rgba(251,146,60,.9);
}
nav#nav button svg{stroke-width:1.9}
.avance{margin-top:8px}
.avance .barre{height:3px;border-radius:0;background:rgba(255,255,255,.12)}
.avance .barre i{border-radius:0;background:linear-gradient(90deg,var(--accent-vif),var(--data-vif))}
.avance .etape{color:#8A97A6}
.avance .etape b{color:#E7ECF2}

/* ---------- l'équerre de repère : la signature de la maison ---------- */
.equerre{position:relative}
.equerre::before,.equerre::after{
  content:"";position:absolute;width:10px;height:10px;pointer-events:none;
  border:1px solid var(--data-vif);opacity:.55;
}
.equerre::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.equerre::after{bottom:-1px;right:-1px;border-left:0;border-top:0}

/* ---------- le survol, là où il existe ---------- */
@media (hover:hover){
  button.p:hover,.act.blue:hover,.act.solid:hover,button.go:hover{
    background:var(--accent-fonce);box-shadow:0 2px 10px -3px rgba(146,64,14,.5);
  }
  .act.ghost:hover{background:#FAFBFC;border-color:#BFC7D1;color:var(--ink)}
  .act.danger:hover{background:#F4E2DF}
  .chip:hover:not(.on),.chips label:hover:not(.on){border-color:#BFC7D1;background:#FAFBFC}
  .block:hover,.travaux:hover{box-shadow:var(--ombre-2)}
  .menu-link:hover,header a[href="./index.html"]:hover{background:rgba(255,255,255,.14);color:#fff}
  nav#nav button:hover:not([aria-current="true"]){color:#C7D0DA;background:rgba(255,255,255,.06)}
}
@media (prefers-reduced-motion:reduce){
  button,.act,input,textarea,select,.chip,.chips label,.block,.travaux{transition:none}
  button:active,.act:active,button.p:active{transform:none}
}

/* ---------- MES RAPPORTS : la liste des dossiers ----------
   Chaque dossier est une fiche d'instrument : sa référence en chasse
   fixe, ses documents en lignes serrées, ses étiquettes en capitales. */
.barre-carte{margin:2px 0 16px}
.barre-carte button{
  background:var(--g-900);color:#E7ECF2;
  border:1px solid var(--trait-tech);border-radius:var(--r-field);
  font-size:13px;padding:11px 16px;box-shadow:var(--ombre-1);
}
.barre-carte button svg{color:var(--data-vif)}
#bonjour{font-size:14.5px;color:var(--ink-2)}
#recherche{margin-bottom:16px}
.restaurer{margin:26px 0 0;padding:16px;background:none;
  border:1px dashed var(--champ-bord);box-shadow:none;border-radius:var(--r-card)}
.restaurer .act.ghost{width:auto}

.travaux{overflow:hidden}
.travaux .head{padding:15px 16px}
.travaux .head b{font-size:15.5px;font-weight:600}
.travaux .head .ref{
  background:var(--g-900);color:var(--data-vif);
  padding:4px 10px;font-size:11px;letter-spacing:.06em;border-radius:var(--r-field);
}
.travaux .head .n{font-size:12px;letter-spacing:.02em;color:var(--ink-3)}
.head .iti{
  border-radius:var(--r-field);border:1px solid var(--champ-bord);
  background:#fff;box-shadow:var(--ombre-1);padding:8px 13px;
}
.f .t b{font-weight:600}
.f .t span{font-size:11.5px;letter-spacing:0;color:var(--ink-3)}
.f .t span.lu{color:var(--ok);font-family:var(--sans);font-size:12px}
.f .t span.lu.na{color:var(--ink-3)}
.f .part,.f .sup{border-radius:var(--r-field)}

/* les étiquettes : la même famille, en sourdine */
.f .tag{background:var(--accent-soft);color:var(--accent)}
.f .tag.suivi{background:var(--ambre-soft);color:var(--ambre)}
.f .tag.commande{background:var(--vert-soft);color:var(--vert)}
.f .tag.photos,.f .tag.reportage{background:var(--violet-soft);color:var(--violet)}
.f .tag.autoc{background:var(--data-soft);color:var(--data)}
.f .tag.carnet{background:var(--ambre-soft);color:var(--ambre)}
.f .tag.memoire{background:var(--vert-soft);color:var(--vert)}
.f .tag.doe,.f .tag.reception{background:var(--ok-soft);color:var(--ok)}
.f .tag.etiq{background:var(--field);color:var(--ink-2)}
.f .tag.technique{background:var(--data-soft);color:var(--data)}
.f .tag.point{background:var(--solar-soft);color:#7A5200}

/* ---------- ce qui est neuf, ce qui est saisi ---------- */
.head .pastille-docs{
  flex:0 0 auto;background:var(--accent);color:#fff;
  min-width:20px;height:20px;padding:0 6px;border-radius:var(--r-pill);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;
}
/* dossier mis de côté : une étiquette sobre, qui vire au plein quand la
   relance est due. */
.head .etiq-attente{
  flex:0 0 auto;background:rgba(180,83,9,.10);color:var(--accent);
  font-size:10.5px;font-weight:700;letter-spacing:.02em;
  padding:2px 9px;border-radius:var(--r-pill);white-space:nowrap;
}
.head .etiq-attente.du{background:var(--accent);color:#fff}
.f .neuf{
  flex:0 0 auto;background:var(--accent);color:#fff;
  font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 8px;border-radius:var(--r-pill);
}
.f .saisie{display:block;margin-top:4px;font-size:12px;font-weight:600;color:var(--ok)}
.f .t{min-width:0}
.f.riche{flex-wrap:wrap}
.f.riche .t{flex:1 1 100%;margin-bottom:9px}
.f .ok-saisie{
  flex:0 0 auto;border:1px solid var(--rule);border-radius:var(--r-pill);
  background:var(--card);color:var(--ink-2);
  font-family:inherit;font-size:11px;font-weight:600;padding:4px 10px;cursor:pointer;
}
.f .ok-saisie.on{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.f .ok-saisie[disabled]{opacity:.5}
@media (hover:hover){ .f .ok-saisie:hover{border-color:#BFC7D1;background:#FAFBFC;color:var(--ink)} }
.f .tag.sav{background:var(--rouge-soft);color:var(--rouge)}
.actions .danger{background:var(--rouge-soft);color:var(--rouge);border:1px solid rgba(160,58,51,.18)}
@media (hover:hover){
  .barre-carte button:hover{background:var(--g-800);border-color:rgba(34,211,238,.4)}
  .head .iti:hover{background:#FAFBFC;border-color:#BFC7D1;color:var(--ink)}
}

/* =====================================================================
   SUR LE FOND ANTHRACITE
   ---------------------------------------------------------------------
   Le fond de page est devenu sombre : les fiches restent des feuilles
   blanches posées dessus, mais tout ce qui s'écrit À CÔTÉ des fiches —
   intertitres, signature, salutation, boutons de page — doit passer en
   clair, sinon il disparaît. Deux valeurs suffisent, mesurées sur
   #383E42 : 9,2 pour la première, 5,3 pour la seconde.
   Les deux couleurs de rôle passent à leur version vive, la sourde ne
   tient pas sur le sombre.
   ===================================================================== */
:root{
  --sur-fond:#E9ECF2;
  --sur-fond-2:#AEB7BF;
  --trait-fond:rgba(255,255,255,.14);
}
h2.sec,.sec{color:var(--sur-fond-2)}
.signature,.signature b,.signature span,.signature .version{color:var(--sur-fond-2)}
.signature .version{opacity:.85}
.tete .salut{color:var(--sur-fond)}
.tete .salut em{color:var(--accent-vif)}
.tete .meta{color:var(--sur-fond-2)}
.marque-app{color:var(--data-vif)}
.haut button{background:rgba(255,255,255,.08);color:var(--sur-fond-2)}
.haut button:hover{background:rgba(255,255,255,.14);color:var(--sur-fond)}
.grille{border-top-color:var(--trait-fond)}

#bonjour{color:var(--sur-fond-2)}
p.vide{color:var(--sur-fond-2)}
#restaurerEtat{color:var(--sur-fond-2)}
button.discu{position:relative}
button.discu.a-lire{border-color:rgba(160,58,51,.45)!important;color:var(--danger)!important;font-weight:700}
.pastille-discu{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 6px;
  margin-left:6px;border-radius:10px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;line-height:1;
  box-shadow:0 0 0 2px #fff;animation:pastilleBat 1.6s ease-out 2}
@keyframes pastilleBat{0%{transform:scale(1)}30%{transform:scale(1.25)}60%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){ .pastille-discu{animation:none} }
/* =====================================================================
   TOUS MES CHANTIERS — la liste épurée
   ---------------------------------------------------------------------
   Une fiche par dossier, repliée quand il y en a beaucoup : le client,
   sa référence et sa commune, ce qui est neuf. Les outils (itinéraire,
   accès, discussion) sont de petites icônes rondes alignées à droite ;
   leur libellé n'apparaît qu'en grand écran. Les documents se lisent en
   lignes serrées : le titre, puis l'étiquette et les détails.
   ===================================================================== */
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#bonjour{margin:0 2px 12px;font-size:13px;line-height:1.4}
.outils-liste{display:flex;gap:8px;align-items:center;margin:0 0 14px}
.outils-liste .cherche{flex:1 1 auto;position:relative;display:block;min-width:0}
.outils-liste .cherche:has(#recherche[hidden]){display:none}
.outils-liste .cherche svg{position:absolute;left:12px;top:50%;margin-top:-8px;width:16px;height:16px;
  stroke:var(--ink-3);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
.outils-liste #recherche{margin:0;min-height:42px;padding:9px 12px 9px 36px;font-size:15px;border-radius:10px}
.barre-carte{margin:0;flex:0 0 auto}
.barre-carte button{min-height:42px;padding:9px 14px;border-radius:10px;font-size:13px;gap:7px}
.barre-carte button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}

#liste{display:flex;flex-direction:column;gap:8px}
.travaux{margin:0;border-radius:12px;box-shadow:none}
.travaux.attente{box-shadow:inset 3px 0 0 var(--accent-vif)}
.travaux .head{display:block;padding:11px 12px 10px 14px;cursor:pointer;user-select:none}
.travaux .head:focus-visible{outline:2px solid var(--data);outline-offset:-2px;border-radius:12px}
.travaux .titre{display:flex;align-items:center;gap:8px;min-height:32px}
.travaux .titre b{flex:0 1 auto;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  font-size:15px;font-weight:650;letter-spacing:-.015em;color:var(--ink)}
.travaux .head .pastille-docs{min-width:17px;height:17px;padding:0 5px;font-size:10.5px;background:#EA7A1E}
.travaux .outils{display:flex;gap:4px;margin-left:auto;flex:0 0 auto}
.travaux .outil{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  width:32px;height:32px;min-height:32px;padding:0;border:1px solid var(--rule);border-radius:999px;
  background:#fff;color:var(--ink-2);box-shadow:none;cursor:pointer}
.travaux .outil svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.travaux .outil .lib{display:none;font-size:12px;font-weight:600;white-space:nowrap}
.travaux .outil.iti svg{color:var(--accent)}
.travaux .outil.a-lire{border-color:rgba(160,58,51,.4)!important;color:var(--danger)!important}
.travaux .outil .pastille-discu{position:absolute;top:-5px;right:-6px;margin:0;min-width:16px;height:16px;
  padding:0 4px;font-size:10px;box-shadow:0 0 0 2px #fff}
.travaux .pli{flex:0 0 auto;display:inline-flex;width:20px;justify-content:center;color:var(--ink-3)}
.travaux .pli svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.travaux.ouvert .pli svg{transform:rotate(180deg)}
.travaux .sous{display:flex;align-items:center;flex-wrap:wrap;gap:0;margin-top:1px;
  font-size:12px;color:var(--ink-3);line-height:1.5}
.travaux .sous > span + span::before{content:"·";margin:0 6px;color:#B4BCC6}
.travaux .head .ref{background:none;color:var(--data);padding:0;font-size:11.5px;font-weight:700;letter-spacing:.04em}
.travaux .head .n{font-size:12px;color:var(--ink-3);letter-spacing:0}
.travaux .sous .etiq-attente{padding:0;background:none;font-size:12px;color:var(--accent)}
.travaux .sous .etiq-attente.du{background:none;color:var(--danger)}

.travaux .fichiers{border-top:1px solid var(--rule);padding:2px 0}
.travaux:not(.ouvert) .fichiers,.travaux .fichiers[hidden],.travaux .actions[hidden]{display:none}
.travaux .f{display:flex;align-items:center;gap:10px;padding:9px 12px 9px 14px;border-bottom:1px solid #EEF1F4}
.travaux .f:last-child{border-bottom:0}
.travaux .f .t{flex:1 1 auto;min-width:0}
.travaux .f .tl{display:flex;align-items:center;gap:7px;min-width:0}
.travaux .f .t b{display:block;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  font-size:14px;font-weight:600;color:var(--ink)}
.travaux .f .neuf{flex:0 0 auto;font-size:9.5px;padding:2px 6px;background:#EA7A1E}
.travaux .f .meta{display:flex;align-items:center;gap:7px;margin-top:2px;min-width:0}
.travaux .f .tag{flex:0 0 auto;font-size:9.5px;letter-spacing:.06em;padding:2px 7px}
.travaux .f .t span.infos{display:block;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  font-size:11.5px;color:var(--ink-3)}
.travaux .f .t span.lu{display:block;margin-top:2px;font-size:11.5px;font-weight:600}
.travaux .f .t span.lu.na{font-weight:500}
.travaux .f .saisie{margin-top:2px;font-size:11.5px}
.travaux .f .droite{flex:0 0 auto;display:flex;align-items:center;gap:4px}
.travaux .f .part{margin:0;min-height:30px;padding:5px 11px;font-size:12px;border-radius:999px;border-color:var(--rule)}
.travaux .f .sup{margin:0;width:28px;height:28px;min-height:28px;font-size:17px;border-radius:999px}
.travaux .f .ok-saisie{min-height:30px}
.travaux .actions{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:9px 12px 11px 14px;
  border-top:1px solid var(--rule);background:#FAFBFC}
.travaux .actions button{min-height:32px;padding:6px 12px;font-size:12px;border-radius:999px;
  background:#fff;color:var(--ink-2);border:1px solid var(--rule);box-shadow:none}
.travaux .actions button.danger{background:#fff;color:var(--rouge);border-color:rgba(160,58,51,.25)}
.travaux .actions .hint{flex:1 1 180px;margin:0;font-size:11.5px}
#compteur{font-size:12px;color:var(--sur-fond-2);text-align:center}
.restaurer{margin-top:18px;padding:12px 14px}
.restaurer .act.ghost{min-height:38px;padding:8px 14px;font-size:13px}
.restaurer .hint{font-size:12px}

@keyframes ficheArrive{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes docsDeplie{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.travaux{animation:ficheArrive .32s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 40ms)}
.travaux.ouvert .fichiers{animation:docsDeplie .2s cubic-bezier(.2,.8,.2,1)}
@media (hover:hover){
  .travaux .head:hover .titre b{color:var(--accent-fonce)}
  .travaux .outil:hover{background:#FAFBFC;border-color:#BFC7D1;color:var(--ink)}
  .travaux .f:hover{background:#FAFBFC}
  .travaux .actions button:hover{border-color:#BFC7D1;color:var(--ink)}
}
/* sur téléphone, une commande garde son titre entier : ses boutons passent dessous */
@media (max-width:599px){
  .travaux .f:has(.ok-saisie){flex-wrap:wrap;row-gap:6px}
  .travaux .f:has(.ok-saisie) .t{flex-basis:100%}
  .travaux .f:has(.ok-saisie) .droite{margin-left:auto}
}
@media (min-width:600px){
  .travaux .outil{width:auto;padding:0 11px}
  .travaux .outil .lib{display:inline}
}
@media (min-width:820px){
  main{max-width:780px}
}
@media (prefers-reduced-motion:reduce){
  .travaux,.travaux.ouvert .fichiers{animation:none}
  .travaux .pli svg{transition:none}
}

/* ---------- le sous-dossier « Suivi de chantier » ---------- */
.travaux .sous-dossier{border-bottom:1px solid #EEF1F4}
.travaux .sous-dossier .ds-tete{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:9px 12px 9px 14px;border:0;
  border-radius:0;background:#F8FAFC;color:var(--ink);font-family:inherit;text-align:left;cursor:pointer;box-shadow:none}
.travaux .sous-dossier .ds-ico{flex:0 0 auto;width:19px;height:19px;stroke:var(--accent);fill:var(--accent-soft);stroke-width:1.8;stroke-linejoin:round}
.travaux .sous-dossier .ds-nom{flex:1 1 auto;font-size:14px;font-weight:700}
.travaux .sous-dossier .neuf{flex:0 0 auto;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:#EA7A1E;color:#fff}
.travaux .sous-dossier .ds-nb{flex:0 0 auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:#fff;
  font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.travaux .sous-dossier .ds-pli{flex:0 0 auto;width:16px;height:16px;stroke:var(--ink-3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.travaux .sous-dossier .ds-tete[aria-expanded="true"] .ds-pli{transform:rotate(180deg)}
.travaux .sous-dossier .ds-liste{padding-left:12px;background:#FBFCFD}
.travaux .sous-dossier .ds-liste[hidden]{display:none}
@media (prefers-reduced-motion:reduce){ .travaux .sous-dossier .ds-pli{transition:none} }
/* le sous-dossier des photos prend la teinte des étiquettes photo */
.travaux .dossier-photos .ds-ico{stroke:var(--violet);fill:var(--violet-soft)}
/* « Tout télécharger », en tête du dossier des photos */
.travaux .ds-export{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 12px 9px 14px;border-bottom:1px solid #EEF1F4}
.travaux .ds-export .ds-tout{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:6px 14px;border-radius:999px;
  border:1px solid var(--rule);background:#fff;color:var(--ink);font-family:inherit;font-size:12.5px;font-weight:600;box-shadow:none;cursor:pointer}
.travaux .ds-export .ds-tout svg{width:15px;height:15px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.travaux .ds-export .ds-tout[disabled]{opacity:.6;cursor:progress}
.travaux .ds-export .hint{margin:0;font-size:11.5px}
@media (hover:hover){ .travaux .ds-export .ds-tout:hover{border-color:#BFC7D1;background:#FAFBFC} }
</style>

  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
    <div style="display:flex;align-items:center;gap:10px">
      <a href="./index.html" style="display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:var(--r-field);background:rgba(140,132,117,.14);color:var(--ink-2);font-size:13px;font-weight:600;text-decoration:none">Menu</a>

/* ---------- export des photos en ZIP (sans bibliothèque) ---------- */
var CRC_TABLE = (function(){
  var t=new Uint32Array(256);
  for(var n=0;n<256;n++){
    var c=n;
    for(var k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1);
    t[n]=c>>>0;
  }
  return t;
})();
function crc32(buf){
  var c=0xFFFFFFFF;
  for(var i=0;i<buf.length;i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c>>>8);
  return (c ^ 0xFFFFFFFF)>>>0;
}
function b64ToBytes(b64){
  var bin=atob(b64), out=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}
function nomFichier(t){
  return String(t||"photo").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^A-Za-z0-9 _-]+/g,"").trim().replace(/\s+/g,"-").slice(0,48) || "photo";
}
function creerZip(fichiers){          /* [{nom, octets}] -> Blob */
  var enc=new TextEncoder(), morceaux=[], central=[], offset=0;
  function u32(n){ return new Uint8Array([n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255]); }
  function u16(n){ return new Uint8Array([n&255,(n>>>8)&255]); }
  fichiers.forEach(function(f){
    var nom=enc.encode(f.nom), data=f.octets, crc=crc32(data);
    var entete=[
      u32(0x04034b50), u16(20), u16(0x0800), u16(0), u16(0), u16(0),
      u32(crc), u32(data.length), u32(data.length), u16(nom.length), u16(0), nom
    ];
    entete.forEach(function(p){ morceaux.push(p); });
    morceaux.push(data);
    central.push({nom:nom, crc:crc, taille:data.length, offset:offset});
    offset += 30 + nom.length + data.length;
  });
  var debutCentral=offset, tailleCentral=0;
  central.forEach(function(c){
    var e=[
      u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0), u16(0), u16(0),
      u32(c.crc), u32(c.taille), u32(c.taille), u16(c.nom.length),
      u16(0), u16(0), u16(0), u16(0), u32(0), u32(c.offset), c.nom
    ];
    e.forEach(function(p){ morceaux.push(p); });
    tailleCentral += 46 + c.nom.length;
  });
  [u32(0x06054b50), u16(0), u16(0), u16(central.length), u16(central.length),
   u32(tailleCentral), u32(debutCentral), u16(0)].forEach(function(p){ morceaux.push(p); });
  return new Blob(morceaux, {type:"application/zip"});
}

var TYPES_FICHIER = [

function typeDeNom(nom){

function dateDeNom(nom){

}
function octetsEnBase64(u8){
  var morceau=0x8000, bouts=[];
  for(var i=0;i<u8.length;i+=morceau){
    bouts.push(String.fromCharCode.apply(null, u8.subarray(i, i+morceau)));
  }
  return btoa(bouts.join(""));
}
function restaurerArchive(fichier){
  var etat=$("restaurerEtat");
  etat.textContent="Lecture de l'archive…";
  fichier.arrayBuffer()
    .then(function(buf){
      var entrees=lireArchive(new Uint8Array(buf));
      if(!entrees.length) throw new Error("vide");

      /* le nom du dossier donne la référence ; le premier fichier donne le client */
      var ref="", client="", adresse="";
      entrees.forEach(function(e){
        var parts=e.nom.split("/");
        if(parts.length>1 && !ref) ref=parts[0];
      });
      var contenu=entrees.filter(function(e){ return /00-contenu\.txt$/i.test(e.nom); })[0];
      if(contenu){
        var texte=new TextDecoder("utf-8").decode(contenu.octets);
        var m=/Travaux\s*:\s*(.+?)\s*\(([^)]+)\)/.exec(texte);
        if(m){ client=m[1].trim(); ref=m[2].trim() || ref; }
        var lignes=texte.split("\n");
        if(lignes.length>1 && lignes[1].trim() && lignes[1].indexOf("Archivé")<0) adresse=lignes[1].trim();
      }
      var docs=entrees.filter(function(e){ return /\.(pdf|zip)$/i.test(e.nom) && e.nom.indexOf("/fiches/")<0; });
      var fiches={};
      entrees.forEach(function(e){
        if(e.nom.indexOf("/fiches/")<0 || !/\.json$/i.test(e.nom)) return;
        fiches[e.nom.split("/fiches/")[1].replace(/\.json$/i, "")] = e.octets;
      });
      if(!docs.length) throw new Error("aucun document");
      if(!client) client=ref;

      if(!window.confirm("Restaurer « "+client+" » ("+ref+") ?\n\n"
        +docs.length+" document"+(docs.length>1?"s":"")+" sera"+(docs.length>1?"ont":"")+" remis sur le site, "
        +"attribué"+(docs.length>1?"s":"")+" à votre compte.")){ etat.textContent=""; return; }

      var faits=0;
      function suivant(i){
        if(i>=docs.length){
          etat.textContent = faits+" document"+(faits>1?"s":"")+" restauré"+(faits>1?"s":"")+" dans « "+client+" ».";
          charger();
          return;
        }
        var d=docs[i];
        var base=d.nom.split("/").pop().replace(/\.(pdf|zip)$/i, "");
        var t=typeDeNom(base);
        etat.textContent="Restauration "+(i+1)+" sur "+docs.length+" : "+t.titre+"…";
        fetch(API+"?action=publier", {method:"POST",
          headers:{"Content-Type":"application/json","x-auth":S.jeton},
          body:JSON.stringify({pdf:octetsEnBase64(d.octets), type:t.type, chantier:ref, client:client,
            adresse:adresse, date:dateDeNom(base), destinataires:[S.nom], titre:t.titre})})
          .then(function(r){ return r.json().then(function(x){ return {ok:r.ok, d:x}; }); })
          .then(function(res){
            if(!res.ok) throw new Error(res.d.erreur || "refus");
            faits++;
            var f=fiches[base];
            if(!f) return null;
            return fetch(API+"?action=deposer-fiche", {method:"POST",
              headers:{"Content-Type":"application/json","x-auth":S.jeton},
              body:JSON.stringify({cle:res.d.cle, donnees:new TextDecoder("utf-8").decode(f)})});
          })
          .then(function(){ suivant(i+1); })
          .catch(function(e){
            etat.textContent="Restauration interrompue : "+(e.message || "erreur")+". "
              +faits+" document"+(faits>1?"s":"")+" repris.";
            charger();
          });
      }
      suivant(0);
    })
    .catch(function(e){
      etat.textContent = e && e.message==="vide"
        ? "Archive illisible : ce fichier n'est pas une archive de dossier."
        : "Archive illisible ou incomplète.";
    });
}
function lireArchive(octets){
  /* nos archives sont écrites sans compression */
  var v=new DataView(octets.buffer, octets.byteOffset, octets.byteLength);
  var dec=new TextDecoder("utf-8");
  var out=[], i=0;
  while(i+30 <= octets.length){
    if(v.getUint32(i, true) !== 0x04034b50) break;
    var methode=v.getUint16(i+8, true);
    var taille=v.getUint32(i+18, true);
    var lgNom=v.getUint16(i+26, true);
    var lgExtra=v.getUint16(i+28, true);
    var nom=dec.decode(octets.subarray(i+30, i+30+lgNom));
    var debut=i+30+lgNom+lgExtra;
    if(methode===0 && taille>0) out.push({nom:nom, octets:octets.subarray(debut, debut+taille)});
    i = debut + taille;
  }
  return out;
}

/* ================= carte des chantiers =================

var CARTE = {lat:46.6, lon:1.9, zoom:6, source:"clair", cache:{}, echec:{}, echecs:0,

/* Les couches d'images, ce qu'elles savent faire :

             0 : un plan dont le texte deviendrait illisible à moitié

   Tous sont libres d'accès, sans clé ni compte. C'est la condition :

var COUCHES = {

  clair:     {nom:"Plan clair",        detail:"OpenStreetMap, rues et noms bien lisibles", max:20, couches:["clair"],  secours:"plan"},
  plan:      {nom:"Plan IGN",          detail:"Le plan officiel, très précis en France",  max:19, couches:["plan"],   secours:"clair"},

function toast(t){

function mondePx(lat, lon, z){
  var n = 256 * Math.pow(2, z);
  var x = (lon + 180) / 360 * n;
  var lr = lat * Math.PI / 180;
  var y = (1 - Math.log(Math.tan(lr) + 1 / Math.cos(lr)) / Math.PI) / 2 * n;
  return [x, y];
}
function pxMonde(x, y, z){
  var n = 256 * Math.pow(2, z);
  var lon = x / n * 360 - 180;
  var t = Math.PI - 2 * Math.PI * y / n;
  var lat = 180 / Math.PI * Math.atan(0.5 * (Math.exp(t) - Math.exp(-t)));
  return [lat, lon];
}
function urlsTuile(couche, z, x, y){
  if(couche === "clair"){
    /* OpenStreetMap mis en forme par CARTO (« Voyager ») : des couleurs
       douces, les rues et les noms nets. Les images doubles (@2x) sont
       faites pour les écrans de téléphone. */
    var sous="abcd".charAt((x + y) % 4);
    return "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/".replace("{s}", sous)
      +z+"/"+x+"/"+y+(CARTE.dpr >= 1.5 ? "@2x" : "")+".png";
  }
  if(couche === "express"){
    /* l'Ortho Express : l'IGN la reprend chaque année sur toute la
       France, un peu moins soignée que la photo habituelle mais plus
       récente. La couche de l'année est trouvée à l'ouverture. */
    return "https://data.geopf.fr/wmts?SERVICE=WMTS&VERSION=1.0.0&REQUEST=GetTile"
      +"&LAYER="+encodeURIComponent(CARTE.express)+"&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/jpeg"
      +"&TILEMATRIX="+z+"&TILEROW="+y+"&TILECOL="+x;
  }
  if(couche === "plan"){
    /* le plan des rues de l'IGN : service public, libre d'accès,
       couverture française au mètre près */
    return "https://data.geopf.fr/wmts?SERVICE=WMTS&VERSION=1.0.0&REQUEST=GetTile"
      +"&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/png"
      +"&TILEMATRIX="+z+"&TILEROW="+y+"&TILECOL="+x;
  }
  if(couche === "noms"){
    /* les noms de lieux et les limites, à poser sur le satellite */
    return "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/"
      +"World_Boundaries_and_Places/MapServer/tile/"+z+"/"+y+"/"+x;
  }
  if(couche === "ortho"){
    return "https://data.geopf.fr/wmts?SERVICE=WMTS&VERSION=1.0.0&REQUEST=GetTile"
      +"&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/jpeg"
      +"&TILEMATRIX="+z+"&TILEROW="+y+"&TILECOL="+x;
  }
  return "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/"+z+"/"+y+"/"+x;
}
function carteTuile(couche, z, x, y){
  var cle = couche+"/"+z+"/"+x+"/"+y;
  if(CARTE.cache[cle]) return Promise.resolve(CARTE.cache[cle]);
  if(CARTE.echec[cle]) return Promise.reject(new Error("tuile"));
  return fetch(urlsTuile(couche, z, x, y), {mode:"cors"})
    .then(function(r){
      if(!r.ok) throw new Error("tuile");
      if((r.headers.get("content-type")||"").indexOf("image") < 0) throw new Error("tuile");
      return r.blob();
    })
    .then(function(b){ return createImageBitmap(b); })
    .then(function(bmp){ CARTE.cache[cle]=bmp; return bmp; })
    .catch(function(e){ CARTE.echec[cle]=true; throw e; });
}
/* Un fond qui ne répond pas : on passe à son secours, sans jamais
   revenir sur un fond déjà essayé. */
function carteSecours(){
  var avant=CARTE.source;
  CARTE.essayes[avant]=true;
  var suivant=fond().secours, tours=0;
  while(suivant && CARTE.essayes[suivant] && tours++ < ORDRE_FONDS.length) suivant=(FONDS[suivant]||{}).secours;
  if(!suivant || CARTE.essayes[suivant]) return;
  CARTE.source=suivant;
  if(CARTE.zoom > fond().max) CARTE.zoom = fond().max;
  CARTE.echecs = 0;
  majBoutonFond();
  toast("Fond « " + nomFond(avant) + " » indisponible : passage sur « " + nomFond(suivant) + " ».");
  carteDessiner();
}
/* Le canevas est dessiné à la vraie finesse de l'écran : un iPhone
   affiche trois points là où l'ordinateur en met un. Tout le reste
   (épingles, doigts, souris) compte en pixels d'écran ordinaires :
   CARTE.L et CARTE.H. */
function carteTaille(){
  var cv=$("carte_canvas"), wrap=cv.parentNode;
  var L=Math.max(240, wrap.clientWidth), H=Math.max(240, wrap.clientHeight);
  var dpr=Math.min(3, Math.max(1, window.devicePixelRatio || 1));
  if(dpr !== CARTE.dpr){ CARTE.cache={}; CARTE.echec={}; }
  CARTE.L=L; CARTE.H=H; CARTE.dpr=dpr;
  var lp=Math.round(L*dpr), hp=Math.round(H*dpr);
  if(cv.width!==lp || cv.height!==hp){
    cv.width=lp; cv.height=hp;
    cv.style.width=L+"px"; cv.style.height=H+"px";
  }
}
function majBoutonFond(){
  var b=$("carte_source");
  if(b) b.textContent = nomFond(CARTE.source);
  var m=$("carte_fonds");
  if(m && !m.hidden) carteMenuFonds(true);
}
function carteEtat(){
  var e=$("carte_etat"); if(!e) return;
  var avec=CARTE.points.filter(function(p){ return p.lat!=null; }).length;
  var credit = fond().couches.map(function(c){ return COUCHES[c].mention; })
    .filter(function(m, i, t){ return m && t.indexOf(m) === i; }).join(" ");
  e.textContent = nomFond(CARTE.source) + "  ·  zoom " + CARTE.zoom
    + "  ·  " + avec + " chantier" + (avec>1?"s":"") + " situé" + (avec>1?"s":"")
    + "  ·  " + credit;
}
/* le zoom des images à demander pour une couche, et la taille (en
   pixels d'écran) à laquelle chacune se dessine */
function carteNiveau(couche){
  var K=COUCHES[couche];
  var dessus = (K.retina === 1 && CARTE.dpr >= 1.5) ? 1 : 0;
  var tz=Math.min(CARTE.zoom + dessus, K.max);
  return {tz:tz, taille:256*Math.pow(2, CARTE.zoom - tz)};
}
function carteDessiner(){
  var cv=$("carte_canvas"); if(!cv || $("carte").hidden) return;
  if(!CARTE.L) carteTaille();
  var ctx=cv.getContext("2d"), L=CARTE.L, H=CARTE.H, dpr=CARTE.dpr;
  var premiere=COUCHES[fond().couches[0]];
  ctx.setTransform(1,0,0,1,0,0);
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality="high";
  ctx.fillStyle=premiere.vide || "#1A1815"; ctx.fillRect(0,0,cv.width,cv.height);
  var c=mondePx(CARTE.lat, CARTE.lon, CARTE.zoom);
  var gauche=c[0]-L/2, haut=c[1]-H/2;
  var attendre=[];
  /* les couches dans l'ordre : le satellite d'abord, les noms par-dessus */
  fond().couches.forEach(function(couche){
    var niv=carteNiveau(couche), tz=niv.tz, taille=niv.taille, n=Math.pow(2, tz);
    var x0=Math.floor(gauche/taille), y0=Math.floor(haut/taille);
    var x1=Math.floor((gauche+L)/taille), y1=Math.floor((haut+H)/taille);
    for(var ty=y0; ty<=y1; ty++){
      if(ty<0 || ty>=n) continue;
      for(var tx=x0; tx<=x1; tx++){
        var wx=((tx%n)+n)%n;
        /* bords arrondis au point d'écran près : pas de fente entre deux images */
        var X=Math.round((tx*taille-gauche)*dpr), Y=Math.round((ty*taille-haut)*dpr);
        var W=Math.round(((tx+1)*taille-gauche)*dpr)-X, Hh=Math.round(((ty+1)*taille-haut)*dpr)-Y;
        var cle=couche+"/"+tz+"/"+wx+"/"+ty;
        var bmp=CARTE.cache[cle];
        if(bmp){ ctx.drawImage(bmp, X, Y, W, Hh); continue; }
        /* en attendant, l'image du zoom d'avant, agrandie : la carte ne
           passe jamais par le noir quand on zoome */
        for(var k=1; k<=4 && tz-k>=0; k++){
          var parent=CARTE.cache[couche+"/"+(tz-k)+"/"+(wx>>k)+"/"+(ty>>k)];
          if(!parent) continue;
          var cote=parent.width/Math.pow(2,k);
          ctx.drawImage(parent, (wx-((wx>>k)<<k))*cote, (ty-((ty>>k)<<k))*cote, cote, cote, X, Y, W, Hh);
          break;
        }
        if(!CARTE.echec[cle]) attendre.push([couche, tz, wx, ty]);
      }
    }
  });
  attendre.forEach(function(t){
    carteTuile(t[0], t[1], t[2], t[3])
      .then(function(){ carteRedessiner(); })
      .catch(function(){
        /* les noms qui manquent ne valent pas qu'on change de fond, et
           une image d'un fond qu'on a déjà quitté ne compte plus */
        if(t[0] === "noms" || fond().couches.indexOf(t[0]) < 0) return;
        CARTE.echecs++;
        if(CARTE.echecs >= 4) carteSecours();
      });
  });
  ctx.setTransform(dpr,0,0,dpr,0,0);
  carteEpingles(ctx, gauche, haut);
  if(CARTE.pose) carteReticule(ctx, L, H);
  carteEtat();
}
function carteRedessiner(){
  if(CARTE.rendu) return;
  CARTE.rendu = requestAnimationFrame(function(){ CARTE.rendu=0; carteDessiner(); });
}
function carteReticule(ctx, L, H){
  var mx=L/2, my=H/2;
  ctx.save();
  ctx.strokeStyle="rgba(255,255,255,.9)"; ctx.lineWidth=1.6;
  ctx.beginPath();
  ctx.moveTo(mx-16,my); ctx.lineTo(mx-5,my);
  ctx.moveTo(mx+5,my); ctx.lineTo(mx+16,my);
  ctx.moveTo(mx,my-16); ctx.lineTo(mx,my-5);
  ctx.moveTo(mx,my+5); ctx.lineTo(mx,my+16);
  ctx.stroke();
  ctx.strokeStyle="rgba(0,0,0,.45)"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(mx,my,20,0,Math.PI*2); ctx.stroke();
  ctx.restore();
}
function carteEcran(p, gauche, haut){
  var w=mondePx(p.lat, p.lon, CARTE.zoom);
  return [w[0]-gauche, w[1]-haut];
}
function carteEpingles(ctx, gauche, haut){
  var L=CARTE.L, H=CARTE.H;
  var nomme = CARTE.zoom >= 10 || CARTE.points.length <= 12;
  CARTE.points.forEach(function(p){
    if(p.lat == null) return;
    var e=carteEcran(p, gauche, haut);
    p.ecran=e;
    if(e[0] < -40 || e[0] > L+40 || e[1] < -50 || e[1] > H+40) return;
    var choisi = CARTE.choisi === p.ref;
    var r = choisi ? 11 : 8;
    ctx.save();
    /* la pointe */
    ctx.beginPath();
    ctx.moveTo(e[0], e[1]);
    ctx.lineTo(e[0]-r*0.55, e[1]-r*1.25);
    ctx.lineTo(e[0]+r*0.55, e[1]-r*1.25);
    ctx.closePath();
    ctx.fillStyle = choisi ? "#B45309" : "#EA7A1E";
    ctx.fill();
    /* la tête */
    ctx.beginPath();
    ctx.arc(e[0], e[1]-r*1.6, r, 0, Math.PI*2);
    ctx.fillStyle = choisi ? "#B45309" : "#EA7A1E";
    ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle="rgba(255,255,255,.92)"; ctx.stroke();
    if(nomme){
      var nom=String(p.client || p.ref || "").slice(0, 22);
      if(nom){
        ctx.font="600 11.5px \"Plus Jakarta Sans\", -apple-system, system-ui, sans-serif";
        ctx.textAlign="center";
        var l=ctx.measureText(nom).width;
        ctx.fillStyle="rgba(10,14,20,.8)";
        ctx.beginPath();
        if(ctx.roundRect) ctx.roundRect(e[0]-l/2-6, e[1]+4, l+12, 17, 8.5);
        else ctx.rect(e[0]-l/2-6, e[1]+4, l+12, 17);
        ctx.fill();
        ctx.fillStyle="#F2F5F9";
        ctx.fillText(nom, e[0], e[1]+16.5);
      }
    }
    ctx.restore();
  });
}
function carteZoom(d, autour){
  var z=CARTE.zoom+d;
  if(z < 4) z = 4;
  if(z > fond().max){
    toast("Zoom maximum atteint pour ce fond.");
    z = fond().max;
  }
  if(z === CARTE.zoom) return;
  if(autour){
    /* garder sous le curseur le point que l'on vise */
    var c=mondePx(CARTE.lat, CARTE.lon, CARTE.zoom);
    var vise=pxMonde(c[0]-CARTE.L/2+autour[0], c[1]-CARTE.H/2+autour[1], CARTE.zoom);
    CARTE.zoom=z;
    var v=mondePx(vise[0], vise[1], z);
    var centre=pxMonde(v[0]+CARTE.L/2-autour[0], v[1]+CARTE.H/2-autour[1], z);
    CARTE.lat=centre[0]; CARTE.lon=centre[1];
  } else {
    CARTE.zoom=z;
  }
  carteDessiner();
}
function carteCadrer(){
  var pts=CARTE.points.filter(function(p){ return p.lat!=null; });
  if(!pts.length){ CARTE.lat=46.6; CARTE.lon=1.9; CARTE.zoom=6; carteDessiner(); return; }
  if(pts.length === 1){
    CARTE.lat=pts[0].lat; CARTE.lon=pts[0].lon; CARTE.zoom=15; carteDessiner(); return;
  }
  var L=CARTE.L, H=CARTE.H;
  var z=Math.min(fond().max, 18);
  for(; z>4; z--){
    var xs=[], ys=[];
    pts.forEach(function(p){ var w=mondePx(p.lat,p.lon,z); xs.push(w[0]); ys.push(w[1]); });
    var lx=Math.max.apply(null,xs)-Math.min.apply(null,xs);
    var ly=Math.max.apply(null,ys)-Math.min.apply(null,ys);
    if(lx <= L-80 && ly <= H-100) break;
  }
  CARTE.zoom=z;
  var mx=0, my=0;
  pts.forEach(function(p){ var w=mondePx(p.lat,p.lon,z); mx+=w[0]; my+=w[1]; });
  var mid=pxMonde(mx/pts.length, my/pts.length, z);
  CARTE.lat=mid[0]; CARTE.lon=mid[1];
  carteDessiner();
}

/* ---------- la fiche d'un chantier, en bas de la carte ---------- */
function carteFermerFiche(){
  CARTE.choisi=null;
  $("carte_fiche").hidden=true;
  carteRedessiner();
}
function carteFiche(p){
  CARTE.choisi=p.ref;
  var f=$("carte_fiche");
  f.textContent="";
  var r=document.createElement("span"); r.className="ref"; r.textContent=p.ref;
  var b=document.createElement("b"); b.textContent=p.client || p.ref;
  var a=document.createElement("p"); a.className="adr";
  a.textContent=(p.adresse||"").replace(/\n/g, ", ")
    + (p.lat!=null ? "   ·   "+p.lat.toFixed(5).replace(".",",")+", "+p.lon.toFixed(5).replace(".",",") : "");
  var btns=document.createElement("div"); btns.className="btns";

  var voir=document.createElement("button");
  voir.type="button"; voir.className="go"; voir.textContent="Voir le dossier";
  voir.addEventListener("click", function(){ carteAuDossier(p.ref); });
  btns.appendChild(voir);

  if(p.lat!=null || (p.adresse||"").trim()){
    var iti=document.createElement("button");
    iti.type="button"; iti.textContent="Itinéraire";
    iti.addEventListener("click", function(){
      var dest = p.lat!=null ? (p.lat+","+p.lon) : String(p.adresse).replace(/\n/g, ", ");
      window.open("https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(dest), "_blank");
    });
    btns.appendChild(iti);
  }

  var corr=document.createElement("button");
  corr.type="button"; corr.textContent = p.lat!=null ? "Corriger la position" : "Poser la position";
  corr.addEventListener("click", function(){ cartePoseDebut(p); });
  btns.appendChild(corr);

  var fermer=document.createElement("button");
  fermer.type="button"; fermer.textContent="Fermer";
  fermer.addEventListener("click", carteFermerFiche);
  btns.appendChild(fermer);

  f.appendChild(r); f.appendChild(b); f.appendChild(a); f.appendChild(btns);
  f.hidden=false;
  carteRedessiner();
}
function carteAuDossier(ref){
  $("carte").hidden=true;
  $("recherche").value=ref;
  afficher(filtrer());
  var box=$("liste").querySelector(".travaux");
  if(box){
    box.scrollIntoView({behavior:"smooth", block:"start"});
    if(box.__deplier) box.__deplier(true);
  }
}

/* ---------- poser une position à la main ---------- */
function cartePoseDebut(p){
  CARTE.pose=p.ref;
  $("carte_fiche").hidden=true;
  $("carte_pose").hidden=false;
  $("carte_recherche").hidden=false;
  $("carte_pose_titre").textContent="Centrez la carte sur « "+(p.client||p.ref)+" », puis posez le point";
  if(p.lat!=null){ CARTE.lat=p.lat; CARTE.lon=p.lon; }
  if(CARTE.zoom < 16) CARTE.zoom=Math.min(17, fond().max);
  carteDessiner();
}
function cartePoseFin(){
  CARTE.pose="";
  $("carte_pose").hidden=true;
  carteRedessiner();
}
function cartePoser(){
  var ref=CARTE.pose;
  var p=CARTE.points.filter(function(x){ return x.ref===ref; })[0];
  if(!p){ cartePoseFin(); return; }
  var lat=CARTE.lat, lon=CARTE.lon;
  p.lat=lat; p.lon=lon; p.situe="main";
  cartePoseFin();
  carteEnregistrerPosition(ref, lat, lon, function(ok, erreur){
    toast(ok ? "Position enregistrée pour "+(p.client||ref)+"."
             : (erreur || "Position gardée ici seulement : le site n'a pas répondu."));
  });
}
function carteEnregistrerPosition(ref, lat, lon, fin){
  fetch(API+"?action=position-enregistrer", {
    method:"POST",
    headers:{"content-type":"application/json", "x-auth":S.jeton},
    body:JSON.stringify({ref:ref, lat:lat, lon:lon})
  })
    .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d}; }); })
    .then(function(res){
      var c=CHANTIERS.filter(function(x){ return x.ref===ref; })[0];
      if(res.ok && c){ c.lat=lat; c.lon=lon; }
      if(fin) fin(res.ok, res.d && res.d.erreur);
    })
    .catch(function(){ if(fin) fin(false); });
}

/* ---------- chercher les chantiers sans position ---------- */
function carteChercherManquants(){
  function bilan(){
    var sans=CARTE.points.filter(function(p){ return p.lat==null; }).length;
    $("carte_titre").textContent = sans
      ? sans+" dossier"+(sans>1?"s":"")+" sans adresse trouvée : posez le point à la main"
      : "Vos chantiers";
    carteEtat();
  }
  var reste=CARTE.points.filter(function(p){ return p.lat==null && (p.adresse||"").trim(); });
  if(!reste.length){ bilan(); return; }
  var i=0;
  function suivant(){
    if(i >= reste.length || $("carte").hidden){ bilan(); return; }
    var p=reste[i++];
    $("carte_titre").textContent="Recherche des adresses… "+i+"/"+reste.length;
    fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q="
          +encodeURIComponent(String(p.adresse).replace(/\n/g, ", ")))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d && d.length){
          p.lat=parseFloat(d[0].lat); p.lon=parseFloat(d[0].lon); p.situe="adresse";
          carteRedessiner();
          carteEnregistrerPosition(p.ref, p.lat, p.lon, null);
        }
      })
      .catch(function(){})
      /* une recherche à la fois, sans bousculer le service public */
      .then(function(){ setTimeout(suivant, 1200); });
  }
  suivant();
}
function carteChercherAdresse(){
  var champ=$("carte_q"); if(!champ) return;
  var q=(champ.value||"").trim();
  if(!q){ toast("Tapez une adresse ou une commune."); return; }
  fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q="+encodeURIComponent(q))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d || !d.length){ toast("Adresse introuvable."); return; }
      CARTE.lat=parseFloat(d[0].lat); CARTE.lon=parseFloat(d[0].lon);
      CARTE.zoom=Math.min(16, fond().max);
      carteDessiner();
      toast(String(d[0].display_name||"").split(",").slice(0,3).join(",").trim() || "Position trouvée.");
    })
    .catch(function(){ toast("Recherche indisponible : déplacez la carte à la main."); });
}

/* ---------- le choix du fond ---------- */
function carteMenuFonds(ouvrir){
  var m=$("carte_fonds"), b=$("carte_source");
  if(!ouvrir){ m.hidden=true; b.setAttribute("aria-expanded","false"); return; }
  m.textContent="";
  ORDRE_FONDS.forEach(function(cle){
    var o=document.createElement("button");
    o.type="button"; o.setAttribute("role","menuitemradio");
    o.setAttribute("data-fond", cle);
    o.setAttribute("aria-checked", cle === CARTE.source ? "true" : "false");
    var t=document.createElement("b"); t.textContent=nomFond(cle);
    var d=document.createElement("span"); d.textContent=FONDS[cle].detail;
    o.appendChild(t); o.appendChild(d);
    o.addEventListener("click", function(){ carteChoisirFond(cle); carteMenuFonds(false); });
    m.appendChild(o);
  });
  m.hidden=false; b.setAttribute("aria-expanded","true");
}
function carteChoisirFond(cle){
  if(!FONDS[cle]) return;
  if(cle === "recent" && !CARTE.express){
    toast("Recherche de la prise de vue la plus récente…");
    carteTrouverExpress().then(function(ok){
      if(ok){ carteChoisirFond("recent"); toast("Fond : " + nomFond("recent")); }
      else { toast("Pas de prise de vue récente disponible : photo IGN habituelle."); carteChoisirFond("satellite"); }
    });
    return;
  }
  CARTE.source=cle; CARTE.essayes={}; CARTE.echecs=0;
  try{ localStorage.setItem("carte:fond", cle); }catch(e){}
  if(CARTE.zoom > fond().max) CARTE.zoom=fond().max;
  majBoutonFond();
  carteDessiner();
}
/* L'IGN publie une couche Ortho Express par année. Son nom exact n'est
   pas garanti : on essaie de la plus récente à la plus ancienne, sur
   une image du centre de la carte, et on retient la première qui
   répond vraiment par une image. */
function carteCandidatsExpress(){
  var liste=[], an=new Date().getFullYear();
  for(var a=an; a>=2020; a--){
    liste.push("ORTHOIMAGERY.ORTHOPHOTOS.ORTHO-EXPRESS."+a);
    liste.push("ORTHOIMAGERY.ORTHO-EXPRESS."+a);
  }
  liste.push("ORTHOIMAGERY.ORTHOPHOTOS.ORTHO-EXPRESS");
  return liste;
}
function carteTrouverExpress(){
  var z=12, w=mondePx(CARTE.lat, CARTE.lon, z);
  var x=Math.floor(w[0]/256), y=Math.floor(w[1]/256);
  var liste=carteCandidatsExpress(), i=0;
  function essai(){
    if(i >= liste.length) return Promise.resolve(false);
    var couche=liste[i++];
    var url="https://data.geopf.fr/wmts?SERVICE=WMTS&VERSION=1.0.0&REQUEST=GetTile"
      +"&LAYER="+encodeURIComponent(couche)+"&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/jpeg"
      +"&TILEMATRIX="+z+"&TILEROW="+y+"&TILECOL="+x;
    return fetch(url, {mode:"cors"})
      .then(function(r){
        if(!r.ok || (r.headers.get("content-type")||"").indexOf("image") < 0) return essai();
        CARTE.express=couche;
        try{ localStorage.setItem("carte:express", JSON.stringify({couche:couche, le:Date.now()})); }catch(e){}
        return true;
      })
      .catch(function(){ return essai(); });
  }
  return essai();
}

/* ---------- ouverture ---------- */
function carteOuvrir(){
  CARTE.points = actifs().map(function(c){
    return {ref:c.ref, client:c.client||"", adresse:c.adresse||"", documents:(c.fichiers||[]).length,
            lat: typeof c.lat==="number" ? c.lat : null,
            lon: typeof c.lon==="number" ? c.lon : null,
            situe: typeof c.lat==="number" ? "connue" : ""};
  });
  CARTE.choisi=null; CARTE.pose=""; CARTE.echecs=0; CARTE.essayes={};
  if(CARTE.source === "recent" && !CARTE.express) CARTE.source="satellite";
  carteMenuFonds(false);
  $("carte_fiche").hidden=true;
  $("carte_pose").hidden=true;
  $("carte").hidden=false;
  majBoutonFond();
  carteTaille();
  carteCadrer();
  carteChercherManquants();
}
function carteMajBouton(){
  var n=actifs().length;
  $("barreCarte").hidden = !n;
  var situes=actifs().filter(function(c){ return typeof c.lat==="number"; }).length;
  $("carteHint").textContent = n
    ? (situes ? situes+" sur "+n+" déjà situé"+(situes>1?"s":"") : "les adresses seront cherchées à l'ouverture")
    : "";
  $("btnCarte").title = "Carte des chantiers" + ($("carteHint").textContent ? " — "+$("carteHint").textContent : "");
}

(function carteBind(){
  var cv=$("carte_canvas");
  var drag=false, bouge=false, last=null, depart=null;
  var doigts=new Map(), ecartDepart=null;
  function point(e){ return [e.clientX, e.clientY]; }
  function dansCanvas(e){
    var r=cv.getBoundingClientRect();
    return [e.clientX-r.left, e.clientY-r.top];
  }
  function ecart(){
    var t=Array.from(doigts.values());
    return Math.hypot(t[0][0]-t[1][0], t[0][1]-t[1][1]) || 1;
  }
  cv.addEventListener("pointerdown", function(e){
    doigts.set(e.pointerId, point(e));
    if(doigts.size === 2){ drag=false; ecartDepart=ecart(); return; }
    drag=true; bouge=false; last=point(e); depart=point(e);
  });
  cv.addEventListener("pointermove", function(e){
    if(doigts.has(e.pointerId)) doigts.set(e.pointerId, point(e));
    if(doigts.size >= 2 && ecartDepart){
      var f=ecart()/ecartDepart;
      if(f > 1.6){ ecartDepart=ecart(); carteZoom(1); }
      else if(f < 0.62){ ecartDepart=ecart(); carteZoom(-1); }
      return;
    }
    if(!drag) return;
    var p=point(e), dx=p[0]-last[0], dy=p[1]-last[1];
    if(Math.abs(p[0]-depart[0]) > 4 || Math.abs(p[1]-depart[1]) > 4) bouge=true;
    last=p;
    var c=mondePx(CARTE.lat, CARTE.lon, CARTE.zoom);
    var ll=pxMonde(c[0]-dx, c[1]-dy, CARTE.zoom);
    CARTE.lat=ll[0]; CARTE.lon=ll[1];
    carteRedessiner();
  });
  ["pointerup","pointercancel","pointerleave"].forEach(function(ev){
    cv.addEventListener(ev, function(e){
      if(ev === "pointerup" && drag && !bouge) carteClic(dansCanvas(e));
      doigts.delete(e.pointerId);
      if(doigts.size < 2) ecartDepart=null;
      drag=false;
    });
  });
  /* un cran de molette = un niveau entier de zoom (la carte double ou
     divise par deux) : trop brusque d'un coup. On compte les crans
     plutôt que la valeur brute de deltaY (qui varie trop d'un
     navigateur à l'autre), et il en faut deux dans le même sens avant
     de vraiment zoomer. */
  var carteRoue={n:0, sens:0};
  cv.addEventListener("wheel", function(e){
    e.preventDefault();
    var sens = e.deltaY < 0 ? 1 : -1;
    if(sens !== carteRoue.sens){ carteRoue.n=0; carteRoue.sens=sens; }
    carteRoue.n++;
    if(carteRoue.n < 2) return;
    carteRoue.n=0;
    carteZoom(sens, dansCanvas(e));
  }, {passive:false});
  /* double-clic : on zoome sur l'endroit visé, comme sur Google Maps */
  cv.addEventListener("dblclick", function(e){
    e.preventDefault();
    carteZoom(1, dansCanvas(e));
  });

  function carteClic(xy){
    if(CARTE.pose) return;              /* en pose, le clic ne choisit rien */
    var meilleur=null, d2=26*26;
    CARTE.points.forEach(function(p){
      if(p.lat == null || !p.ecran) return;
      var dx=p.ecran[0]-xy[0], dy=(p.ecran[1]-13)-xy[1];
      var d=dx*dx+dy*dy;
      if(d < d2){ d2=d; meilleur=p; }
    });
    if(meilleur) carteFiche(meilleur);
    else carteFermerFiche();
  }

  $("btnCarte").addEventListener("click", carteOuvrir);
  $("carte_cancel").addEventListener("click", function(){ $("carte").hidden=true; });
  $("carte_tout").addEventListener("click", function(){ carteFermerFiche(); carteCadrer(); });
  $("carte_plus").addEventListener("click", function(){ carteZoom(1); });
  $("carte_moins").addEventListener("click", function(){ carteZoom(-1); });
  $("carte_source").addEventListener("click", function(){
    carteMenuFonds($("carte_fonds").hidden);
  });
  cv.addEventListener("pointerdown", function(){ carteMenuFonds(false); });
  $("carte_chercher").addEventListener("click", carteChercherAdresse);
  $("carte_q").addEventListener("keydown", function(e){
    if(e.key === "Enter"){ e.preventDefault(); carteChercherAdresse(); }
  });
  $("carte_pose_ok").addEventListener("click", cartePoser);
  $("carte_pose_annuler").addEventListener("click", cartePoseFin);
  window.addEventListener("resize", function(){
    if($("carte").hidden) return;
    carteTaille(); carteRedessiner();
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && !$("carte").hidden){
      if(!$("carte_fonds").hidden){ carteMenuFonds(false); $("carte_source").focus(); }
      else if(CARTE.pose) cartePoseFin();
      else $("carte").hidden=true;
    }
  });
})();

$("recherche").addEventListener("input", function(){ afficher(filtrer()); });
if(S && S.jeton) charger();
</script>
