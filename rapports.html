<style>
:root{--bg:#F4F1EA;--card:#fff;--field:#EFEBE1;--ink:#22201C;--ink-2:#6E675C;--ink-3:#8C8475;
 --rule:#E2DCCE;--accent:#B4621A;--accent-soft:#FBEDE0;--solar:#E8A33D;--solar-soft:#FBEDE0;
 --shadow:0 1px 0 rgba(34,32,28,.05)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;letter-spacing:-.01em;
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:0;z-index:10;background:rgba(241,243,247,.86);backdrop-filter:saturate(180%) blur(20px);
 -webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(34,32,28,.07);
 padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px}
h1{font-size:21px;font-weight:700;letter-spacing:-.03em;margin:0}
main{max-width:640px;margin:0 auto;padding:16px}
.block{background:var(--card);border-radius:2px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.block h2{font-size:17px;font-weight:700;letter-spacing:-.02em;margin:0 0 12px}
input{width:100%;min-height:48px;padding:12px 14px;font-size:16px;font-family:inherit;color:var(--ink);
 background:var(--field);border:1px solid transparent;border-radius:2px}
input:focus{outline:none;background:#fff;border-color:var(--accent);box-shadow:0 0 0 4px rgba(180,98,26,.16)}
label span{display:block;font-size:13.5px;color:var(--ink-2);margin-bottom:6px}
button{min-height:48px;padding:12px 18px;border:0;border-radius:2px;background:var(--accent);color:#fff;
 font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
button:active{transform:scale(.975)}
button.ghost{background:var(--accent-soft);color:var(--accent)}
.hint{font-size:13px;color:var(--ink-3);margin:10px 0 0}
.err{font-size:14px;color:#A6291F;margin:10px 0 0}
.travaux{background:var(--card);border-radius:2px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.travaux .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;cursor:pointer}
.travaux .head b{flex:1;font-size:16px;letter-spacing:-.02em}
.travaux .head .n{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.travaux .head .barre{display:flex;gap:8px;flex-wrap:wrap;width:100%;margin-top:2px}
.travaux .head .ref{font-size:12px;font-weight:700;color:#fff;background:var(--accent);border-radius:2px;padding:3px 8px}
.fichiers{border-top:1px solid var(--rule);padding:6px 0}
.f{display:flex;align-items:center;gap:12px;padding:12px 16px;text-decoration:none;color:inherit;border-bottom:1px solid var(--rule)}
.f:last-child{border-bottom:0}
.f .t{flex:1}
.f .t b{display:block;font-size:15px;font-weight:600}
.f .t span{display:block;font-size:12.5px;color:var(--ink-3)}
.f .t span.lu{margin-top:3px;font-size:12px;font-weight:600;color:#0B7A45}
.f .t span.lu.na{color:#8C8475;font-weight:500}
.f .tag{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:2px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.f .tag.suivi{background:var(--solar-soft);color:#7A5200}
.f .tag.commande{background:#EDF0E4;color:#0B7A45}
.f .tag.photos{background:#EDEAFB;color:#5B3FD6}
.f .tag.reportage{background:#EDEAFB;color:#4B36AE;font-weight:700}
.f .tag.reception{background:#EDF0E4;color:#0B7A45;font-weight:700}
.f .tag.etiq{background:#F1F0EC;color:#6B6455}
.f .tag.sav{background:#F8E4E0;color:#B3332C;font-weight:700}
.vide{color:var(--ink-3);font-size:14.5px;text-align:center;padding:26px 10px}
.hint{font-size:13px;color:var(--ink-3)}
.actions{display:flex;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--rule)}
.actions button{min-height:40px;padding:9px 14px;border:0;border-radius:2px;font-size:13.5px;font-weight:600;
 font-family:inherit;cursor:pointer;background:var(--accent-soft);color:var(--accent)}
.actions button.danger{background:#F8E4E0;color:#A6291F}

html{-webkit-text-size-adjust:100%}
body{touch-action:manipulation}          /* le double appui ne zoome plus */
button,.act,.chip,label,input,select,textarea,a{touch-action:manipulation}

.f .sup{flex:0 0 auto;width:32px;height:32px;min-height:32px;padding:0;margin-left:6px;border:0;
 background:none;color:var(--ink-3);font-size:19px;line-height:1;cursor:pointer;border-radius:2px}

/* ---------- écrans larges : ordinateur et tablette ---------- */

  body{padding:28px 24px 40px}

  .salut,.tete .salut{font-size:30px}

  a.etape{border-bottom:1px solid var(--rule)}

  .bulletin{padding:18px 22px}

}

  main{max-width:1120px}
}
@media (hover:hover){
  .notif:hover,.bref a:hover,a.etape:hover,a.appoint:hover,a.tuile:hover,.raccourci:hover{
    background:rgba(180,98,26,.06)}
  button.p:hover,button.act:hover{filter:brightness(.97)}
}

.f .part{flex:0 0 auto;margin-left:6px;width:32px;height:32px;padding:0;border:0;background:none;
 color:var(--ink-3);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:2px}
.f .part:active{background:var(--field);color:var(--accent)}

.head .iti{margin-left:8px;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--rule);
 background:var(--card);color:var(--ink-2);font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;border-radius:2px}
.head .iti:active{background:var(--field);color:var(--accent)}
.head .adr{display:block;font-size:12px;color:var(--ink-3);margin-top:3px}

.head .iti svg{color:var(--accent)}

.restaurer{border:1px solid var(--rule);background:var(--card);padding:13px 15px;margin-bottom:16px}
.restaurer .hint{margin:9px 0 0}
</style>

         style="margin-bottom:14px" hidden>

<script>
/* ---------- session expirée : retour à la connexion ---------- */
(function(){
  var brut = window.fetch;
  window.fetch = function(){
    return brut.apply(this, arguments).then(function(r){
      if(r && r.status === 401){
        try{
          r.clone().json().then(function(d){
            if(d && d.erreur && String(d.erreur).indexOf("Session") >= 0){
              try{ localStorage.removeItem("outils:session"); }catch(e){}
              location.replace("./index.html");
            }
          }).catch(function(){});
        }catch(e){}
      }
      return r;
    });
  };
})();

var $=function(i){return document.getElementById(i);};
var API="/api/rapports";
function session(){ try{ return JSON.parse(localStorage.getItem("outils:session")||"null"); }catch(e){ return null; } }
var S=session();
if(!S || !S.jeton) location.replace("./index.html");

function octets(n){ return n>1048576 ? (n/1048576).toFixed(1).replace(".",",")+" Mo" : Math.round(n/1024)+" Ko"; }
function frDate(d){ if(!d) return ""; var a=String(d).slice(0,10).split("-"); return a[2]+"/"+a[1]+"/"+a[0]; }


/* ---------- export des photos en ZIP (sans bibliothèque) ---------- */
var CRC_TABLE = (function(){
  var t=new Uint32Array(256);
  for(var n=0;n<256;n++){
    var c=n;
    for(var k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1);
    t[n]=c>>>0;
  }
  return t;
})();
function crc32(buf){
  var c=0xFFFFFFFF;
  for(var i=0;i<buf.length;i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c>>>8);
  return (c ^ 0xFFFFFFFF)>>>0;
}
function b64ToBytes(b64){
  var bin=atob(b64), out=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}
function nomFichier(t){
  return String(t||"photo").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^A-Za-z0-9 _-]+/g,"").trim().replace(/\s+/g,"-").slice(0,48) || "photo";
}
function creerZip(fichiers){          /* [{nom, octets}] -> Blob */
  var enc=new TextEncoder(), morceaux=[], central=[], offset=0;
  function u32(n){ return new Uint8Array([n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255]); }
  function u16(n){ return new Uint8Array([n&255,(n>>>8)&255]); }
  fichiers.forEach(function(f){
    var nom=enc.encode(f.nom), data=f.octets, crc=crc32(data);
    var entete=[
      u32(0x04034b50), u16(20), u16(0x0800), u16(0), u16(0), u16(0),
      u32(crc), u32(data.length), u32(data.length), u16(nom.length), u16(0), nom
    ];
    entete.forEach(function(p){ morceaux.push(p); });
    morceaux.push(data);
    central.push({nom:nom, crc:crc, taille:data.length, offset:offset});
    offset += 30 + nom.length + data.length;
  });
  var debutCentral=offset, tailleCentral=0;
  central.forEach(function(c){
    var e=[
      u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0), u16(0), u16(0),
      u32(c.crc), u32(c.taille), u32(c.taille), u16(c.nom.length),
      u16(0), u16(0), u16(0), u16(0), u32(0), u32(c.offset), c.nom
    ];
    e.forEach(function(p){ morceaux.push(p); });
    tailleCentral += 46 + c.nom.length;
  });
  [u32(0x06054b50), u16(0), u16(0), u16(central.length), u16(central.length),
   u32(tailleCentral), u32(debutCentral), u16(0)].forEach(function(p){ morceaux.push(p); });
  return new Blob(morceaux, {type:"application/zip"});
}

var CHANTIERS=[];
function filtrer(){
  var q=($("recherche").value||"").trim().toLowerCase();
  if(!q) return CHANTIERS;
  return CHANTIERS.filter(function(c){
    if((c.client||"").toLowerCase().indexOf(q)>=0) return true;
    if((c.ref||"").toLowerCase().indexOf(q)>=0) return true;
    if((c.adresse||"").toLowerCase().indexOf(q)>=0) return true;
    return c.fichiers.some(function(f){ return (f.titre||"").toLowerCase().indexOf(q)>=0; });
  });
}
function majCompteur(n){
  $("compteur").textContent = CHANTIERS.length
    ? n + " dossier" + (n>1?"s":"") + " affiché" + (n>1?"s":"") + " sur " + CHANTIERS.length
    : "";
}
function nomLisible(f){
  var base=(f.titre||"document").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^A-Za-z0-9 ]+/g,"").trim().replace(/\s+/g,"-").toLowerCase();
  var ext = f.cle.slice(f.cle.lastIndexOf("."));
  return (f.date||"").slice(0,10) + "-" + base + ext;
}
function archiver(c, bouton){
  if(!window.confirm("Exporter tous les documents de " + (c.client||c.ref) + " ("
    + c.fichiers.length + " document" + (c.fichiers.length>1?"s":"")
    + "), puis le supprimer du site ?\n\nLe fichier ZIP sera téléchargé sur cet appareil. "
    + "La suppression est définitive.")) return;
  bouton.textContent="Export en cours…"; bouton.disabled=true;
  var fichiers=[], manifeste=["Travaux : "+(c.client||"")+" ("+c.ref+")",
    c.adresse||"", "Archivé le "+new Date().toLocaleString("fr-FR"), "", "Documents :"];
  var suite=Promise.resolve();
  c.fichiers.forEach(function(f){
    suite=suite.then(function(){
      return fetch(API+"?action=fichier&cle="+encodeURIComponent(f.cle)+"&auth="+encodeURIComponent(S.jeton))
        .then(function(r){ if(!r.ok) throw new Error("fichier"); return r.arrayBuffer(); })
        .then(function(buf){
          fichiers.push({nom:c.ref+"/"+nomLisible(f), octets:new Uint8Array(buf)});
          manifeste.push("  " + nomLisible(f) + "   " + (f.auteur||"") + "   " + octets(f.taille));
        });
    });
    if(f.donnees){
      suite=suite.then(function(){
        return fetch(API+"?action=fiche&cle="+encodeURIComponent(f.cle)+"&auth="+encodeURIComponent(S.jeton))
          .then(function(r){ return r.ok ? r.text() : null; })
          .then(function(txt){
            if(!txt) return;
            fichiers.push({nom:c.ref+"/fiches/"+nomLisible(f).replace(/\.pdf$/,".json"),
                           octets:new TextEncoder().encode(txt)});
          }).catch(function(){});
      });
    }
  });
  suite.then(function(){
    fichiers.push({nom:c.ref+"/00-contenu.txt", octets:new TextEncoder().encode(manifeste.join("\n"))});
    return fetch(API+"?action=messages&ref="+encodeURIComponent(c.ref), {headers:{"x-auth":S.jeton}})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        if(d && d.messages && d.messages.length){
          var lignes=["Discussion du chantier "+(c.client||c.ref)+" ("+c.ref+")",
            d.messages.length+" message"+(d.messages.length>1?"s":""), ""];
          d.messages.forEach(function(m){
            lignes.push(m.auteur+"  "+String(m.quand).slice(0,10).split("-").reverse().join("/")
              +" "+String(m.quand).slice(11,16));
            if(m.texte) lignes.push("  "+m.texte.replace(/\n/g, "\n  "));
            if(m.photo) lignes.push("  [photo jointe]");
            lignes.push("");
          });
          fichiers.push({nom:c.ref+"/discussion.txt",
            octets:new TextEncoder().encode(lignes.join("\n"))});
        }
        return null;
      })
      .catch(function(){ return null; });
  }).then(function(){
    var blob=creerZip(fichiers);
    var nom="Travaux-"+c.ref+".zip";
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=nom; a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
    bouton.textContent="Suppression…";
    return new Promise(function(res){ setTimeout(res, 1200); });
  }).then(function(){
    if(!window.confirm("Le ZIP a été téléchargé. Vérifiez-le si vous le souhaitez.\n\n"
      + "Supprimer maintenant ce dossier du site ?")){
      bouton.textContent="Archiver"; bouton.disabled=false;
      return null;
    }
    return fetch(API+"?action=supprimer-chantier&ref="+encodeURIComponent(c.ref),
      {headers:{"x-auth":S.jeton}})
      .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,d:d}; }); })
      .then(function(res){
        if(!res.ok){ window.alert(res.d.erreur||"Suppression refusée."); bouton.textContent="Archiver"; bouton.disabled=false; return; }
        charger();
document.addEventListener("visibilitychange", function(){
  if(!document.hidden) charger();          /* accusés de lecture rafraîchis au retour */
});
window.addEventListener("focus", function(){ charger(); });
      });
  }).catch(function(){
    window.alert("Export interrompu. Rien n'a été supprimé.");
    bouton.textContent="Archiver"; bouton.disabled=false;
  });
}




/* ---------- lecteur de PDF, chargé à la demande ---------- */
var PDFJS_ETAT=null;
function chargerPdfJs(cb){
  if(window.pdfjsLib){ PDFJS_ETAT="ok"; cb(window.pdfjsLib); return; }
  if(PDFJS_ETAT==="ok"){ cb(window.pdfjsLib); return; }
  if(PDFJS_ETAT==="ko"){ cb(null); return; }
  var sc=document.createElement("script");
  sc.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
  sc.onload=function(){
    try{
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      PDFJS_ETAT="ok"; cb(window.pdfjsLib);
    }catch(e){ PDFJS_ETAT="ko"; cb(null); }
  };
  sc.onerror=function(){ PDFJS_ETAT="ko"; cb(null); };
  document.head.appendChild(sc);
}
function replierIframe(corps, url, etat){
  /* sans réseau pour le lecteur : on montre au moins le document */
  if(etat) etat.remove();
  corps.textContent="";
  var cadre=document.createElement("iframe");
  cadre.src=url;
  cadre.style.cssText="width:100%;height:100%;border:0;background:#fff";
  corps.appendChild(cadre);
}


/* ---------- restauration d'un dossier archivé ---------- */
var TYPES_FICHIER = [
  ["reportage",        "reportage", "Reportage photo"],
  ["releve-technique", "releve", "Relevé technique"],
  ["releve",           "releve", "Relevé technique"],
  ["suivi-de-travaux", "suivi",  "Suivi de travaux"],
  ["suivi",            "suivi",  "Suivi de travaux"],
  ["commande",         "commande", "Commande et reste à faire"],
  ["pv-reception",     "reception", "Procès-verbal de réception"],
  ["reception",        "reception", "Procès-verbal de réception"],
  ["etiquettes",       "etiquettes", "Étiquettes de tableau"],
  ["sav",              "sav", "Intervention SAV"],
  ["photos",           "photos", "Photos des travaux"]
];
function typeDeNom(nom){
  var n=nom.toLowerCase();
  for(var i=0;i<TYPES_FICHIER.length;i++){
    if(n.indexOf(TYPES_FICHIER[i][0])>=0) return {type:TYPES_FICHIER[i][1], titre:TYPES_FICHIER[i][2]};
  }
  return {type:"releve", titre:"Document"};
}
function dateDeNom(nom){
  var m=/(\d{4}-\d{2}-\d{2})/.exec(nom);
  return m ? m[1] : new Date().toISOString().slice(0,10);
}
function octetsEnBase64(u8){
  var morceau=0x8000, bouts=[];
  for(var i=0;i<u8.length;i+=morceau){
    bouts.push(String.fromCharCode.apply(null, u8.subarray(i, i+morceau)));
  }
  return btoa(bouts.join(""));
}
function restaurerArchive(fichier){
  var etat=$("restaurerEtat");
  etat.textContent="Lecture de l'archive…";
  fichier.arrayBuffer()
    .then(function(buf){
      var entrees=lireArchive(new Uint8Array(buf));
      if(!entrees.length) throw new Error("vide");

      /* le nom du dossier donne la référence ; le premier fichier donne le client */
      var ref="", client="", adresse="";
      entrees.forEach(function(e){
        var parts=e.nom.split("/");
        if(parts.length>1 && !ref) ref=parts[0];
      });
      var contenu=entrees.filter(function(e){ return /00-contenu\.txt$/i.test(e.nom); })[0];
      if(contenu){
        var texte=new TextDecoder("utf-8").decode(contenu.octets);
        var m=/Travaux\s*:\s*(.+?)\s*\(([^)]+)\)/.exec(texte);
        if(m){ client=m[1].trim(); ref=m[2].trim() || ref; }
        var lignes=texte.split("\n");
        if(lignes.length>1 && lignes[1].trim() && lignes[1].indexOf("Archivé")<0) adresse=lignes[1].trim();
      }
      var docs=entrees.filter(function(e){ return /\.(pdf|zip)$/i.test(e.nom) && e.nom.indexOf("/fiches/")<0; });
      var fiches={};
      entrees.forEach(function(e){
        if(e.nom.indexOf("/fiches/")<0 || !/\.json$/i.test(e.nom)) return;
        fiches[e.nom.split("/fiches/")[1].replace(/\.json$/i, "")] = e.octets;
      });
      if(!docs.length) throw new Error("aucun document");
      if(!client) client=ref;

      if(!window.confirm("Restaurer « "+client+" » ("+ref+") ?\n\n"
        +docs.length+" document"+(docs.length>1?"s":"")+" sera"+(docs.length>1?"ont":"")+" remis sur le site, "
        +"attribué"+(docs.length>1?"s":"")+" à votre compte.")){ etat.textContent=""; return; }

      var faits=0;
      function suivant(i){
        if(i>=docs.length){
          etat.textContent = faits+" document"+(faits>1?"s":"")+" restauré"+(faits>1?"s":"")+" dans « "+client+" ».";
          charger();
          return;
        }
        var d=docs[i];
        var base=d.nom.split("/").pop().replace(/\.(pdf|zip)$/i, "");
        var t=typeDeNom(base);
        etat.textContent="Restauration "+(i+1)+" sur "+docs.length+" : "+t.titre+"…";
        fetch(API+"?action=publier", {method:"POST",
          headers:{"Content-Type":"application/json","x-auth":S.jeton},
          body:JSON.stringify({pdf:octetsEnBase64(d.octets), type:t.type, chantier:ref, client:client,
            adresse:adresse, date:dateDeNom(base), destinataires:[S.nom], titre:t.titre})})
          .then(function(r){ return r.json().then(function(x){ return {ok:r.ok, d:x}; }); })
          .then(function(res){
            if(!res.ok) throw new Error(res.d.erreur || "refus");
            faits++;
            var f=fiches[base];
            if(!f) return null;
            return fetch(API+"?action=deposer-fiche", {method:"POST",
              headers:{"Content-Type":"application/json","x-auth":S.jeton},
              body:JSON.stringify({cle:res.d.cle, donnees:new TextDecoder("utf-8").decode(f)})});
          })
          .then(function(){ suivant(i+1); })
          .catch(function(e){
            etat.textContent="Restauration interrompue : "+(e.message || "erreur")+". "
              +faits+" document"+(faits>1?"s":"")+" repris.";
            charger();
          });
      }
      suivant(0);
    })
    .catch(function(e){
      etat.textContent = e && e.message==="vide"
        ? "Archive illisible : ce fichier n'est pas une archive de dossier."
        : "Archive illisible ou incomplète.";
    });
}
function lireArchive(octets){
  /* nos archives sont écrites sans compression */
  var v=new DataView(octets.buffer, octets.byteOffset, octets.byteLength);
  var dec=new TextDecoder("utf-8");
  var out=[], i=0;
  while(i+30 <= octets.length){
    if(v.getUint32(i, true) !== 0x04034b50) break;
    var methode=v.getUint16(i+8, true);
    var taille=v.getUint32(i+18, true);
    var lgNom=v.getUint16(i+26, true);
    var lgExtra=v.getUint16(i+28, true);
    var nom=dec.decode(octets.subarray(i+30, i+30+lgNom));
    var debut=i+30+lgNom+lgExtra;
    if(methode===0 && taille>0) out.push({nom:nom, octets:octets.subarray(debut, debut+taille)});
    i = debut + taille;
  }
  return out;
}

function quandLisible(iso){
  var d=new Date(iso), maintenant=new Date();
  var jour=d.toISOString().slice(0,10), auj=maintenant.toISOString().slice(0,10);
  var heure=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  if(jour===auj) return heure;
  var hier=new Date(maintenant.getTime()-86400000).toISOString().slice(0,10);
  if(jour===hier) return "hier "+heure;
  return frDate(jour)+" "+heure;
}
function compresserPhoto(file, cb){
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var max=1100, w=img.width, h=img.height;
      if(w>max||h>max){ var r=Math.min(max/w,max/h); w=Math.round(w*r); h=Math.round(h*r); }
      var cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      cb(cv.toDataURL("image/jpeg",0.7));
    };
    img.onerror=function(){ cb(null); };
    img.src=fr.result;
  };
  fr.onerror=function(){ cb(null); };
  fr.readAsDataURL(file);
}

/* ---------- galerie des photos ---------- */
function lireZip(octets){
  /* nos archives sont écrites sans compression : on peut lire les fichiers tels quels */
  var v=new DataView(octets.buffer, octets.byteOffset, octets.byteLength);
  var dec=new TextDecoder("utf-8");
  var out=[], i=0;
  while(i+30 <= octets.length){
    if(v.getUint32(i, true) !== 0x04034b50) break;
    var methode=v.getUint16(i+8, true);
    var taille=v.getUint32(i+18, true);
    var lgNom=v.getUint16(i+26, true);
    var lgExtra=v.getUint16(i+28, true);
    var nom=dec.decode(octets.subarray(i+30, i+30+lgNom));
    var debut=i+30+lgNom+lgExtra;
    if(methode===0 && taille>0 && /\.(jpe?g|png)$/i.test(nom)){
      out.push({nom:nom, octets:octets.subarray(debut, debut+taille)});
    }
    i = debut + taille;
  }
  return out;
}

      }
      marquerLu(f);
      photos.forEach(function(p, i){
        var blob=new Blob([p.octets], {type: /\.png$/i.test(p.nom) ? "image/png" : "image/jpeg"});
        var url=URL.createObjectURL(blob); urls.push(url);
        var fig=document.createElement("figure");
        fig.style.cssText="margin:0;background:#262320;border:1px solid rgba(244,241,234,.10)";
        var im=document.createElement("img");
        im.src=url; im.alt=p.nom; im.loading="lazy";
        im.style.cssText="display:block;width:100%;height:150px;object-fit:cover;cursor:zoom-in";
        im.addEventListener("click", function(){ plein(i); });

          +"text-overflow:ellipsis;white-space:nowrap";
        cap.textContent=p.nom.split("/").pop().replace(/\.(jpe?g|png)$/i,"").replace(/^\d+-?/,"").replace(/-/g," ");
        fig.appendChild(im); fig.appendChild(cap);

            +"background:rgba(244,241,234,.12);color:#F4F1EA;font-size:14.5px;font-weight:600;"
            +"font-family:inherit;cursor:pointer";
          b.addEventListener("click", fn); return b;
        }
        function afficher(){
          grande.src=urls[k];
          nom.textContent=(k+1)+" sur "+urls.length+"  ·  "+photos[k].nom.split("/").pop();
        }
        nav.appendChild(bouton("Précédente", function(){ k=(k-1+urls.length)%urls.length; afficher(); }));
        nav.appendChild(bouton("Suivante", function(){ k=(k+1)%urls.length; afficher(); }));
        nav.appendChild(bouton("Fermer", function(){ document.body.removeChild(vue); }));

    .catch(function(){

      var v=document.createElement("p");
      v.style.cssText="grid-column:1/-1;color:#BDB5A6;font-size:14px";
      v.textContent="Photos indisponibles. Réessayez ou utilisez Télécharger.";

  fetch(API+"?action=messages-non-lus", {headers:{"x-auth":S.jeton}})

    .then(function(d){

      NON_LUS={};
      (d.dossiers||[]).forEach(function(x){ NON_LUS[x.ref]=x.nb; });
    })
    .catch(function(){});
  fetch(API+"?action=liste", {headers:{"x-auth":S.jeton}})
    .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,d:d}; }); })
    .then(function(res){

        if(res.d.erreur && res.d.erreur.indexOf("Session")>=0){ localStorage.removeItem("outils:session"); location.replace("./index.html"); return; }
        $("bonjour").textContent = res.d.erreur || "Accès refusé.";
        return;

      $("bonjour").textContent = moi.nom+" — les rapports que vous avez publiés ou reçus.";
      CHANTIERS = res.d.chantiers||[];
      MOI = res.d.moi || S;
      $("recherche").hidden = CHANTIERS.length < 4;
      afficher(filtrer());

    .catch(function(){ $("bonjour").textContent="Pas de réseau. Réessayez."; });

var MOI=null;
var ORDRE={releve:1, suivi:2, commande:3, photos:4, reportage:5, etiquettes:6, reception:7, sav:8};
function rangDoc(f){
  var base=(ORDRE[f.type]||9)*1000;
  if(f.type==="suivi"){
    var n=parseInt(f.visite,10);
    return base + (isNaN(n) ? 500 : n);
  }
  return base + (String(f.date||"").replace(/-/g,"").slice(-4)|0)/10000;
}
function trierDocs(c){
  (c.fichiers||[]).sort(function(a,b){
    var d=rangDoc(a)-rangDoc(b);
    if(d) return d;
    return String(a.publie||"").localeCompare(String(b.publie||""));
  });
  return c;
}
