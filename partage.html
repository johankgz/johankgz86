<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F4F1EA">
<title>Documents partagés</title>
<link rel="icon" href="./icone-192.png">
<link rel="apple-touch-icon" href="./icone-180.png">
<!--
  partage.html — un dossier du Cloud, ouvert par le client sans compte
  Le lien (?j=…) est fait dans le Cloud, sur un dossier : il n'ouvre que
  ce dossier et ses sous-dossiers. Voir, télécharger un par un ou tout en
  ZIP ; déposer des fichiers si l'entreprise l'a permis.
-->
<style>
@font-face{font-family:"Jakarta";src:url("./polices/jakarta-var.woff2") format("woff2");font-weight:200 800;font-display:swap}
:root{
  --bg:#F4F1EA; --card:#FFFFFF; --ink:#1F1D1A; --ink-2:#4A463F; --ink-3:#7A7468; --rule:rgba(31,29,26,.10);
  --accent:#B4621A; --accent-soft:#FBEDE0; --ok:#5E6E42; --danger:#A6291F; --field:#F4F1EA;
  --ombre:0 1px 2px rgba(31,29,26,.06),0 6px 22px rgba(31,29,26,.06); --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#16181B; --card:#202328; --ink:#ECEAE5; --ink-2:#C9C5BC; --ink-3:#9A958B; --rule:rgba(255,255,255,.10);
    --accent:#E08A3C; --accent-soft:rgba(224,138,60,.14); --field:#2A2E34; --ombre:0 1px 2px rgba(0,0,0,.3); }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Jakarta",-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
.page{max-width:760px;margin:0 auto;padding:16px 16px calc(28px + env(safe-area-inset-bottom,0px))}
header.marque{display:flex;align-items:center;gap:12px;padding:6px 2px 16px}
header.marque img{max-height:44px;max-width:120px;object-fit:contain;border-radius:6px;background:#fff}
header.marque .nom{font-weight:750;font-size:18px;letter-spacing:-.01em}
header.marque .sous{font-size:12.5px;color:var(--ink-3)}
.carte{background:var(--card);border-radius:var(--r);box-shadow:var(--ombre);padding:16px;margin-bottom:12px}
.tete h1{margin:0 0 4px;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;overflow-wrap:anywhere}
.tete h1 svg{width:30px;height:24px;flex:0 0 auto}
.tete p{margin:0;color:var(--ink-2);font-size:14.5px}
.ariane{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:0 0 8px;font-size:13.5px}
.ariane button{border:0;background:none;padding:4px 2px;font:inherit;color:var(--accent);cursor:pointer;min-height:32px}
.ariane span{color:var(--ink-3)}
.hint{font-size:13.5px;color:var(--ink-3);margin:6px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:11px 16px;border:0;border-radius:12px;
  background:var(--accent);color:#fff;font:inherit;font-weight:650;text-decoration:none;cursor:pointer}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn:disabled{opacity:.55;cursor:default}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.rangee{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.rangee .btn{flex:1 1 180px}
.liste{list-style:none;margin:0;padding:0}
.liste li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--rule)}
.liste li:first-child{border-top:0}
.liste .ouvrir{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:none;padding:0;font:inherit;color:var(--ink);text-align:left;cursor:pointer;min-height:48px}
.liste .vig{flex:0 0 48px;width:48px;height:48px;border-radius:9px;background:var(--field);display:flex;align-items:center;justify-content:center;overflow:hidden}
.liste .vig img{width:100%;height:100%;object-fit:cover}
.liste .vig svg{width:26px;height:26px;fill:none;stroke:var(--accent);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.liste .vig svg.dos{width:34px;height:28px;stroke:none}
.liste .t{min-width:0}
.liste .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.liste .t small{display:block;font-size:12.5px;color:var(--ink-3)}
.liste .dl{flex:0 0 auto;width:44px;height:44px;border-radius:11px;border:0;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer}
.liste .dl svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.vide{color:var(--ink-3);padding:8px 0;margin:0}
.etat{padding:14px 2px;color:var(--ink-2)}
.ok-msg{background:rgba(94,110,66,.12);color:var(--ok);border-radius:11px;padding:10px 12px;font-weight:600;margin-top:10px}
.err-msg{background:rgba(166,41,31,.10);color:var(--danger);border-radius:11px;padding:10px 12px;margin-top:10px}
.depot{border:2px dashed var(--rule);border-radius:12px;padding:14px;text-align:center;margin-top:10px}
.depot.survol{border-color:var(--accent);background:var(--accent-soft)}
.pied{text-align:center;font-size:11.5px;color:var(--ink-3);margin-top:14px}
/* la visionneuse des photos */
.vision{position:fixed;inset:0;z-index:50;background:rgba(10,10,12,.94);display:flex;flex-direction:column}
.vision .haut{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;color:#fff}
.vision .haut b{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.vision button,.vision a{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.vision svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vision .corps{flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
.vision .corps img{max-width:100%;max-height:100%;object-fit:contain}
.vision .prec,.vision .suiv{position:absolute;top:50%;transform:translateY(-50%)}
.vision .prec{left:10px}.vision .suiv{right:10px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="page">
  <header class="marque">
    <img id="logo" alt="" hidden>
    <div><div class="nom" id="socNom">Suivi travaux 360</div><div class="sous" id="socSous"></div></div>
  </header>

  <p class="etat" id="etat" role="status">Chargement…</p>

  <div id="contenu" hidden>
    <section class="carte tete">
      <nav class="ariane" id="ariane" aria-label="Dossiers" hidden></nav>
      <h1><svg viewBox="0 0 84 68" aria-hidden="true"><path d="M4 12a6 6 0 0 1 6-6h20l7 7h37a6 6 0 0 1 6 6v37a6 6 0 0 1-6 6H10a6 6 0 0 1-6-6z" fill="#2B74C4"/><path d="M4 22a6 6 0 0 1 6-6h64a6 6 0 0 1 6 6v34a6 6 0 0 1-6 6H10a6 6 0 0 1-6-6z" fill="#4A9BEF"/></svg><span id="titre"></span></h1>
      <p id="sousTitre"></p>
      <div class="rangee">
        <a class="btn" id="btnZip"><svg viewBox="0 0 24 24"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 19.5h14"/></svg>Tout télécharger (ZIP)</a>
        <a class="btn ghost" id="btnAppeler" hidden><svg viewBox="0 0 24 24"><path d="M6.6 3.5h2.6l1.4 4-1.9 1.3a10 10 0 0 0 6.5 6.5l1.3-1.9 4 1.4v2.6a1.7 1.7 0 0 1-1.9 1.7A15.8 15.8 0 0 1 4.9 5.4 1.7 1.7 0 0 1 6.6 3.5z"/></svg>Appeler</a>
      </div>
    </section>

    <section class="carte">
      <ul class="liste" id="liste"></ul>
    </section>

    <section class="carte" id="carteDepot" hidden>
      <b>Nous envoyer des fichiers</b>
      <div class="depot" id="zoneDepot">
        <button type="button" class="btn" id="btnDeposer"><svg viewBox="0 0 24 24"><path d="M12 15.5v-11M7.5 9 12 4.5 16.5 9M4.5 17v3.5h15V17"/></svg>Choisir des fichiers</button>
        <p class="hint">Photos, PDF, plans… 25 Mo au plus par fichier. Ils arrivent dans ce dossier.</p>
      </div>
      <input type="file" id="fichiers" multiple hidden>
      <div id="depotEtat" role="status" aria-live="polite"></div>
    </section>

    <p class="pied" id="pied"></p>
  </div>
</div>

<div class="vision" id="vision" hidden role="dialog" aria-modal="true" aria-label="Photo">
  <div class="haut">
    <b id="visionNom"></b>
    <a id="visionDl" aria-label="Télécharger" title="Télécharger"><svg viewBox="0 0 24 24"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 19.5h14"/></svg></a>
    <button type="button" id="visionX" aria-label="Fermer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="corps">
    <img id="visionImg" alt="">
    <button type="button" class="prec" id="visionPrec" aria-label="Photo précédente"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button type="button" class="suiv" id="visionSuiv" aria-label="Photo suivante"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</div>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var J = "", DOSSIER = "";
  try{ var q = new URLSearchParams(location.search); J = q.get("j") || ""; DOSSIER = q.get("dossier") || ""; }catch(e){}
  var API = location.origin + "/api/rapports?action=";
  var D = null, IMAGES = [], VUE = -1;
  function el(t, c, txt){ var e = document.createElement(t); if(c) e.className = c; if(txt != null) e.textContent = txt; return e; }
  function frDate(d){ if(!d) return ""; var a = String(d).slice(0, 10).split("-"); return a.length === 3 ? a[2] + "/" + a[1] + "/" + a[0] : d; }
  function telPoints(t){ var c = String(t || "").replace(/\D/g, ""); return c.length === 10 ? c.replace(/(\d\d)(?=\d)/g, "$1.") : String(t || ""); }
  function taille(o){ return o < 1024 ? o + " o" : o < 1048576 ? Math.round(o / 1024) + " Ko" : (o / 1048576).toFixed(o < 10485760 ? 1 : 0).replace(".", ",") + " Mo"; }
  function adr(a, id, dl){ return API + a + "&j=" + encodeURIComponent(J) + (id ? "&id=" + encodeURIComponent(id) : "") + (dl ? "&telecharger=1" : ""); }
  function estImage(e){ return e.type !== "dossier" && /^image\/(jpeg|png|webp|gif)/.test(e.mime || ""); }
  function affichable(e){ return /^(application\/pdf|image\/(jpeg|png|webp|gif)|text\/plain|video\/(mp4|quicktime)|audio\/(mpeg|mp4))/.test(e.mime || ""); }
  var SVG_DOS = '<svg class="dos" viewBox="0 0 84 68" aria-hidden="true"><path d="M4 12a6 6 0 0 1 6-6h20l7 7h37a6 6 0 0 1 6 6v37a6 6 0 0 1-6 6H10a6 6 0 0 1-6-6z" fill="#2B74C4"/><path d="M4 22a6 6 0 0 1 6-6h64a6 6 0 0 1 6 6v34a6 6 0 0 1-6 6H10a6 6 0 0 1-6-6z" fill="#4A9BEF"/></svg>';
  var SVG_DOC = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 3.5h8l5 5v12H5.5z"/><path d="M13.5 3.5v5h5"/></svg>';
  var SVG_DL = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 19.5h14"/></svg>';

  function charger(){
    return fetch(API + "cloud-public&j=" + encodeURIComponent(J) + (DOSSIER ? "&dossier=" + encodeURIComponent(DOSSIER) : ""))
      .then(function(r){ return r.json().then(function(d){ return {ok: r.ok, d: d}; }); })
      .then(function(r){
        if(!r.ok){
          if(r.d && r.d.societe) peindreSociete(r.d.societe);
          if(DOSSIER && r.d && !/valable|expiré/.test(r.d.erreur || "")){ DOSSIER = ""; majAdresse(); return charger(); }
          $("contenu").hidden = true; $("etat").hidden = false; $("etat").textContent = r.d.erreur || "Lien introuvable."; return;
        }
        D = r.d; $("etat").hidden = true; $("contenu").hidden = false; peindre();
      })
      .catch(function(){ $("etat").hidden = false; $("etat").textContent = "Pas de réseau. Réessayez dans un instant."; });
  }
  function majAdresse(){
    try{ history.replaceState(null, "", "?j=" + encodeURIComponent(J) + (DOSSIER ? "&dossier=" + encodeURIComponent(DOSSIER) : "")); }catch(e){}
  }
  function aller(id){ DOSSIER = id && id !== (D && D.racine) ? id : ""; majAdresse(); charger().then(function(){ window.scrollTo(0, 0); }); }

  function peindreSociete(S){
    $("socNom").textContent = S.nom || "Suivi travaux 360";
    $("socSous").textContent = [telPoints(S.tel), S.web].filter(Boolean).join("  ·  ");
    if(S.logo && S.logo.data){ $("logo").src = S.logo.data; $("logo").hidden = false; }
    if(S.tel){ var a = $("btnAppeler"); a.href = "tel:" + String(S.tel).replace(/[^\d+]/g, ""); a.hidden = false; a.lastChild.textContent = "Appeler " + (S.nom || "l'entreprise"); }
  }
  function peindre(){
    var S = D.societe || {};
    peindreSociete(S);
    document.title = D.dossier.nom + " — " + (S.nom || "Documents partagés");
    $("titre").textContent = D.dossier.nom;
    var nbF = D.elements.filter(function(e){ return e.type !== "dossier"; }).length, nbD = D.elements.length - nbF;
    $("sousTitre").textContent = [
      "Partagé par " + (S.nom || "l'entreprise"),
      nbF ? nbF + (nbF > 1 ? " fichiers" : " fichier") : "",
      nbD ? nbD + (nbD > 1 ? " dossiers" : " dossier") : "",
      D.expire ? "lien valable jusqu'au " + frDate(D.expire) : ""
    ].filter(Boolean).join("  ·  ");
    /* le chemin, depuis le dossier partagé */
    var ar = $("ariane"); ar.textContent = "";
    ar.hidden = (D.chemin || []).length < 2;
    (D.chemin || []).forEach(function(c, i){
      if(i) ar.appendChild(el("span", "", "›"));
      if(i === D.chemin.length - 1){ ar.appendChild(el("span", "", c.nom)); return; }
      var b = el("button", "", c.nom); b.type = "button"; b.addEventListener("click", function(){ aller(c.id); }); ar.appendChild(b);
    });
    var z = $("btnZip"); z.href = adr("cloud-public-zip", D.dossier.id); z.hidden = !D.elements.length;
    /* la liste : les dossiers d'abord, puis les fichiers, par nom */
    var l = D.elements.slice().sort(function(a, b){
      if((a.type === "dossier") !== (b.type === "dossier")) return a.type === "dossier" ? -1 : 1;
      return a.nom.localeCompare(b.nom, "fr", {numeric: true});
    });
    IMAGES = l.filter(estImage);
    var ul = $("liste"); ul.textContent = "";
    if(!l.length) ul.appendChild(el("p", "vide", D.depot ? "Ce dossier est vide pour l'instant : vous pouvez y déposer vos fichiers ci-dessous." : "Ce dossier est vide pour l'instant."));
    l.forEach(function(e){ ul.appendChild(ligne(e)); });
    $("carteDepot").hidden = !D.depot;
    $("pied").textContent = (S.adresse ? S.adresse + "  ·  " : "") + "Page envoyée par " + (S.nom || "l'entreprise") + " : ne la partagez qu'avec les personnes concernées.";
  }
  function ligne(e){
    var li = el("li"), o = el("button", "ouvrir"); o.type = "button";
    var v = el("span", "vig");
    if(e.type === "dossier") v.innerHTML = SVG_DOS;
    else if(estImage(e) && (e.mini || e.taille < 1500000)){ var im = el("img"); im.loading = "lazy"; im.alt = ""; im.src = adr(e.mini ? "cloud-public-vignette" : "cloud-public-fichier", e.id); v.appendChild(im); }
    else v.innerHTML = SVG_DOC;
    var t = el("span", "t"); t.appendChild(el("b", "", e.nom));
    t.appendChild(el("small", "", e.type === "dossier" ? (e.nb || 0) + (e.nb > 1 ? " éléments" : " élément") : [taille(e.taille || 0), e.maj ? "du " + frDate(e.maj) : ""].filter(Boolean).join("  ·  ")));
    o.appendChild(v); o.appendChild(t);
    o.setAttribute("aria-label", (e.type === "dossier" ? "Ouvrir le dossier " : "Ouvrir ") + e.nom);
    o.addEventListener("click", function(){
      if(e.type === "dossier") aller(e.id);
      else if(estImage(e)) voir(IMAGES.indexOf(e));
      else if(affichable(e)) window.open(adr("cloud-public-fichier", e.id), "_blank", "noopener");
      else telecharger(e);
    });
    li.appendChild(o);
    var dl = el("button", "dl"); dl.type = "button"; dl.innerHTML = SVG_DL;
    dl.setAttribute("aria-label", e.type === "dossier" ? "Télécharger le dossier " + e.nom + " (ZIP)" : "Télécharger " + e.nom);
    dl.title = e.type === "dossier" ? "Télécharger (ZIP)" : "Télécharger";
    dl.addEventListener("click", function(){ e.type === "dossier" ? (location.href = adr("cloud-public-zip", e.id)) : telecharger(e); });
    li.appendChild(dl);
    return li;
  }
  function telecharger(e){ var a = el("a"); a.href = adr("cloud-public-fichier", e.id, true); a.download = e.nom; document.body.appendChild(a); a.click(); a.remove(); }

  /* ---------- la visionneuse des photos ---------- */
  var retour = null;
  function voir(i){
    if(i < 0 || !IMAGES.length) return;
    if($("vision").hidden) retour = document.activeElement;
    VUE = (i + IMAGES.length) % IMAGES.length;
    var e = IMAGES[VUE];
    $("visionImg").src = adr("cloud-public-fichier", e.id); $("visionImg").alt = e.nom;
    $("visionNom").textContent = e.nom; $("visionDl").href = adr("cloud-public-fichier", e.id, true); $("visionDl").setAttribute("download", e.nom);
    $("visionPrec").hidden = $("visionSuiv").hidden = IMAGES.length < 2;
    $("vision").hidden = false; $("visionX").focus();
  }
  function fermer(){ $("vision").hidden = true; $("visionImg").removeAttribute("src"); if(retour && retour.focus) retour.focus(); }
  $("visionX").addEventListener("click", fermer);
  $("visionPrec").addEventListener("click", function(){ voir(VUE - 1); });
  $("visionSuiv").addEventListener("click", function(){ voir(VUE + 1); });
  document.addEventListener("keydown", function(ev){
    if($("vision").hidden) return;
    if(ev.key === "Escape") fermer(); else if(ev.key === "ArrowLeft") voir(VUE - 1); else if(ev.key === "ArrowRight") voir(VUE + 1);
  });
  var x0 = null;
  $("vision").addEventListener("touchstart", function(ev){ x0 = ev.touches[0].clientX; }, {passive: true});
  $("vision").addEventListener("touchend", function(ev){ if(x0 == null) return; var dx = ev.changedTouches[0].clientX - x0; x0 = null; if(Math.abs(dx) > 50) voir(VUE + (dx < 0 ? 1 : -1)); });

  /* ---------- déposer ---------- */
  function message(t, ok){ var p = el("p", ok ? "ok-msg" : "err-msg", t); $("depotEtat").appendChild(p); }
  function envoyer(fs){
    if(!fs.length || !D) return;
    $("depotEtat").textContent = ""; $("btnDeposer").disabled = true;
    var faits = 0, dossier = D.dossier.id;
    fs.reduce(function(p, f){
      return p.then(function(){
        if(f.size > 25 * 1024 * 1024){ message("« " + f.name + " » : trop lourd, 25 Mo au plus."); return; }
        $("btnDeposer").lastChild.textContent = "Envoi de « " + f.name + " »…";
        return fetch(API + "cloud-public-depot&j=" + encodeURIComponent(J) + "&dossier=" + encodeURIComponent(dossier) + "&nom=" + encodeURIComponent(f.name),
          {method: "POST", headers: {"content-type": "application/octet-stream"}, body: f})
          .then(function(r){ return r.json().then(function(d){ return {ok: r.ok, d: d}; }); })
          .then(function(r){ if(!r.ok) message("« " + f.name + " » : " + (r.d.erreur || "envoi refusé.")); else faits++; })
          .catch(function(){ message("« " + f.name + " » : pas de réseau, réessayez."); });
      });
    }, Promise.resolve()).then(function(){
      $("btnDeposer").disabled = false; $("btnDeposer").lastChild.textContent = "Choisir des fichiers";
      if(faits) message(faits > 1 ? faits + " fichiers envoyés. Merci !" : "Fichier envoyé. Merci !", true);
      if(faits) charger();
    });
  }
  $("btnDeposer").addEventListener("click", function(){ $("fichiers").click(); });
  $("fichiers").addEventListener("change", function(){ var fs = Array.prototype.slice.call(this.files); this.value = ""; envoyer(fs); });
  var zd = $("zoneDepot");
  ["dragenter", "dragover"].forEach(function(t){ zd.addEventListener(t, function(ev){ ev.preventDefault(); zd.classList.add("survol"); }); });
  ["dragleave", "drop"].forEach(function(t){ zd.addEventListener(t, function(ev){ ev.preventDefault(); zd.classList.remove("survol"); }); });
  zd.addEventListener("drop", function(ev){ envoyer(Array.prototype.slice.call((ev.dataTransfer && ev.dataTransfer.files) || [])); });

  /* ---------- ouverture ---------- */
  if(!J){ $("etat").textContent = "Lien incomplet. Ouvrez de nouveau le lien que l'entreprise vous a envoyé."; return; }
  charger();
  window.__partage = { charger: charger, etat: function(){ return D; } };
})();
</script>
<script src="./pied.js?v=20261007a" defer></script>
</body>
</html>
