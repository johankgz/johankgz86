<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script src="./theme.js?v=20261004b"></script>
<script src="./dates.js?v=20261001a"></script>
<script src="./reseau.js?v=20261007a"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="./fond.js?v=20260929a"></script>
<meta name="theme-color" content="#F4F1EA">
<link rel="apple-touch-icon" sizes="180x180" href="/icone-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icone-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Travaux 360">
<title>Demandes de contact — Suivi travaux 360</title>
<style>
:root{--bg:#F4F1EA;--card:#fff;--ink:#22201C;--ink-2:#5E584E;--ink-3:#736C60;--rule:#E2DCCE;
 --accent:#B4621A;--accent-fonce:#8F4A10;--accent-soft:#FBEDE0;--rouge:#A6291F;--rouge-soft:#F8E4E0;--vert:#3F5A1E;--vert-soft:#EDF0E4;
 --shadow:0 1px 0 rgba(34,32,28,.05);--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;letter-spacing:-.01em;
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:0;z-index:10;background:rgba(244,241,234,.9);backdrop-filter:saturate(180%) blur(20px);
 -webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(34,32,28,.07);
 padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;align-items:center;gap:10px}
a.menu{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:10px;
 background:rgba(140,132,117,.14);color:var(--ink-2);font-size:13px;font-weight:600;text-decoration:none}
h1{font-size:21px;font-weight:700;letter-spacing:-.03em;margin:0}
main{max-width:720px;margin:0 auto;padding:16px}
.hint{font-size:14px;color:var(--ink-3);margin:0 0 12px}
.onglets{display:flex;gap:8px;margin:0 0 14px}
.onglets button{flex:1;min-height:40px;border-radius:10px;border:1px solid var(--rule);background:var(--card);color:var(--ink-2);font:inherit;font-size:14.5px;font-weight:600;cursor:pointer}
.onglets button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.dem{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:12px;border-left:4px solid var(--accent)}
.dem.urgent{border-left-color:var(--rouge)}
.dem.traitee{border-left-color:var(--rule);opacity:.85}
.dem .tete{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:6px}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--accent-soft);color:var(--accent-fonce)}
.badge.rouge{background:var(--rouge-soft);color:var(--rouge)}
.badge.vert{background:var(--vert-soft);color:var(--vert)}
.dem .quand{font-size:13px;color:var(--ink-3);margin-left:auto}
.dem h2{font-size:17px;margin:2px 0 6px}
.dem .msg{white-space:pre-wrap;margin:0 0 10px;font-size:15px}
.dem dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0 0 10px;font-size:14.5px}
.dem dt{color:var(--ink-3)}
.dem dd{margin:0;word-break:break-word}
.dem dd a{color:var(--accent-fonce)}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.photos img{width:92px;height:92px;object-fit:cover;border-radius:8px;border:1px solid var(--rule);cursor:zoom-in}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns a,.btns button{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:8px 14px;border-radius:10px;font:inherit;font-size:14.5px;font-weight:600;text-decoration:none;cursor:pointer;border:0}
.btn{background:var(--accent);color:#fff}
.btn.ghost{background:var(--accent-soft);color:var(--accent-fonce)}
.btn.gris{background:rgba(140,132,117,.14);color:var(--ink-2)}
.vide,.err{background:var(--card);border-radius:var(--r);padding:20px;text-align:center;color:var(--ink-3)}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-color-scheme:dark){
  :root{--bg:#16181B;--card:#202328;--ink:#ECEAE5;--ink-2:#D3CFC6;--ink-3:#B4AEA3;--rule:rgba(255,255,255,.14);--accent-soft:#3A2A1A;--accent-fonce:#F0A563;--rouge-soft:#3A1F1C;--rouge:#F2A098;--vert-soft:#24301A;--vert:#B9D58F}
  header{background:rgba(22,24,27,.9)}
}
</style>
<script src="./finitions.js?v=20261004a" defer></script>
<script src="./palette.js?v=20261007a" defer></script>
</head>
<body>
<header>
  <a class="menu" href="./index.html">Menu</a>
  <h1>Demandes de contact</h1>
</header>
<main id="contenu">
  <p class="hint" id="intro">Les demandes envoyées par vos clients avec le QR code « Nous contacter » : dépannage, devis, question. Rappelez le client, puis marquez la demande traitée.</p>
  <div class="onglets" role="group" aria-label="Filtrer">
    <button type="button" id="fAtraiter" aria-pressed="true">À traiter</button>
    <button type="button" id="fTraitees" aria-pressed="false">Traitées</button>
  </div>
  <div id="liste" aria-live="polite"><p class="vide">Chargement…</p></div>
</main>
<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var S = null; try{ S = JSON.parse(localStorage.getItem("outils:session") || "null"); }catch(e){}
  if(!S || !S.jeton){ location.replace("./index.html#connexion"); return; }
  var API = "/api/rapports?action=", D = [], VUE = "atraiter", CIBLE = new URLSearchParams(location.search).get("id") || "";
  var SORTES = {sav:"Dépannage", devis:"Demande de devis", info:"Question"};
  function appel(a, o){ return fetch(API + a, Object.assign({headers:{"x-auth":S.jeton, "content-type":"application/json"}}, o || {}))
    .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, st:r.status, d:d}; }); }); }
  function quand(iso){ try{ var d = new Date(iso); return d.toLocaleDateString("fr-FR", {weekday:"short", day:"numeric", month:"short"}) + " à " + d.toLocaleTimeString("fr-FR", {hour:"2-digit", minute:"2-digit"}); }catch(e){ return ""; } }
  function el(t, cls, txt){ var e = document.createElement(t); if(cls) e.className = cls; if(txt != null) e.textContent = txt; return e; }
  function charger(){
    appel("contacts").then(function(r){
      if(!r.ok){ $("liste").innerHTML = ""; $("liste").appendChild(el("p", "err", r.d.erreur || "Accès refusé.")); return; }
      D = r.d.demandes || [];
      if(r.d.destinataire) $("intro").textContent = "Les demandes envoyées par vos clients avec le QR code « Nous contacter » arrivent à " + r.d.destinataire + ". Rappelez le client, puis marquez la demande traitée.";
      if(CIBLE){ var c = D.filter(function(x){ return x.id === CIBLE; })[0]; if(c && c.traitee) VUE = "traitees"; }
      peindre();
    }).catch(function(){ $("liste").innerHTML = '<p class="err">Pas de réseau.</p>'; });
  }
  function peindre(){
    $("fAtraiter").setAttribute("aria-pressed", VUE === "atraiter"); $("fTraitees").setAttribute("aria-pressed", VUE === "traitees");
    var n = D.filter(function(x){ return !x.traitee; }).length;
    $("fAtraiter").textContent = "À traiter" + (n ? " (" + n + ")" : "");
    var l = D.filter(function(x){ return VUE === "atraiter" ? !x.traitee : !!x.traitee; });
    var h = $("liste"); h.textContent = "";
    if(!l.length){ h.appendChild(el("p", "vide", VUE === "atraiter" ? "Aucune demande à traiter." : "Aucune demande traitée.")); return; }
    l.forEach(function(x){ h.appendChild(carte(x)); });
    if(CIBLE){ var c = document.getElementById("d-" + CIBLE); if(c){ c.scrollIntoView({block:"start"}); c.focus(); } CIBLE = ""; }
  }
  function carte(x){
    var c = el("article", "dem" + (x.urgent ? " urgent" : "") + (x.traitee ? " traitee" : "")); c.id = "d-" + x.id; c.tabIndex = -1;
    var t = el("div", "tete");
    t.appendChild(el("span", "badge" + (x.urgent ? " rouge" : ""), (SORTES[x.sorte] || "Demande") + (x.urgent ? " urgent" : "")));
    if(x.traitee) t.appendChild(el("span", "badge vert", "Traitée par " + x.traitee.par));
    t.appendChild(el("span", "quand", quand(x.recue)));
    c.appendChild(t);
    c.appendChild(el("h2", "", x.nom));
    c.appendChild(el("p", "msg", x.message));
    var dl = el("dl");
    function ligne(k, v, href){ if(!v) return; dl.appendChild(el("dt", "", k)); var dd = el("dd"); if(href){ var a = el("a", "", v); a.href = href; dd.appendChild(a); } else dd.textContent = v; dl.appendChild(dd); }
    ligne("Téléphone", x.tel, "tel:" + String(x.tel || "").replace(/[^\d+]/g, ""));
    ligne("E-mail", x.email, "mailto:" + x.email);
    ligne("Adresse", x.adresse, x.adresse ? "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(x.adresse) : "");
    ligne("Disponibilités", x.dispo);
    if(x.traitee) ligne("Traitée le", quand(x.traitee.le));
    c.appendChild(dl);
    if(x.photos){
      var ph = el("div", "photos"); c.appendChild(ph);
      appel("contact&id=" + encodeURIComponent(x.id)).then(function(r){
        ((r.ok && r.d.demande.photos) || []).forEach(function(p, i){
          var im = el("img"); im.src = p.data; im.alt = "Photo " + (i + 1) + " envoyée par " + x.nom;
          im.addEventListener("click", function(){ var w = window.open(); if(w){ w.document.title = im.alt; var g = w.document.createElement("img"); g.src = p.data; g.style.maxWidth = "100%"; w.document.body.appendChild(g); } });
          ph.appendChild(im);
        });
      });
    }
    var b = el("div", "btns");
    if(x.tel){ var a1 = el("a", "btn", "Appeler"); a1.href = "tel:" + String(x.tel).replace(/[^\d+]/g, ""); b.appendChild(a1); }
    if(x.email){ var a2 = el("a", "btn ghost", "Répondre par e-mail"); a2.href = "mailto:" + x.email + "?subject=" + encodeURIComponent("Votre demande : " + (SORTES[x.sorte] || "")); b.appendChild(a2); }
    var bt = el("button", x.traitee ? "btn gris" : "btn ghost", x.traitee ? "Remettre à traiter" : "Marquer traitée"); bt.type = "button";
    bt.addEventListener("click", function(){
      bt.disabled = true;
      appel("contact-traitee&id=" + encodeURIComponent(x.id), {method:"POST", body:JSON.stringify({traitee: !x.traitee})}).then(function(r){
        bt.disabled = false; if(!r.ok){ alert(r.d.erreur || "Refusé."); return; }
        x.traitee = r.d.traitee; peindre();
      }).catch(function(){ bt.disabled = false; alert("Pas de réseau."); });
    });
    b.appendChild(bt);
    c.appendChild(b);
    return c;
  }
  $("fAtraiter").addEventListener("click", function(){ VUE = "atraiter"; peindre(); });
  $("fTraitees").addEventListener("click", function(){ VUE = "traitees"; peindre(); });
  charger();
})();
</script>
<script src="./pied.js?v=20261003a" defer></script>
</body>
</html>
