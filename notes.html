<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF9F2">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" sizes="180x180" href="/icone-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="/icone-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="/icone-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="/icone-120.png">
<link rel="apple-touch-icon-precomposed" href="/icone-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icone-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Travaux 360">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>To-do list — Suivi travaux 360</title>
<style>
:root{
  --bg:#F4F1EA;
  --card:#FFFDF8;
  --field:#EFEBE1;
  --ink:#22201C;
  --ink-2:#6E675C;
  --ink-3:#8C8475;
  --rule:#E2DCCE;
  --accent:#B4621A;
  --accent-soft:#FBEDE0;
  --solar:#E8A33D;
  --solar-soft:#FBEDE0;
  --danger:#A6291F;
  --danger-soft:#F8E4E0;
  --ok:#5E6E42;
  --r-card:2px;
  --r-field:2px;
  --tap:48px;
  --shadow:0 1px 2px rgba(34,32,28,.05), 0 10px 28px -18px rgba(34,32,28,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.45;letter-spacing:-.01em;
  padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));
  -webkit-text-size-adjust:100%;
}

/* ---------- en-tête ---------- */
header{
  position:sticky;top:0;z-index:20;
  background:rgba(241,243,247,.86);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid rgba(34,32,28,.07);
  padding:calc(10px + env(safe-area-inset-top,0px)) 14px 9px;
}
.h-row{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
header h1{font-size:21px;font-weight:700;letter-spacing:-.03em;margin:0}
header .ref{font-size:13px;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums}
nav{
  display:flex;gap:2px;overflow-x:auto;margin-top:10px;padding:3px;
  background:rgba(140,132,117,.12);border-radius:var(--r-field);scrollbar-width:none;
}
nav::-webkit-scrollbar{display:none}
nav button{
  flex:0 0 auto;border:0;background:transparent;color:var(--ink-2);
  border-radius:var(--r-field);padding:7px 14px;font-size:14px;font-weight:600;font-family:inherit;
  letter-spacing:-.01em;cursor:pointer;transition:background .18s ease,color .18s ease;
}
nav button[aria-current="true"]{
  background:var(--card);color:var(--ink);
  box-shadow:none;
}

main{max-width:760px;margin:0 auto;padding:16px 14px 8px}
section[hidden]{display:none}

/* ---------- cartes ---------- */
.block{
  background:var(--card);border-radius:var(--r-field);
  box-shadow:var(--shadow);padding:16px;margin-bottom:14px;
}
.block > h2{
  font-size:17px;font-weight:700;letter-spacing:-.02em;
  margin:0 0 14px;padding:0;
}
label.f{display:block;margin-bottom:14px}
label.f > span{display:block;font-size:13.5px;font-weight:500;color:var(--ink-2);margin-bottom:6px}
input[type=text],input[type=tel],input[type=email],input[type=number],input[type=date],textarea,select{
  width:100%;min-height:var(--tap);padding:12px 14px;font-size:16px;line-height:1.35;
  font-family:inherit;color:var(--ink);background:var(--field);
  border:1px solid transparent;border-radius:var(--r-field);
  transition:background .15s ease,border-color .15s ease;
}
input[type=email]{min-height:52px}
select{appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);
  background-position:calc(100% - 19px) 21px, calc(100% - 13px) 21px;
  background-size:6px 6px, 6px 6px;background-repeat:no-repeat;padding-right:38px}
input:focus,textarea:focus,select:focus{
  outline:none;background:var(--card);border-color:var(--accent);
  box-shadow:0 0 0 4px rgba(180,98,26,.16);
}
textarea{min-height:112px;resize:vertical;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:430px){.grid2{grid-template-columns:1fr}}

/* ---------- pastilles de choix ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{
  display:inline-flex;align-items:center;min-height:42px;padding:9px 16px;border-radius:var(--r-field);
  background:var(--field);color:var(--ink);font-size:14.5px;font-weight:500;
  cursor:pointer;user-select:none;transition:background .15s ease,color .15s ease,transform .1s ease;
}
.chip:active{transform:scale(.97)}
.chip input{position:absolute;opacity:0;width:0;height:0}
.chip.on{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 4px 14px -6px rgba(180,98,26,.7)}
.chip.on.multi{background:var(--accent)}
#tab-pv .chip.on{background:var(--solar);color:#20180A;box-shadow:0 4px 14px -6px rgba(242,160,7,.75)}
.legend{font-size:13.5px;font-weight:500;color:var(--ink-2);margin:0 0 8px}
.hint{font-size:13px;color:var(--ink-3);margin:8px 0 0;line-height:1.4}
.err{font-size:13.5px;color:var(--danger);margin:8px 0 0}
.ok{font-size:13.5px;color:var(--ok);margin:8px 0 0}

/* ---------- boutons ---------- */
button.act{
  min-height:var(--tap);padding:12px 18px;border-radius:var(--r-field);border:0;
  background:var(--field);color:var(--ink);font-size:15px;font-family:inherit;font-weight:600;
  letter-spacing:-.01em;cursor:pointer;transition:transform .1s ease,filter .15s ease;
}
button.act:active{transform:scale(.975)}
button.act.solid{background:var(--ink);color:#fff}
button.act.blue{background:var(--accent);color:#fff;box-shadow:0 6px 18px -10px rgba(180,98,26,.9)}
button.act.ghost{background:var(--accent-soft);color:var(--accent)}
button.act.danger{background:var(--danger-soft);color:var(--danger)}
button.act.rec{background:var(--accent-soft);color:var(--accent)}
button.act:disabled{opacity:.4}
#tab-pv button.act.solid{background:var(--solar);color:#20180A}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- pièces ---------- */
.room{border-radius:var(--r-field);background:var(--card);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.room > .head{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.room[data-open="1"] > .head{border-bottom:1px solid var(--rule)}
.room > .head .n{
  font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;color:#fff;background:var(--accent);
  border-radius:var(--r-field);padding:3px 9px;min-width:28px;text-align:center;
}
.room > .head .t{flex:1;font-weight:650;font-size:16px;letter-spacing:-.02em}
.room > .head .meta{font-size:12.5px;color:var(--ink-3)}
.room .body{padding:16px}
.room[data-open="0"] .body{display:none}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(106px,1fr));gap:10px;margin-top:12px}
.thumb{position:relative;border-radius:var(--r-field);overflow:hidden;background:#1A1815;box-shadow:var(--shadow)}
.thumb img{display:block;width:100%;height:106px;object-fit:cover}
.thumb input{width:100%;border:0;border-radius:0;min-height:40px;font-size:16px;padding:7px 9px;background:#fff}
.thumb .del{
  position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:0;
  background:rgba(10,13,18,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  color:#fff;font-size:17px;line-height:1;cursor:pointer;
}
.thumb .ann{right:42px;font-size:15px}
.dictating{background:var(--danger)!important;color:#fff!important;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
@media(prefers-reduced-motion:reduce){.dictating{animation:none;opacity:.75}
  *{transition:none!important}}

/* ---------- résultats photovoltaïques ---------- */
.calc{
  display:flex;align-items:center;justify-content:center;min-height:var(--tap);min-width:124px;
  padding:12px 14px;border-radius:var(--r-field);background:var(--solar-soft);color:#7A5200;
  font-size:15.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;
}
.pvres{border-radius:var(--r-field);overflow:hidden;box-shadow:var(--shadow)}
.pvres .top{
  display:flex;flex-wrap:wrap;gap:4px;padding:16px;color:#fff;
  background:linear-gradient(135deg,#16233A 0%,#B4621A 100%);
}
.pvres .top b{display:block;font-size:24px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pvres .top span{font-size:12.5px;color:rgba(255,255,255,.72)}
.pvres .cell{flex:1;min-width:112px}
.pvmonths{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--rule)}
.pvmonths div{background:#fff;padding:9px 3px;text-align:center;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pvmonths div b{display:block;font-size:13.5px;color:var(--ink);font-weight:650}
.simcard{border-radius:var(--r-field);overflow:hidden;margin-bottom:12px;background:var(--card);box-shadow:var(--shadow)}
.simcard img{display:block;width:100%;max-height:200px;object-fit:cover}
.simcard .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;font-size:13.5px}
.simcard .meta b{font-size:14.5px}

/* ---------- navigation bas de page ---------- */
.stepnav{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:nowrap;margin:2px 0 16px}
.stepnav button{
  flex:0 0 auto;min-height:44px;padding:9px 15px;border-radius:var(--r-field);border:0;
  background:var(--card);color:var(--ink);font-family:inherit;font-size:14.5px;font-weight:600;
  cursor:pointer;white-space:nowrap;box-shadow:var(--shadow);transition:transform .1s ease;
}
.stepnav button:active{transform:scale(.96)}
.stepnav button:disabled{opacity:.35;box-shadow:none}
.stepnav button.next{background:var(--accent);color:#fff}
.stepnav .dots{display:flex;gap:5px;align-items:center;justify-content:center;flex:1 1 auto}
.stepnav .dots button{
  flex:0 0 auto;width:32px;height:32px;min-height:32px;padding:0;border-radius:50%;
  font-size:13.5px;font-variant-numeric:tabular-nums;box-shadow:none;background:rgba(140,132,117,.16);
  color:var(--ink-2);display:flex;align-items:center;justify-content:center;
}
.stepnav .dots button[aria-current="true"]{background:var(--ink);color:#fff}

/* ---------- notifications ---------- */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:28px;z-index:80;
  background:rgba(34,32,28,.94);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  color:#fff;padding:13px 20px;border-radius:var(--r-field);font-size:14.5px;font-weight:500;max-width:88%;
  box-shadow:0 12px 32px -12px rgba(0,0,0,.6);
}
.toast[hidden]{display:none}

/* ---------- plein écran : croquis et implantation ---------- */
#sketch,#toit{
  position:fixed;inset:0;z-index:60;background:#1A1815;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);
}
#sketch[hidden],#toit[hidden]{display:none}
.sk-bar{
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:#262320;
}
.sk-bar.bottom{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));margin-top:auto}
.sk-bar button{
  min-height:44px;padding:10px 15px;border-radius:var(--r-field);border:0;background:rgba(255,255,255,.1);
  color:#F4F1EA;font-size:14.5px;font-family:inherit;font-weight:600;cursor:pointer;
}
.sk-bar button:active{transform:scale(.96)}
.sk-bar button.on{background:#fff;color:#22201C}
.sk-bar button.go{background:var(--accent);color:#fff;margin-left:auto}
.sk-bar .title{color:#8C8475;font-size:13.5px;font-weight:500;margin-right:auto;padding-left:4px}
.sk-bar .mini{display:flex;flex-direction:column;font-size:11px;color:#8C8475;gap:3px}
.sk-bar .mini input{
  width:86px;min-height:40px;font-size:16px;padding:7px 10px;background:rgba(255,255,255,.1);
  color:#fff;border:0;border-radius:var(--r-field);
}
.sk-dot{width:38px;height:38px;min-height:38px;border-radius:50%;padding:0;border:2px solid rgba(255,255,255,.25)}
.sk-dot.on{border-color:#fff;box-shadow:0 0 0 3px #1A1815,0 0 0 5px #fff}
#sk_colors{padding-top:0;gap:11px;background:#262320}
.sk-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;overflow:hidden}
#sk_canvas{background:#fff;border-radius:var(--r-field);max-width:100%;max-height:100%;touch-action:none;
  box-shadow:0 18px 50px -20px rgba(0,0,0,.8)}
#toit_canvas{background:#000;border-radius:var(--r-field);max-width:100%;max-height:100%;touch-action:none;
  box-shadow:0 18px 50px -20px rgba(0,0,0,.8)}

.menu-link{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:var(--r-field);background:rgba(140,132,117,.14);color:var(--ink-2);font-size:13px;font-weight:600;text-decoration:none;margin-right:10px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(106px,1fr));gap:10px;margin-top:12px}
.thumb{position:relative;border-radius:var(--r-field);overflow:hidden;background:#1A1815;box-shadow:var(--shadow)}
.thumb img{display:block;width:100%;height:106px;object-fit:cover}
.thumb input{width:100%;border:0;border-radius:0;min-height:40px;font-size:16px;padding:7px 9px;background:#fff}
.thumb .del{
  position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:0;
  background:rgba(10,13,18,.62);color:#fff;font-size:17px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;
}
#sketch,#toit{
  position:fixed;inset:0;z-index:60;background:#1A1815;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);
}
#sketch[hidden],#toit[hidden]{display:none}
.sk-bar{
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:#262320;
}
.sk-bar.bottom{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));margin-top:auto}
.sk-bar button{
  min-height:44px;padding:10px 15px;border-radius:var(--r-field);border:0;background:rgba(255,255,255,.1);
  color:#F4F1EA;font-size:14.5px;font-family:inherit;font-weight:600;cursor:pointer;
}
.sk-bar button:active{transform:scale(.96)}
.sk-bar button.on{background:#fff;color:#22201C}
.sk-bar button.go{background:var(--accent);color:#fff;margin-left:auto}
.sk-bar .title{color:#8C8475;font-size:13.5px;font-weight:500;margin-right:auto;padding-left:4px}
.sk-bar .mini{display:flex;flex-direction:column;font-size:11px;color:#8C8475;gap:3px}
.sk-bar .mini input{
  width:86px;min-height:40px;font-size:16px;padding:7px 10px;background:rgba(255,255,255,.1);
  color:#fff;border:0;border-radius:var(--r-field);
}
.sk-dot{width:38px;height:38px;min-height:38px;border-radius:50%;padding:0;border:2px solid rgba(255,255,255,.25)}
.sk-dot.on{border-color:#fff;box-shadow:0 0 0 3px #1A1815,0 0 0 5px #fff}
#sk_colors{padding-top:0;gap:11px;background:#262320}
.sk-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;overflow:hidden}
#sk_canvas{background:#fff;border-radius:var(--r-field);max-width:100%;max-height:100%;touch-action:none;
  box-shadow:0 18px 50px -20px rgba(0,0,0,.8)}
input[type="date"],input[type="time"]{min-width:0;width:100%;-webkit-appearance:none;appearance:none}
html{-webkit-text-size-adjust:100%}
body{touch-action:manipulation}
button,.act,.chip,label,input,select,textarea,a{touch-action:manipulation}
.filtres{margin-top:9px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;
 scrollbar-width:none;padding-bottom:2px}
.filtres::-webkit-scrollbar{display:none}
.filtres .chip{flex:0 0 auto}

/* ---------- carte de liste ---------- */
.note{border-radius:var(--r-field);padding:14px 15px 10px;margin-bottom:12px;border:1px solid rgba(34,32,28,.10);
 box-shadow:none}
.note.jaune{background:#FDF3D3;border-color:#F0E2B4}
.note.vert{background:#E6F4E4;border-color:#CBE6C7}
.note.bleu{background:#E3EEFC;border-color:#C8DCF6}
.note.rose{background:#FBE6E6;border-color:#F3CFCF}
.note.violet{background:#EFE8FB;border-color:#DCD0F4}
.note.gris{background:#EEF1F5;border-color:#DCE2EA}
.note.finie{opacity:.7}

.note .n-tete{display:flex;align-items:flex-start;gap:10px}
.note .n-titre{flex:1 1 auto!important;width:auto!important;min-width:0;border:0!important;background:none!important;
 font-family:inherit;font-size:17px!important;font-weight:700;letter-spacing:-.02em;color:var(--ink);
 padding:2px 0!important;min-height:0!important;border-radius:0!important}
.note .n-titre:focus{outline:none;box-shadow:none!important;background:none!important}
.note .n-pin{flex:0 0 auto;width:32px;height:32px;min-height:32px;border:0;border-radius:50%;
 background:rgba(255,255,255,.6);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.note .n-pin svg{width:16px;height:16px;stroke:var(--ink-2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.note .n-pin.on{background:#fff}
.note .n-pin.on svg{stroke:#B07807;fill:rgba(201,133,7,.35)}

.note .n-tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.note .n-tag{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:var(--r-field);background:rgba(255,255,255,.75);color:var(--ink-2)}
.note .n-tag.acc{color:var(--accent)}
.note .n-tag.rouge{color:var(--danger)}
.note .n-tag.ambre{color:#9A6A05}

.note .n-items{margin-top:8px}
.note .n-item{display:flex!important;align-items:center;gap:11px;padding:2px 0;min-height:38px}
.note .n-case{flex:0 0 auto!important;width:22px!important;height:22px!important;min-height:22px!important;
 border:2px solid rgba(34,32,28,.45)!important;border-radius:var(--r-field)!important;background:transparent!important;
 padding:0!important;cursor:pointer;display:flex;align-items:center;justify-content:center}
.note .n-case.on{background:var(--ink)!important;border-color:var(--ink)!important}
.note .n-case svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.note .n-texte{flex:1 1 auto!important;width:auto!important;min-width:0;border:0!important;background:none!important;
 font-family:inherit;font-size:15.5px!important;color:var(--ink);padding:6px 0!important;min-height:0!important;
 border-radius:0!important;line-height:1.35}
.note .n-texte:focus{outline:none;box-shadow:none!important;background:none!important}
.note .n-item.fait .n-texte{color:var(--ink-3);text-decoration:line-through}
.note .n-del{flex:0 0 auto;width:26px;height:26px;min-height:26px;border:0;border-radius:50%;background:none;
 color:var(--ink-3);font-size:17px;line-height:1;cursor:pointer;padding:0}
.note .n-plus{display:flex;align-items:center;gap:11px;width:100%;margin-top:2px;border:0;background:none;
 color:var(--ink-3);font-family:inherit;font-size:15px;padding:9px 0;cursor:pointer;text-align:left}
.note .n-plus b{width:22px;text-align:center;font-size:19px;font-weight:400;color:var(--ink-3)}

.note .thumbs{grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:10px}
.note .thumb img{height:88px}

.note .n-pied{display:flex;align-items:center;gap:6px;margin-top:8px;padding-top:8px;
 border-top:1px solid rgba(34,32,28,.08);flex-wrap:wrap}
.note .n-etat{flex:1 1 100%;order:2;font-size:11.5px;color:var(--ink-3);margin-top:4px}
.note .n-outils{display:flex;gap:4px;order:1;flex:1}
.note .n-petit{width:36px;height:36px;min-height:36px;border:0;border-radius:50%;background:rgba(255,255,255,.7);
 color:var(--ink-2);font-family:inherit;font-size:0;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.note .n-petit svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.note .n-petit.danger{color:var(--danger)}

/* =====================================================================
   INSTRUMENT — la couche d'habillage du site
   ---------------------------------------------------------------------
   Direction : un instrument de mesure, pas un tableau de bord de vaisseau.
   Le vocabulaire est technique — traits d'un pixel, équerres de repère,
   chiffres en chasse fixe, graphite et orange électrique — mais les
   surfaces de travail restent claires et contrastées : la fiche se
   remplit dehors, en plein soleil, avec des gants.

   Deux couleurs, deux rôles, jamais l'un pour l'autre :
      orange  ce sur quoi on agit    (boutons, liens, onglet courant)
      cyan    ce que l'outil mesure  (chiffres, repères, carte, états)

   Tout part des variables ci-dessous. Une valeur suffit à reprendre le
   site entier.
   ===================================================================== */

/* ---------- une seule police, hébergée ici : elle marche hors réseau ---------- */
@font-face{
  font-family:"Plus Jakarta Sans";
  src:url("./polices/jakarta-var.woff2") format("woff2-variations");
  font-weight:200 800; font-style:normal; font-display:swap;
}

:root{
  /* graphite : le châssis */
  --g-900:#0A0E14;
  --g-800:#10161F;
  --g-700:#1A2230;
  --g-600:#27313F;
  --trait-tech:rgba(255,255,255,.10);

  /* surfaces de travail : claires, pour le plein soleil */
  --bg:#383E42;          /* anthracite : le site est un châssis, les fiches sont dessus */
  --card:#FFFFFF;
  --field:#EFF1F4;
  --champ-fond:#FFFFFF;
  --champ-bord:#D8DDE4;
  --rule:rgba(10,14,20,.09);
  --ink:#0C1119;
  --ink-2:#4B5563;
  --ink-3:#6B7684;

  /* ce sur quoi on agit */
  --accent:#B45309;
  --accent-fonce:#92400E;
  --accent-vif:#FB923C;          /* sur graphite, il faut qu'il brille */
  --accent-soft:#FDF4EA;

  /* ce que l'outil mesure */
  --data:#0E7490;
  --data-vif:#22D3EE;
  --data-soft:#E7F4F7;

  /* familles, toutes au même niveau */
  --violet:#5B5F80;      --violet-soft:#EFEFF4;
  --vert:#3F6B52;        --vert-soft:#EAF2ED;
  --ambre:#8A6524;       --ambre-soft:#F6F1E8;
  --rouge:#A03A33;       --rouge-soft:#F8EDEB;
  --solar:#8A6524;       --solar-soft:#F6F1E8;
  --danger:#A03A33;      --danger-soft:#F8EDEB;
  --ok:#3F6B52;          --ok-soft:#EAF2ED;

  /* géométrie : des angles francs, pas des galets */
  --r-card:10px;
  --r-field:8px;
  --r-pill:999px;

  --ombre-1:0 1px 2px rgba(10,14,20,.05);
  --ombre-2:0 1px 2px rgba(10,14,20,.05), 0 10px 24px -14px rgba(10,14,20,.35);
  --ombre-3:0 22px 48px -20px rgba(10,14,20,.45);
  --shadow:var(--ombre-2);

  --sans:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  /* tout est dans la même police : --mono ne change que les chiffres,
     qui restent tabulaires pour que les colonnes s'alignent */
  --mono:var(--sans);
}

html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  letter-spacing:-.006em;
}

/* ---------- les valeurs : mêmes lettres, chiffres alignés ----------
   références, dates, poids, compteurs : ce sont des valeurs. Elles
   gardent des chiffres tabulaires, donc de largeur égale : une valeur
   qui change ne fait pas danser la ligne. */
.mono,.ref,.num,.n,.etat,time,
input[type="number"],input[type="date"],input[type="time"],input[type="tel"]{
  font-variant-numeric:tabular-nums;
}

/* ---------- les intertitres ---------- */
h2.sec,.legend{
  font-size:11px;
  font-weight:600;
  letter-spacing:.11em;
  text-transform:uppercase;
  color:var(--ink-3);
}

/* ---------- surfaces ---------- */
.block,.travaux,.notifs,.restaurer{
  background:var(--card);
  border:1px solid var(--rule);
  border-radius:var(--r-card);
  box-shadow:var(--ombre-1);
}
.block h2{
  font-size:15.5px;font-weight:600;letter-spacing:-.015em;color:var(--ink);
}
h1{font-weight:600;letter-spacing:-.03em}
.hint{color:var(--ink-3);line-height:1.55}

/* ---------- champs : blancs, cernés, avec une amorce à gauche ---------- */
input[type="text"],input[type="search"],input[type="tel"],input[type="email"],
input[type="number"],input[type="date"],input[type="time"],input[type="url"],
input[type="password"],
input:not([type]),textarea,select{
  background:var(--champ-fond);
  border:1px solid var(--champ-bord);
  border-radius:var(--r-field);
  transition:border-color .16s ease, box-shadow .16s ease;
}
input::placeholder,textarea::placeholder{color:#9AA4B0}
input:hover:not(:focus),textarea:hover:not(:focus),select:hover:not(:focus){border-color:#BFC7D1}
input:focus,textarea:focus,select:focus{
  outline:none;background:#fff;
  border-color:var(--data);
  box-shadow:0 0 0 3px rgba(14,116,144,.16);
}
label span{font-weight:500;color:var(--ink-2)}

/* ---------- boutons ---------- */
button,.act,button.p{
  border-radius:var(--r-field);
  font-family:var(--sans);
  font-weight:600;
  letter-spacing:-.008em;
  transition:background .16s ease,color .16s ease,border-color .16s ease,
             box-shadow .16s ease,transform .08s ease;
}
button.p,.act.blue,.act.solid,button.go,.sk-bar button.go{
  background:var(--accent);color:#fff;border:1px solid transparent;
  box-shadow:0 1px 2px rgba(146,64,14,.3);
}
.act.ghost{
  background:#fff;color:var(--ink-2);
  border:1px solid var(--champ-bord);box-shadow:var(--ombre-1);
}
.act.danger{background:var(--rouge-soft);color:var(--rouge);border:1px solid rgba(160,58,51,.18);box-shadow:none}
button:active,.act:active,button.p:active{transform:translateY(1px)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,
textarea:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--data);outline-offset:2px;
}

/* ---------- pastilles et étiquettes ---------- */
.chip,.chips label{
  border-radius:var(--r-pill);
  border:1px solid var(--champ-bord);
  background:#fff;color:var(--ink-2);font-weight:500;
  transition:background .16s ease,border-color .16s ease,color .16s ease;
}
.chip.on,.chips label.on{
  background:var(--accent-soft);border-color:rgba(180,83,9,.4);
  color:var(--accent-fonce);font-weight:600;
}
.tag,.f .tag{
  border-radius:var(--r-pill);
  font-size:11px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;padding:4px 10px;
}
.ref{
  font-size:11.5px;font-weight:700;letter-spacing:.04em;
  border-radius:var(--r-field);
}

/* ---------- le châssis : en-tête sombre, trait technique ---------- */
header{
  background:var(--g-900);
  border-bottom:1px solid var(--trait-tech);
  color:#E7ECF2;
  position:relative;
}
header::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,var(--accent-vif),rgba(34,211,238,.55),transparent 72%);
}
header h1{color:#F2F5F9;font-weight:600}
header .hint,header .meta,header .etat{color:#8A97A6}
.menu-link,header a[href="./index.html"]{
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.18);
  border-radius:var(--r-field);
  color:#EDF1F6;
  box-shadow:none;
}
#hdrRef,header .ref{
  color:var(--data-vif);background:none;letter-spacing:.05em;font-weight:600;
}

/* ---------- barre d'onglets : une réglette ---------- */
nav#nav{
  gap:2px;padding:4px;margin:10px -2px 0;
  background:var(--g-800);
  border:1px solid var(--trait-tech);
  border-radius:10px;
}
nav#nav button{
  padding:7px 6px 6px;border-radius:7px;
  color:#8A97A6;font-weight:500;font-size:10.5px;
  letter-spacing:.02em;
}
nav#nav button[aria-current="true"]{
  color:#0A0E14;background:var(--accent-vif);
  font-weight:600;box-shadow:0 0 0 1px rgba(251,146,60,.5),0 6px 16px -8px rgba(251,146,60,.9);
}
nav#nav button svg{stroke-width:1.9}
.avance{margin-top:8px}
.avance .barre{height:3px;border-radius:0;background:rgba(255,255,255,.12)}
.avance .barre i{border-radius:0;background:linear-gradient(90deg,var(--accent-vif),var(--data-vif))}
.avance .etape{color:#8A97A6}
.avance .etape b{color:#E7ECF2}

/* ---------- l'équerre de repère : la signature de la maison ---------- */
.equerre{position:relative}
.equerre::before,.equerre::after{
  content:"";position:absolute;width:10px;height:10px;pointer-events:none;
  border:1px solid var(--data-vif);opacity:.55;
}
.equerre::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.equerre::after{bottom:-1px;right:-1px;border-left:0;border-top:0}

/* ---------- le survol, là où il existe ---------- */
@media (hover:hover){
  button.p:hover,.act.blue:hover,.act.solid:hover,button.go:hover{
    background:var(--accent-fonce);box-shadow:0 2px 10px -3px rgba(146,64,14,.5);
  }
  .act.ghost:hover{background:#FAFBFC;border-color:#BFC7D1;color:var(--ink)}
  .act.danger:hover{background:#F4E2DF}
  .chip:hover:not(.on),.chips label:hover:not(.on){border-color:#BFC7D1;background:#FAFBFC}
  .block:hover,.travaux:hover{box-shadow:var(--ombre-2)}
  .menu-link:hover,header a[href="./index.html"]:hover{background:rgba(255,255,255,.14);color:#fff}
  nav#nav button:hover:not([aria-current="true"]){color:#C7D0DA;background:rgba(255,255,255,.06)}
}
@media (prefers-reduced-motion:reduce){
  button,.act,input,textarea,select,.chip,.chips label,.block,.travaux{transition:none}
  button:active,.act:active,button.p:active{transform:none}
}

/* =====================================================================
   SUR LE FOND ANTHRACITE
   ---------------------------------------------------------------------
   Le fond de page est devenu sombre : les fiches restent des feuilles
   blanches posées dessus, mais tout ce qui s'écrit À CÔTÉ des fiches —
   intertitres, signature, salutation, boutons de page — doit passer en
   clair, sinon il disparaît. Deux valeurs suffisent, mesurées sur
   #383E42 : 9,2 pour la première, 5,3 pour la seconde.
   Les deux couleurs de rôle passent à leur version vive, la sourde ne
   tient pas sur le sombre.
   ===================================================================== */
:root{
  --sur-fond:#E9ECF2;
  --sur-fond-2:#AEB7BF;
  --trait-fond:rgba(255,255,255,.14);
}
h2.sec,.sec{color:var(--sur-fond-2)}
.signature,.signature b,.signature span,.signature .version{color:var(--sur-fond-2)}
.signature .version{opacity:.85}
.tete .salut{color:var(--sur-fond)}
.tete .salut em{color:var(--accent-vif)}
.tete .meta{color:var(--sur-fond-2)}
.marque-app{color:var(--data-vif)}
.haut button{background:rgba(255,255,255,.08);color:var(--sur-fond-2)}
.haut button:hover{background:rgba(255,255,255,.14);color:var(--sur-fond)}
.grille{border-top-color:var(--trait-fond)}

#champRecherche > span{color:var(--sur-fond-2)}
#vide{color:var(--sur-fond-2)}
.stepnav .dots button{color:var(--sur-fond-2);border-color:var(--trait-fond)}
.stepnav .dots button[aria-current="true"]{background:var(--sur-fond);color:var(--g-900)}

/* =====================================================================
   PASTEL VIVANT — le fond de la To-do list
   ---------------------------------------------------------------------
   La page qu'on ouvre le plus souvent : un fond crème, trois grandes
   bulles de couleur floues (pêche, menthe, lilas) qui dérivent très
   lentement. L'en-tête devient clair, en verre dépoli. Seuls transform
   et opacity bougent ; tout s'arrête si le téléphone réduit les
   animations.
   ===================================================================== */
:root{--sur-fond:#1F2937;--sur-fond-2:#4B5563;--trait-fond:rgba(15,23,42,.10)}
/* le crème va sur html seul : un fond sur body recouvrirait les bulles */
html{background:#FFF9F2}
body{background:transparent!important}
#fondPastel{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#fondPastel i{position:absolute;display:block;border-radius:50%;filter:blur(56px);will-change:transform}
#fondPastel .b1{width:62vmax;height:62vmax;left:-22vmax;top:-18vmax;background:rgba(255,196,153,.62);animation:pastel1 18s ease-in-out infinite}
#fondPastel .b2{width:56vmax;height:56vmax;right:-24vmax;top:28vh;background:rgba(167,235,200,.6);animation:pastel2 22s ease-in-out infinite}
#fondPastel .b3{width:64vmax;height:64vmax;left:-14vmax;bottom:-30vmax;background:rgba(200,184,255,.55);animation:pastel3 26s ease-in-out infinite}
@keyframes pastel1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(12vw,10vh) scale(1.12)}}

/* ---------- la fête : une liste terminée ---------- */
#fete{position:fixed;inset:0;z-index:90;pointer-events:none;overflow:hidden}
#fete[hidden]{display:none}
#fete span{position:absolute;top:-16px;width:8px;height:12px;border-radius:2px;
  animation:confettiTombe 1.7s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes confettiTombe{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),105vh) rotate(560deg);opacity:0}}
#fete .bravo{position:absolute;left:50%;top:38%;width:auto;height:auto;border-radius:14px;
  transform:translateX(-50%);background:#0C1119;color:#fff;padding:12px 18px;font-weight:700;font-size:14.5px;
  white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;

@keyframes bravoArrive{0%{opacity:0;transform:translate(-50%,10px) scale(.96)}12%{opacity:1;transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0}}

<script>
(function(){
/* ---------- session expirée : retour à la connexion ---------- */
(function(){
  var brut = window.fetch;
  window.fetch = function(){
    return brut.apply(this, arguments).then(function(r){
      if(r && r.status === 401){
        try{
          r.clone().json().then(function(d){
            if(d && d.erreur && String(d.erreur).indexOf("Session") >= 0){
              try{ localStorage.removeItem("outils:session"); }catch(e){}
              location.replace("./index.html");
            }
          }).catch(function(){});
        }catch(e){}
      }
      return r;
    });
  };
})();

/* ---------- session ---------- */
var SESSION=null;
try{ SESSION=JSON.parse(localStorage.getItem("outils:session")||"null"); }catch(e){}
var ENLIGNE = location.protocol==="http:" || location.protocol==="https:";
if(ENLIGNE && (!SESSION || !SESSION.jeton)){
  location.replace("./index.html");
}
function jetonSession(){ return SESSION && SESSION.jeton ? SESSION.jeton : ""; }

if(!window.storage){
  window.storage = {
    get:function(k){ try{ var v=localStorage.getItem(k); return Promise.resolve(v===null?null:{key:k,value:v}); }catch(e){ return Promise.resolve(null); } },
    set:function(k,v){ try{ localStorage.setItem(k,v); return Promise.resolve({key:k,value:v}); }catch(e){ return Promise.reject(e); } },
    delete:function(k){ try{ localStorage.removeItem(k); }catch(e){} return Promise.resolve({key:k,deleted:true}); },
    list:function(p){ var out=[]; try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(!p||k.indexOf(p)===0) out.push(k); } }catch(e){} return Promise.resolve({keys:out}); }
  };
}


/* ---------- accès au site ---------- */
function baseSite(){
  try{ return location.origin.indexOf("http")===0 ? location.origin : ""; }catch(e){ return ""; }
}
function jetonSession(){
  try{ var s=JSON.parse(localStorage.getItem("outils:session")||"null"); return s && s.jeton ? s.jeton : ""; }catch(e){ return ""; }
}
function apiUrl(a){ return baseSite()+"/api/rapports?action="+a; }
function apiEnTetes(){ return {"content-type":"application/json","x-auth":jetonSession()}; }
function apiPret(silencieux){
  if(!baseSite() || !jetonSession()){
    if(!silencieux) toast("Ouvrez l'appli depuis votre site, en étant connecté.");
    return false;
  }
  return true;
}

function compress(file, cb){
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var max=1400, w=img.width, h=img.height;
      if(w>max||h>max){ var r=Math.min(max/w,max/h); w=Math.round(w*r); h=Math.round(h*r); }
      var cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      cb({data:cv.toDataURL("image/jpeg",0.72), w:w, h:h, legende:""});
    };
    img.onerror=function(){ cb(null); };
    img.src=fr.result;
  };
  fr.onerror=function(){ cb(null); };
  fr.readAsDataURL(file);
}


var $ = function(id){ return document.getElementById(id); };
var toastT;
function toast(msg){
  var t=$("toast"); t.textContent=msg; t.hidden=false;
  clearTimeout(toastT); toastT=setTimeout(function(){ t.hidden=true; }, 2400);
}
function uid(){ return "n"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function maintenant(){ return new Date().toISOString(); }
function frCourt(iso){
  if(!iso) return "";
  var a=String(iso).slice(0,10).split("-");
  return a[2]+"/"+a[1];
}
function frJour(iso){
  if(!iso) return "";
  var d=new Date(iso+"T12:00:00");
  var J=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
  var auj=new Date().toISOString().slice(0,10);
  if(iso===auj) return "aujourd'hui";
  var demain=new Date(Date.now()+864e5).toISOString().slice(0,10);
  if(iso===demain) return "demain";
  if(iso<auj) return "en retard";
  var dans=(Date.parse(iso+"T12:00:00")-Date.now())/864e5;
  if(dans<7) return J[d.getDay()];
  return frCourt(iso);
}
function ilya(iso){
  if(!iso) return "";
  var m=Math.round((Date.now()-Date.parse(iso))/60000);
  if(m<1) return "à l'instant";
  if(m<60) return "il y a "+m+" min";
  var h=Math.round(m/60);
  if(h<24) return "il y a "+h+" h";
  return "le "+frCourt(iso);
}

var N={listes:[], aSupprimer:[]}, FILTRE="toutes", EQUIPE=[], DOSSIERS=[], SYNC="local";
var MOI=(SESSION && SESSION.nom) ? SESSION.nom : "";
/* Le nom sous lequel le serveur signe mes listes (« Johan ») n'est pas
   forcément celui de la session (« Johan Klughertz ») : on retient le
   sien pour reconnaître mes listes. */
var AUTEUR_MOI="";
try{ AUTEUR_MOI=localStorage.getItem("notes:moi")||""; }catch(e){}
function estMoi(nom){ return !!nom && (nom === MOI || nom === AUTEUR_MOI); }
function dAutrui(l){ return !!l.auteur && !estMoi(l.auteur); }
var COULEURS=[["jaune","#FDF3D3"],["vert","#E6F4E4"],["bleu","#E3EEFC"],
              ["rose","#FBE6E6"],["violet","#EFE8FB"],["gris","#EEF1F5"]];

/* ---------- stockage local ---------- */
var saveT;
function save(pousser){
  clearTimeout(saveT);
  saveT=setTimeout(function(){
    try{ window.storage.set("notes:local", JSON.stringify(N)); }catch(e){}
    if(pousser!==false) pousser_serveur();
  }, 350);
}
function charger_local(cb){
  try{
    window.storage.get("notes:local").then(function(r){
      if(r && r.value){ try{ N=JSON.parse(r.value); }catch(e){} }
      if(!N.listes) N.listes=[];
      if(!N.aSupprimer) N.aSupprimer=[];
      /* l'ancienne liste des suppressions ne sert plus : c'est la
         corbeille du serveur qui fait foi */
      delete N.supprimees;
      cb();
    }).catch(cb);
  }catch(e){ cb(); }
}

/* ---------- synchronisation ---------- */
function majSync(etat, detail){
  SYNC=etat;
  var e=$("syncEtat");
  e.textContent = etat==="ok" ? "synchronisé"
    : etat==="cours" ? "synchronisation…"
    : etat==="hors" ? "hors connexion" : (detail||"");
  e.style.color = etat==="ok" ? "var(--ok)" : (etat==="hors" ? "var(--ink-3)" : "var(--ink-2)");
}
var envoiEnCours=false, aRenvoyer=false;
function pousser_serveur(){
  if(!apiPret(true)) { majSync("hors"); return; }
  if(envoiEnCours){ aRenvoyer=true; return; }
  envoiEnCours=true; majSync("cours");
  fetch(apiUrl("notes-enregistrer"), {method:"POST", headers:apiEnTetes(),
    body:JSON.stringify({listes:N.listes})})
    .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
    .then(function(d){
      envoiEnCours=false;
      majSync("ok");
      if(aRenvoyer){ aRenvoyer=false; pousser_serveur(); }
    })
    .catch(function(){ envoiEnCours=false; majSync("hors"); });
}
function tirer_serveur(cb){
  var fini=false;
  function fin(){ if(fini) return; fini=true; if(cb) cb(); }
  if(!apiPret(true)){ majSync("hors"); fin(); return; }
  majSync("cours");
  fetch(apiUrl("notes"), {headers:apiEnTetes()})
    .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
    .then(function(d){
      if(d.moi){ AUTEUR_MOI=d.moi; try{ localStorage.setItem("notes:moi", d.moi); }catch(e){} }
      fusionner(d.listes||[], d.supprimees||[]);
      majSync("ok");
      try{ window.storage.set("notes:local", JSON.stringify(N)); }catch(e){}
      render();
      /* les suppressions en attente partent d'abord, l'envoi ensuite */
      return supprimerEnAttente(d.listes||[], d.supprimees||[]).then(fin);
    })
    .catch(function(){ majSync("hors"); fin(); });
}
function fusionner(distantes, jeteesServeur){
  /* la version la plus récente gagne, liste par liste */
  /* ce qui est supprimé : la corbeille du serveur, plus ce qu'on a
     supprimé ici sans avoir encore pu le lui dire */
  var jetees = (N.aSupprimer || []).concat(jeteesServeur || []);
  distantes = distantes.filter(function(d){ return jetees.indexOf(d.id)<0; });
  var par={};
  N.listes.forEach(function(l){ par[l.id]=l; });
  distantes.forEach(function(d){
    var loc=par[d.id];
    if(!loc){ N.listes.push(d); par[d.id]=d; return; }
    if((d.maj||"") > (loc.maj||"")){
      for(var k in d) loc[k]=d[k];
    }
  });
  /* Une liste ne disparaît d'ici que si elle a été supprimée — ici ou
     ailleurs (le serveur tient la corbeille). Une liste à moi que le
     serveur ne renvoie pas n'est PAS supprimée : elle lui manque, et le
     prochain envoi la lui rend. C'est ce qui a permis, avant, de tout
     perdre : un serveur qui répondait « rien » effaçait aussi le
     téléphone. Seule une liste d'un collègue qui ne me la partage plus
     s'en va. */
  var ids={};
  distantes.forEach(function(d){ ids[d.id]=1; });
  N.listes = N.listes.filter(function(l){
    if(jetees.indexOf(l.id)>=0) return false;
    if(ids[l.id] || l.local) return true;
    /* « moi » tel que le serveur signe mes listes ; sans cette
       réponse, dans le doute, on garde */
    return !l.auteur || !AUTEUR_MOI || l.auteur === AUTEUR_MOI;
  });
  trier();
}
/* une liste supprimée ici hors connexion : le serveur l'a encore, on
   la lui fait mettre à la corbeille maintenant */
function supprimerEnAttente(distantes, jeteesServeur){
  var envois=[];
  (N.aSupprimer||[]).slice().forEach(function(id){
    if((jeteesServeur||[]).indexOf(id)>=0 || !distantes.some(function(d){ return d.id===id; })){
      oublierSuppression(id); return;
    }
    envois.push(envoyerSuppression(id));
  });
  return Promise.all(envois);
}
function oublierSuppression(id){
  N.aSupprimer=(N.aSupprimer||[]).filter(function(x){ return x!==id; });
  try{ window.storage.set("notes:local", JSON.stringify(N)); }catch(e){}
}
function envoyerSuppression(id){
  return fetch(apiUrl("note-supprimer")+"&id="+encodeURIComponent(id), {headers:apiEnTetes()})
    .then(function(r){ if(r.ok) oublierSuppression(id); return r.ok; })
    .catch(function(){ return false; });
}
/* Une liste reste à sa place : on la retrouve là où on l'a laissée, qu'on
   la modifie ou qu'on la coche. Seule l'épingle la met en tête ; les
   autres suivent leur date de création, la plus récente d'abord. */
function creeLe(l){
  if(l.cree) return l.cree;
  var m=/^n([0-9a-z]+)[0-9a-z]{4}$/.exec(l.id||"");
  var t=m ? parseInt(m[1], 36) : NaN;
  if(isFinite(t) && t > 1e12 && t < 4e12) return new Date(t).toISOString();
  return l.maj || "";
}
function trier(){
  N.listes.sort(function(a,b){
    if(!!b.epingle !== !!a.epingle) return b.epingle ? 1 : -1;
    return creeLe(b).localeCompare(creeLe(a));
  });
}

/* ---------- listes ---------- */
function nouvelleListe(){
  var l={id:uid(), titre:"", items:[{id:uid(), texte:"", fait:false}],
         epingle:false, couleur:"jaune", pour:"", partage:[], quand:"",
         photos:[], cree:maintenant(), maj:maintenant(), local:true};
  N.listes.unshift(l);
  save();
  ouvrirListe(l.id);
  var champ=document.querySelector('[data-titre="'+l.id+'"]');
  if(champ) champ.focus();
}
function touche(l){ l.maj=maintenant(); l.local=false; }
/* Une liste partagée est modifiée à plusieurs. On date chaque case, pas
   seulement la liste : le serveur peut alors fusionner case par case au
   lieu de laisser le dernier qui enregistre effacer le travail de
   l'autre. */
function toucheItem(l, it){ it.maj=maintenant(); touche(l); }
/* ---------- la journée ----------
   Aujourd'hui = les tâches cochées aujourd'hui, sur toutes celles qu'il
   restait à faire ce matin (les cochées du jour + les pas encore faites).
   Le bonhomme sourit de plus en plus à mesure que la barre avance. */
function aujourdhui(){ var d=new Date(); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function faiteAujourdhui(it){
  if(!it.fait || !it.faitLe) return false;
  var d=new Date(it.faitLe);
  var j=d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
  return j===aujourdhui();
}
var JOURNEE_AVANT=-1;
var BOUCHES=[
  "M15 27 L27 27",                 /* rien encore : on attend */
  "M14 26 Q21 29 28 26",           /* un début */
  "M13 25 Q21 31 29 25",           /* à mi-chemin */
  "M12 24 Q21 34 30 24",           /* presque */
  "M11.5 23.5 Q21 37 30.5 23.5 Z"  /* tout est fait */
];
function majJournee(){
  var e=$("journee"); if(!e) return;
  var faites=0, reste=0;
  N.listes.forEach(function(l){
    (l.items||[]).forEach(function(it){
      if(!String(it.texte||"").trim()) return;
      if(!it.fait) reste++;
      else if(faiteAujourdhui(it)) faites++;
    });
  });
  var total=faites+reste;
  e.hidden = !N.listes.length;
  var r = total ? faites/total : 0;
  var niveau = !total ? 0 : (r>=1 ? 4 : r>=0.66 ? 3 : r>=0.33 ? 2 : faites ? 1 : 0);
  $("journeeTitre").textContent = !total ? "Rien à faire aujourd'hui, profitez-en !"
    : r>=1 ? "Tout est fait, bravo !"
    : faites ? "Aujourd'hui : "+faites+" tâche"+(faites>1?"s":"")+" faite"+(faites>1?"s":"")+" sur "+total
    : "C'est parti : "+total+" tâche"+(total>1?"s":"")+" à faire";
  $("journeeN").textContent = total ? faites+"/"+total : "";
  $("journeeBarre").style.transform = "scaleX("+(total ? r : 0)+")";
  var svg=e.querySelector(".bonhomme");
  var bouche=svg.querySelector(".bouche");
  bouche.setAttribute("d", BOUCHES[!total ? 2 : niveau]);
  bouche.setAttribute("fill", niveau===4 ? "#78350F" : "none");
  var rieur = niveau===4 || !total;
  svg.querySelector(".yeux-ronds").setAttribute("opacity", rieur ? "0" : "1");
  svg.querySelector(".yeux-rieurs").setAttribute("opacity", rieur ? "1" : "0");
  svg.querySelectorAll(".joue").forEach(function(j){ j.setAttribute("opacity", niveau>=3 ? ".8" : "0"); });
  /* une tâche de plus : le bonhomme sautille */
  if(JOURNEE_AVANT>=0 && faites>JOURNEE_AVANT){
    svg.classList.remove("saute"); void svg.getBoundingClientRect(); svg.classList.add("saute");
  }
  JOURNEE_AVANT=faites;
}
/* une liste vient d'être terminée : confettis et un mot */
function feter(l){
  var f=$("fete"); if(!f) return;
  f.textContent="";
  var reduit=false;
  try{ reduit=window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}
  var couleurs=["#F97316","#22C55E","#3B82F6","#EAB308","#EC4899","#8B5CF6"];
  if(!reduit){
    for(var i=0;i<42;i++){
      var c=document.createElement("span");
      c.style.left=(2+((i*37+i*i*11)%96))+"%";
      c.style.background=couleurs[i%6];
      c.style.setProperty("--dx", (((i*37)%140)-70)+"px");
      c.style.animationDelay=(((i*7)%11)*0.04)+"s";
      f.appendChild(c);
    }
  }
  var b=document.createElement("div"); b.className="bravo";
  b.textContent="Liste « "+(l.titre||"sans titre")+" » terminée !";
  f.appendChild(b);
  f.hidden=false;
  clearTimeout(feter.t);
  feter.t=setTimeout(function(){ f.hidden=true; f.textContent=""; }, 2400);
}
function cocherItem(l, it, fait){
  var avant=toutFait(l);
  it.fait=fait; it.faitLe = fait ? maintenant() : ""; it.maj=maintenant();
  touche(l); save(); render();
  if(fait && !avant && toutFait(l)) feter(l);
}

function restantes(l){ return (l.items||[]).filter(function(i){ return !i.fait; }).length; }
function toutFait(l){ return (l.items||[]).length>0 && restantes(l)===0; }

function visibles(){
  var q=($("q") && $("q").value || "").trim().toLowerCase();
  return N.listes.filter(function(l){
    if(FILTRE==="epinglees" && !l.epingle) return false;
    if(FILTRE==="partagees" && !partageDe(l).length && !dAutrui(l)) return false;
    if(FILTRE==="faites" && !toutFait(l)) return false;
    if(q){
      var foin=[l.titre, l.auteur].concat(partageDe(l))
                 .concat((l.items||[]).map(function(i){ return i.texte; }))
        .join(" ").toLowerCase();
      if(foin.indexOf(q)<0) return false;
    }
    return true;
  });
}

/* ---------- la grille, façon Keep ----------
   Les listes s'affichent en colonnes, chacune à sa hauteur : un aperçu
   (titre, cases à faire, cochées, photo) qu'on coche directement, et
   qu'on touche pour l'ouvrir en grand et la modifier. */
var OUVERTE=null, NB_COLONNES=0;
function render(){
  var host=$("listes"); host.textContent="";
  trier();
  var liste=visibles();
  $("vide").hidden = liste.length>0;
  $("champRecherche").hidden = N.listes.length<4;

  var epinglees=liste.filter(function(l){ return l.epingle; });
  var autres=liste.filter(function(l){ return !l.epingle; });
  NB_COLONNES=nbColonnes();
  if(epinglees.length){ titreSection(host, "Épinglées"); grille(host, epinglees); }
  if(autres.length){ if(epinglees.length) titreSection(host, "Autres"); grille(host, autres); }
  peindreEditeur();
  majJournee();
}
function nbColonnes(){
  var w=$("listes").clientWidth || (window.innerWidth-28);
  return Math.max(2, Math.min(6, Math.floor((w+10)/220)));
}
function grille(host, listes){
  var g=document.createElement("div"); g.className="keep";
  var cols=[], nb=[];
  for(var i=0;i<NB_COLONNES;i++){
    var c=document.createElement("div"); c.className="keep-col";
    g.appendChild(c); cols.push(c); nb.push(0);
  }
  host.appendChild(g);
  /* chaque aperçu va dans la colonne la moins haute */
  listes.forEach(function(l){
    var k=0;
    for(var i=1;i<cols.length;i++){
      var h=cols[i].offsetHeight, hk=cols[k].offsetHeight;
      if(h<hk || (h===hk && nb[i]<nb[k])) k=i;
    }
    cols[k].appendChild(apercu(l)); nb[k]++;
  });
}
function textePlein(i){ return !!String(i.texte||"").trim(); }
function apercu(l){
  var c=document.createElement("div");
  c.className="k-carte "+(l.couleur||"jaune")+(toutFait(l)?" finie":"");
  c.setAttribute("role","button"); c.tabIndex=0;
  c.setAttribute("data-apercu", l.id);
  c.setAttribute("aria-label","Ouvrir la liste "+(l.titre||"sans titre"));
  if((l.photos||[]).length){
    var im=document.createElement("img"); im.className="k-photo"; im.src=l.photos[0].data; im.alt="";
    c.appendChild(im);
  }
  var corps=document.createElement("div"); corps.className="k-corps";
  if(l.epingle){
    var pin=document.createElement("span"); pin.className="k-pin"; pin.setAttribute("aria-label","Épinglée");
    pin.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 3.5h5l-.8 5.2 3.3 3.1H6l3.3-3.1z"/><path d="M12 11.8V20"/></svg>';
    corps.appendChild(pin);
  }
  if((l.titre||"").trim()){
    var t=document.createElement("div"); t.className="k-titre"; t.textContent=l.titre;
    corps.appendChild(t);
  }
  var aFaire=(l.items||[]).filter(function(i){ return !i.fait && textePlein(i); });
  var faits=(l.items||[]).filter(function(i){ return i.fait && textePlein(i); });
  var MAX=8;
  if(aFaire.length){
    var box=document.createElement("div"); box.className="k-items";
    aFaire.slice(0, MAX).forEach(function(it){
      var row=document.createElement("div"); row.className="k-item";
      var cs=document.createElement("button"); cs.type="button"; cs.className="k-case";
      cs.setAttribute("role","checkbox"); cs.setAttribute("aria-checked","false");
      cs.setAttribute("aria-label","Cocher « "+it.texte+" »");
      cs.addEventListener("click", function(e){
        e.stopPropagation();
        cocherItem(l, it, true);
      });
      var tx=document.createElement("span"); tx.className="k-texte"; tx.textContent=it.texte;
      row.appendChild(cs); row.appendChild(tx);
      box.appendChild(row);
    });
    corps.appendChild(box);
    if(aFaire.length > MAX){
      var pl=document.createElement("p"); pl.className="k-plus";
      pl.textContent="+ "+(aFaire.length-MAX)+" autre"+(aFaire.length-MAX>1?"s":"");
      corps.appendChild(pl);
    }
  }
  if(faits.length){
    var f=document.createElement("p"); f.className="k-faits";
    f.textContent="✓ "+faits.length+" élément"+(faits.length>1?"s cochés":" coché");
    corps.appendChild(f);
  }
  if(!aFaire.length && !faits.length && !(l.titre||"").trim() && !(l.photos||[]).length){
    var v=document.createElement("p"); v.className="k-vide"; v.textContent="Liste vide";
    corps.appendChild(v);
  }
  var tags=document.createElement("div"); tags.className="k-tags";
  var partagee=partageDe(l);
  if(dAutrui(l)) tags.appendChild(tag("de "+l.auteur, "gris"));
  else if(partagee.length) tags.appendChild(tag(partagee.length>2 ? "partagée · "+partagee.length : "partagée · "+partagee.join(", "), "gris"));
  if(l.quand) tags.appendChild(tag(frJour(l.quand), l.quand < new Date().toISOString().slice(0,10) ? "rouge" : "ambre"));
  if(tags.children.length) corps.appendChild(tags);
  c.appendChild(corps);
  c.addEventListener("click", function(){ ouvrirListe(l.id); });
  c.addEventListener("keydown", function(e){
    if(e.target===c && (e.key==="Enter" || e.key===" ")){ e.preventDefault(); ouvrirListe(l.id); }
  });
  return c;
}

/* ---------- la liste ouverte en grand ---------- */
function listeDe(id){ return N.listes.filter(function(x){ return x.id===id; })[0] || null; }
function listeVide(l){
  return !(l.titre||"").trim() && !(l.items||[]).some(textePlein) && !(l.photos||[]).length;
}
function ouvrirListe(id){
  if(!listeDe(id)) return;
  OUVERTE=id;
  try{ if(!(history.state && history.state.liste)) history.pushState({liste:id}, ""); }catch(e){}
  render();
}
function fermerListe(){
  try{ if(history.state && history.state.liste){ history.back(); return; } }catch(e){}
  fermerVraiment();
}
function fermerVraiment(){
  var l=listeDe(OUVERTE);
  OUVERTE=null;
  /* comme sur Keep : une liste restée vide ne s'enregistre pas */
  if(l && listeVide(l)){
    if(l.local){ N.listes=N.listes.filter(function(x){ return x!==l; }); save(); }
    else { supprimer(l); return; }
  }
  render();
  if(l){
    var a=document.querySelector('[data-apercu="'+l.id+'"]');
    if(a && a.focus) try{ a.focus({preventScroll:true}); }catch(e){}
  }
}
function peindreEditeur(){
  var fond=$("editeur");
  var l=OUVERTE ? listeDe(OUVERTE) : null;
  if(!l){
    if(OUVERTE){ OUVERTE=null; try{ if(history.state && history.state.liste) history.back(); }catch(e){} }
    if(fond){ fond.hidden=true; fond.textContent=""; }
    document.body.classList.remove("ed-ouvert");
    return;
  }
  if(!fond){
    fond=document.createElement("div"); fond.id="editeur"; fond.className="ed-fond";
    fond.addEventListener("click", function(e){ if(e.target===fond) fermerListe(); });
    document.body.appendChild(fond);
  }
  var haut=fond.scrollTop;
  fond.textContent="";
  var p=document.createElement("div"); p.className="ed-panneau";
  p.setAttribute("role","dialog"); p.setAttribute("aria-label", l.titre || "Liste");
  p.appendChild(carte(l));
  var bas=document.createElement("div"); bas.className="ed-bas";
  var f=document.createElement("button"); f.type="button"; f.className="ed-fermer"; f.textContent="Fermer";
  f.addEventListener("click", fermerListe);
  bas.appendChild(f); p.appendChild(bas);
  fond.appendChild(p);
  fond.hidden=false; fond.scrollTop=haut;
  document.body.classList.add("ed-ouvert");
}

    +(it.fait ? "color:#8C8475;text-decoration:line-through;" : "color:#22201C;");
  txt.setAttribute("data-item", l.id);
  txt.addEventListener("input", function(){ it.texte=txt.value; toucheItem(l, it); save(false); });
  txt.addEventListener("blur", function(){ save(); });
  txt.addEventListener("keydown", function(e){
    if(e.key==="Enter"){
      e.preventDefault();
      l.items.splice(i+1, 0, {id:uid(), texte:"", fait:false, maj:maintenant()});
      touche(l); save(); render();
      var champs=document.querySelectorAll('[data-item="'+l.id+'"]');
      if(champs[i+1]) champs[i+1].focus();
    }
  });
  var del=document.createElement("button"); del.type="button"; del.className="n-del"; del.textContent="×";
  del.style.cssText="flex:0 0 auto;width:26px;height:26px;min-height:26px;padding:0;border:0;border-radius:50%;"
    +"background:none;color:#8C8475;font-size:18px;line-height:1;cursor:pointer";
  del.setAttribute("aria-label","Supprimer la tâche");
  del.addEventListener("click", function(){ l.items.splice(i,1); touche(l); save(); render(); });
  row.appendChild(case_); row.appendChild(txt); row.appendChild(del);
  return row;
}
function blocCouleurs(l){
  var d=document.createElement("div"); d.className="n-details";
  d.style.cssText="margin-top:10px;border-top:1px solid rgba(34,32,28,.08);padding-top:10px;width:100%";
  var box=document.createElement("div");
  box.style.cssText="display:flex;gap:9px;flex-wrap:wrap";
  COULEURS.forEach(function(c){
    var b=document.createElement("button"); b.type="button";
    b.setAttribute("aria-label", c[0]);
    b.style.cssText="width:34px;height:34px;min-height:34px;padding:0;border-radius:50%;cursor:pointer;"
      +"background:"+c[1]+";border:2px solid "+(l.couleur===c[0] ? "#22201C" : "rgba(34,32,28,.15)");
    b.addEventListener("click", function(){ l.couleur=c[0]; touche(l); save(); render(); });
    box.appendChild(b);
  });
  d.appendChild(box);
  return d;
}
function normaliser(t){
  return String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
}
function choix(titre, valeur, source, libelle, placeholder, poser){
  /* saisie assistée : on tape, la liste filtre, on choisit dans les résultats */
  var box=document.createElement("div");
  box.style.cssText="margin-bottom:12px;width:100%";
  var lab=document.createElement("p"); lab.className="legend"; lab.textContent=titre;
  box.appendChild(lab);

  if(valeur){
    var pil=document.createElement("span");
    pil.style.cssText="display:inline-flex;align-items:center;gap:8px;padding:8px 10px 8px 13px;border-radius:var(--r-field);"
      +"background:rgba(255,255,255,.85);color:var(--ink);font-size:14.5px;font-weight:600";
    pil.appendChild(document.createTextNode(libelle(valeur)));
    var x=document.createElement("button"); x.type="button"; x.textContent="×";
    x.setAttribute("aria-label","Retirer");
    x.style.cssText="width:22px;height:22px;min-height:22px;padding:0;border:0;border-radius:50%;"
      +"background:rgba(34,32,28,.10);color:var(--ink-2);font-size:15px;line-height:1;cursor:pointer";
    x.addEventListener("click", function(){ poser(""); });
    pil.appendChild(x);
    box.appendChild(pil);
    return box;
  }

  var saisie=document.createElement("input"); saisie.type="text";
  saisie.placeholder=placeholder; saisie.autocapitalize="off"; saisie.spellcheck=false;
  saisie.style.cssText="width:100%;min-height:44px;padding:11px 14px;border:0;border-radius:var(--r-field);"
    +"background:rgba(255,255,255,.85);font-size:16px;font-family:inherit";
  box.appendChild(saisie);

  var res=document.createElement("div");
  res.style.cssText="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px";
  box.appendChild(res);

  function peindre(){
    res.textContent="";
    var q=normaliser(saisie.value);
    var liste=source();
    var vus=liste.filter(function(o){
      if(!q) return true;
      return normaliser(libelle(o.valeur)+" "+o.valeur).indexOf(q)>=0;
    }).slice(0, 8);
    if(!liste.length){
      var v=document.createElement("span"); v.className="hint"; v.style.margin="0";
      v.textContent="Liste indisponible hors connexion.";
      res.appendChild(v); return;
    }
    if(!vus.length){
      var w=document.createElement("span"); w.className="hint"; w.style.margin="0";
      w.textContent="Aucune correspondance.";
      res.appendChild(w); return;
    }
    vus.forEach(function(o){
      var b=document.createElement("button"); b.type="button";
      b.style.cssText="border:0;border-radius:var(--r-field);background:rgba(255,255,255,.85);color:var(--ink-2);"
        +"font-family:inherit;font-size:13.5px;font-weight:600;padding:8px 12px;min-height:36px;cursor:pointer";
      b.textContent=libelle(o.valeur);
      b.addEventListener("click", function(){ poser(o.valeur); });
      res.appendChild(b);
    });
  }
  saisie.addEventListener("input", peindre);
  peindre();
  return box;
}
function nomEquipe(saisie){
  /* même contrôle qu'à la publication : on valide le nom sur l'équipe */
  var t=normaliser(saisie);
  if(!t) return null;
  var exact=null, debut=[];
  EQUIPE.forEach(function(p){
    var n=normaliser(p.nom);
    if(n===t) exact=p.nom;
    else if(n.indexOf(t)===0) debut.push(p.nom);
  });
  if(exact) return exact;
  if(debut.length===1) return debut[0];
  return null;
}
/* ---------- partage d'une liste ----------
   Une to-do list n'est pas toujours un chantier : un achat à faire, un
   rendez-vous, une info d'agence. Le partage sert à ça — plusieurs
   personnes sur la même liste, chacune coche de son côté. */
function partageDe(l){
  var noms=Array.isArray(l.partage) ? l.partage.slice() : [];
  if(l.pour && noms.indexOf(l.pour)<0) noms.push(l.pour);
  return noms;
}
function poserPartage(l, noms){
  l.partage=noms.slice();
  l.pour="";                       /* l'ancien champ unique est absorbé */
  touche(l); save(); render();
}
function saisiePartage(l){
  var box=document.createElement("div");
  box.style.cssText="margin-bottom:12px;width:100%";
  var lab=document.createElement("p"); lab.className="legend";
  lab.textContent="Partagée avec";
  box.appendChild(lab);
  var noms=partageDe(l);
  var mien = !dAutrui(l);

  if(noms.length){
    var pils=document.createElement("div");
    pils.style.cssText="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px";
    noms.forEach(function(nom){
      var pil=document.createElement("span");
      pil.style.cssText="display:inline-flex;align-items:center;gap:7px;padding:7px 9px 7px 12px;"
        +"border-radius:var(--r-field);background:rgba(255,255,255,.85);color:var(--ink);"
        +"font-size:14px;font-weight:600";
      pil.appendChild(document.createTextNode(nom));
      if(mien){
        var x=document.createElement("button"); x.type="button"; x.textContent="×";
        x.setAttribute("aria-label","Retirer "+nom);
        x.style.cssText="width:21px;height:21px;min-height:21px;padding:0;border:0;border-radius:50%;"
          +"background:rgba(34,32,28,.10);color:var(--ink-2);font-size:14px;line-height:1;cursor:pointer";
        x.addEventListener("click", function(){
          poserPartage(l, noms.filter(function(n){ return n!==nom; }));
        });
        pil.appendChild(x);
      }
      pils.appendChild(pil);
    });
    box.appendChild(pils);
  }

  if(!mien){
    var note=document.createElement("p"); note.className="hint"; note.style.margin="0";
    note.textContent="Liste de "+l.auteur+". Vous pouvez la remplir et la cocher ; "
      +"le partage se règle chez son auteur.";
    box.appendChild(note);
    return box;
  }

  var ligne=document.createElement("div");
  ligne.style.cssText="display:flex;gap:8px;width:100%";
  var saisie=document.createElement("input"); saisie.type="text";
  saisie.placeholder="Nom d'un collègue"; saisie.autocapitalize="words";
  saisie.setAttribute("list","dl_equipe");
  saisie.autocomplete="off"; saisie.spellcheck=false;
  saisie.style.cssText="flex:1;min-height:44px;padding:11px 14px;border:0;border-radius:var(--r-field);"
    +"background:rgba(255,255,255,.85);font-size:16px;font-family:inherit";
  var btn=document.createElement("button"); btn.type="button";
  btn.textContent="Partager";
  btn.style.cssText="flex:0 0 auto;min-height:44px;padding:0 16px;border:0;border-radius:var(--r-field);"
    +"background:var(--accent);color:#fff;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer";
  function valider(){
    var nom=nomEquipe(saisie.value);
    if(!nom){
      var t=normaliser(saisie.value);
      var proches=EQUIPE.filter(function(p){ return normaliser(p.nom).indexOf(t)>=0; }).map(function(p){ return p.nom; });
      toast(!t ? "Saisissez un nom."
        : (proches.length ? "Plusieurs correspondances : "+proches.slice(0,4).join(", ")
                          : "Aucun utilisateur ne porte ce nom."));
      return;
    }
    if(estMoi(nom)){ toast("La liste est déjà la vôtre."); return; }
    if(noms.indexOf(nom)>=0){ toast(nom+" y a déjà accès."); return; }
    poserPartage(l, noms.concat([nom]));
    toast("Partagée avec "+nom+".");
  }
  btn.addEventListener("click", valider);
  saisie.addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); valider(); } });
  ligne.appendChild(saisie); ligne.appendChild(btn);
  box.appendChild(ligne);
  var aide=document.createElement("p"); aide.className="hint"; aide.style.margin="8px 0 0";
  aide.textContent="Chacun la voit dans sa To-do list et peut cocher. "
    +"Deux personnes qui cochent en même temps ne s'effacent pas : chaque ligne garde sa dernière modification.";
  box.appendChild(aide);
  return box;
}

function blocDetails(l){
  var d=document.createElement("div"); d.className="n-details";
  d.style.cssText="margin-top:10px;border-top:1px solid rgba(34,32,28,.08);padding-top:10px;width:100%";

  d.appendChild(saisiePartage(l));
  d.appendChild(champDate("À faire le", l.quand, function(v){ l.quand=v; touche(l); save(); render(); }));
  var p=document.createElement("p"); p.className="legend"; p.textContent="Couleur";
  d.appendChild(p);
  var box=document.createElement("div"); box.className="n-couleurs";
  COULEURS.forEach(function(c){
    var b=document.createElement("button"); b.type="button";
    b.className="n-couleur"+(l.couleur===c[0]?" on":"");
    b.style.cssText="width:32px;height:32px;min-height:32px;padding:0;border-radius:50%;cursor:pointer;"
      +"background:"+c[1]+";border:2px solid "+(l.couleur===c[0] ? "#22201C" : "rgba(34,32,28,.15)");
    b.setAttribute("aria-label", c[0]);
    b.addEventListener("click", function(){ l.couleur=c[0]; touche(l); save(); render(); });
    box.appendChild(b);
  });
  d.appendChild(box);
  return d;
}
function champ(libelle, valeur, liste, fn){
  var lab=document.createElement("label"); lab.className="f";
  var s=document.createElement("span"); s.textContent=libelle;
  var i=document.createElement("input"); i.type="text"; i.value=valeur||"";
  if(liste) i.setAttribute("list", liste);
  i.addEventListener("input", function(){ fn(i.value); });
  lab.appendChild(s); lab.appendChild(i);
  return lab;
}
function champDate(libelle, valeur, fn){
  var lab=document.createElement("label"); lab.className="f";
  var s=document.createElement("span"); s.textContent=libelle;
  var i=document.createElement("input"); i.type="date"; i.value=valeur||"";
  i.addEventListener("change", function(){ fn(i.value); });
  lab.appendChild(s); lab.appendChild(i);
  return lab;
}
function frDateHeure(iso){
  if(!iso) return "";
  var a=String(iso).slice(0,10).split("-");
  return a[2]+"/"+a[1]+"/"+a[0]+" à "+String(iso).slice(11,16);
}
function ouvrirCorbeille(){
  var v=$("corbeille"), corps=$("corbCorps");
  v.hidden=false;
  corps.innerHTML='<p class="hint">Chargement…</p>';
  if(!apiPret()){ corps.innerHTML='<p class="hint">La corbeille est sur le site : connectez-vous pour la voir.</p>'; return; }
  fetch(apiUrl("notes-corbeille"), {headers:apiEnTetes()})
    .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
    .then(function(d){ peindreCorbeille(d); })
    .catch(function(){ corps.innerHTML='<p class="hint">Pas de réseau. Réessayez dans un instant.</p>'; });
}
function peindreCorbeille(d){
  var corps=$("corbCorps"); corps.textContent="";
  function titre(t){ var h=document.createElement("h3"); h.textContent=t; corps.appendChild(h); }
  function ligne(tb, ts, libelle, action){
    var r=document.createElement("div"); r.className="cb-l";
    var t=document.createElement("div"); t.className="t";
    var b=document.createElement("b"); b.textContent=tb;
    var sp=document.createElement("span"); sp.textContent=ts;
    t.appendChild(b); t.appendChild(sp);
    var bt=document.createElement("button"); bt.type="button"; bt.className="act ghost"; bt.textContent=libelle;
    bt.addEventListener("click", function(){ action(bt); });
    r.appendChild(t); r.appendChild(bt); corps.appendChild(r);
  }
  titre("Listes supprimées");
  if(!(d.corbeille||[]).length){
    var p=document.createElement("p"); p.className="hint";
    p.textContent="Aucune. Une liste supprimée reste ici 60 jours.";
    corps.appendChild(p);
  }
  (d.corbeille||[]).forEach(function(n){
    ligne(n.titre || "Liste sans titre",
      n.taches+" tâche"+(n.taches>1?"s":"")+" · supprimée le "+frDateHeure(n.supprimeeLe),
      "Restaurer", function(bt){ restaurer("note-restaurer", "&id="+encodeURIComponent(n.id), bt); });
  });
  titre("Copies automatiques");
  var ex=document.createElement("p"); ex.className="hint";
  ex.textContent="Chaque jour, le site garde une copie de toutes vos listes (14 jours). « Récupérer » rapporte les listes de ce jour-là qui manquent aujourd'hui, sans toucher aux autres.";
  corps.appendChild(ex);
  if(!(d.sauvegardes||[]).length){
    var q=document.createElement("p"); q.className="hint"; q.textContent="Pas encore de copie : la première se fait à la prochaine modification.";
    corps.appendChild(q);
  }
  (d.sauvegardes||[]).forEach(function(c){
    var j=c.jour.split("-");
    ligne(j[2]+"/"+j[1]+"/"+j[0]+" — "+c.listes+" liste"+(c.listes>1?"s":"")+", "+c.taches+" tâche"+(c.taches>1?"s":""),
      (c.titres||[]).join(" · "),
      "Récupérer", function(bt){ restaurer("notes-restaurer-jour", "&jour="+encodeURIComponent(c.jour), bt); });
  });
}
function restaurer(action, params, bt){
  bt.disabled=true; bt.textContent="…";
  fetch(apiUrl(action)+params, {method:"POST", headers:apiEnTetes(), body:"{}"})
    .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d}; }); })
    .then(function(res){
      if(!res.ok){ bt.disabled=false; bt.textContent="Réessayer"; toast(res.d.erreur || "Impossible pour le moment."); return; }
      var n=res.d.restaurees||0;
      (res.d.ids||[]).forEach(oublierSuppression);
      /* ce qui revient n'est plus « supprimé » sur ce téléphone */
      tirer_serveur(function(){
        toast(n ? n+" liste"+(n>1?"s":"")+" de retour." : "Rien ne manquait : toutes ces listes sont déjà là.");
        ouvrirCorbeille();
      });
    })
    .catch(function(){ bt.disabled=false; bt.textContent="Réessayer"; toast("Pas de réseau."); });
}

function supprimer(l){
  /* La suppression reste « à dire au serveur » tant qu'il ne l'a pas
     prise : hors connexion, elle part à la prochaine synchronisation.
     Le serveur met la liste à la corbeille (60 jours). */
  N.aSupprimer = N.aSupprimer || [];
  if(N.aSupprimer.indexOf(l.id)<0) N.aSupprimer.push(l.id);
  N.listes = N.listes.filter(function(x){ return x.id!==l.id; });
  try{ window.storage.set("notes:local", JSON.stringify(N)); }catch(e){}
  render();
  toast("Liste supprimée — elle reste 60 jours dans la corbeille.");
  if(apiPret(true)) envoyerSuppression(l.id);
}

/* ---------- annotation : l'outil commun (annotation.js) ----------
   Photos et croquis gardent leurs annotations comme des objets : on les
   retouche plus tard, la photo d'origine restant intacte à côté. */
function openSketch(p, index, after){
  if(!p) return;
  if(!p.photos) p.photos=[];
  var suite = after || function(){};
  var nom = (p.nom||"").trim();
  if(index===undefined || index===null){
    Annotation.croquis({titre:"Croquis" + (nom ? " - "+nom : "")}).then(function(ph){
      if(!ph) return;
      p.photos.push(ph);
      toast("Croquis ajouté.");
      save(); suite(); refreshHeader();
    });
    return;
  }
  var ph=p.photos[index];
  if(!ph) return;
  Annotation.photo(ph, {titre:"Annoter" + (nom ? " - "+nom : "")}).then(function(r){
    if(!r) return;
    toast("Photo annotée.");
    save(); suite(); refreshHeader();
  }).catch(function(){ toast("Image illisible."); });
}

/* ---------- photos et croquis ---------- */
var LISTE_PHOTO=null;
function photoPour(l){
  LISTE_PHOTO=l;
  $("filePhoto").click();
}
function cible(l){
  l.photos = l.photos || [];
  return {nom: l.titre || "liste", photos: l.photos};
}
function croquisVierge(l){
  LISTE_PHOTO=l;
  openSketch(cible(l), null, function(){ touche(l); save(); render(); });
}
function ouvrirCroquis(l, index){
  LISTE_PHOTO=l;
  openSketch(cible(l), index, function(){ touche(l); save(); render(); });
}
function refreshHeader(){ /* l'en-tête affiche l'état de synchronisation, rien à recalculer */ }

/* ---------- l'équipe, pour le partage ---------- */
function chargerListesDeroulantes(){
  if(!apiPret(true)) return;
  fetch(apiUrl("equipe"), {headers:apiEnTetes()})
    .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
    .then(function(d){
      EQUIPE=d.personnes||d.equipe||[];
      var dl=$("dl_equipe"); dl.textContent="";
      EQUIPE.forEach(function(p){ var o=document.createElement("option"); o.value=p.nom; dl.appendChild(o); });
      render();
    }).catch(function(){});
}

/* ---------- filtres ---------- */
var FILTRES=[["toutes","Toutes"],["epinglees","Épinglées"],["partagees","Partagées"],
             ["faites","Faites"]];
function renderFiltres(){
  var box=$("filtres"); box.textContent="";
  FILTRES.forEach(function(f){
    var lab=document.createElement("label");
    lab.className="chip"+(FILTRE===f[0]?" on":"");
    lab.textContent=f[1];
    lab.addEventListener("click", function(e){ e.preventDefault(); FILTRE=f[0]; renderFiltres(); render(); });
    box.appendChild(lab);
  });
}

/* ---------- liaisons ---------- */
function bindAll(){
  $("btnNouvelle").addEventListener("click", nouvelleListe);
  $("btnSync").addEventListener("click", function(){ tirer_serveur(function(){ pousser_serveur(); }); });
  $("btnCorbeille").addEventListener("click", ouvrirCorbeille);
  $("corbFermer").addEventListener("click", function(){ $("corbeille").hidden=true; });
  $("corbeille").addEventListener("click", function(e){ if(e.target===this) this.hidden=true; });
  document.addEventListener("keydown", function(e){ if(e.key==="Escape" && !$("corbeille").hidden) $("corbeille").hidden=true; });
  $("btnHaut").addEventListener("click", function(){ window.scrollTo({top:0, behavior:"smooth"}); });
  $("q").addEventListener("input", render);
  var attente=null;
  window.addEventListener("resize", function(){
    clearTimeout(attente);
    attente=setTimeout(function(){ if(nbColonnes()!==NB_COLONNES) render(); }, 120);
  });
  window.addEventListener("popstate", function(){ if(OUVERTE) fermerVraiment(); });
  document.addEventListener("keydown", function(e){
    if(e.key==="Escape" && OUVERTE && !Annotation.ouvert()) fermerListe();
  });
  $("filePhoto").addEventListener("change", function(){
    var files=this.files, n=files.length, done=0, l=LISTE_PHOTO;
    if(!l){ this.value=""; return; }
    l.photos = l.photos || [];
    Array.prototype.forEach.call(files, function(f){
      compress(f, function(ph){
        if(ph) l.photos.push(ph);
        if(++done===n){ touche(l); save(); render(); }
      });
    });
    this.value="";
  });
  /* au retour sur la page, on récupère ce qui a changé ailleurs */
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden) tirer_serveur();
  });
  window.addEventListener("focus", function(){ tirer_serveur(); });
  window.addEventListener("online", function(){ tirer_serveur(function(){ pousser_serveur(); }); });
}
/* ---------- retour aux rapports quand on vient de la liste ---------- */
(function retourRapports(){
  try{
    var vient = document.referrer && document.referrer.indexOf("rapports.html")>=0;
    if(!vient){
      try{ vient = sessionStorage.getItem("retour:rapports")==="1"; }catch(e){}
    }
    if(!vient) return;
    try{ sessionStorage.setItem("retour:rapports","1"); }catch(e){}
    var barre=document.querySelector("header .h-row");
    if(!barre || document.getElementById("lienRapports")) return;
    var a=document.createElement("a");
    a.id="lienRapports"; a.className="menu-link"; a.href="./rapports.html";
    a.textContent="Chantiers";
    barre.insertBefore(a, barre.children[1] || null);
  }catch(e){}
})();

function start(){
  bindAll(); renderFiltres();
  charger_local(function(){
    render();
    /* ?liste=… : l'accueil ouvre directement la liste concernée */
    try{
      var id=new URLSearchParams(location.search).get("liste");
      if(id && listeDe(id)){
        history.replaceState(null, "", location.pathname);
        ouvrirListe(id);
      }
    }catch(e){}
    majSync(apiPret(true) ? "cours" : "hors");
    chargerListesDeroulantes();
    tirer_serveur(function(){ pousser_serveur(); });
  });
}
start();

})();
