function suivre(){
  var g=GL; if(!g) return;
  g.fantome.style.transform="translate3d("+(g.x-g.dx)+"px,"+(g.y-g.dy)+"px,0)";
}
/* la place la plus proche de la liste en main, dans la partie où elle est */
function cibler(){
  var g=GL; if(!g || g.pose) return;
  var cx=g.x-g.dx+g.w/2, cy=g.y-g.dy+g.h/2, s=0;
  if(g.seule!=null) s=g.seule;
  else if(g.sections.length>1){
    var t=g.sections[1].keep.previousElementSibling;
    var b=(t && t.classList.contains("k-section") ? t : g.sections[1].keep).getBoundingClientRect();
    s = cy > b.top+b.height/2 ? 1 : 0;
  }
  var S=g.sections[s], kr=S.keep.getBoundingClientRect();
  var cr=S.cols.map(function(c){ return c.getBoundingClientRect(); });
  var meilleur=0, dmin=Infinity;
  for(var i=0;i<=S.seq.length;i++){
    var p=positionDe(S.seq, i, S.cols.length);
    var px=cr[p.col].left+cr[p.col].width/2, py=kr.top+p.top+g.h/2;
    var d=(px-cx)*(px-cx)+(py-cy)*(py-cy);
    if(d<dmin){ dmin=d; meilleur=i; }
  }
  if(s!==g.cible.s || meilleur!==g.cible.i){ g.cible={s:s, i:meilleur}; disposer(); }
}
/* les listes s'écartent : on les replace, puis elles glissent de leur
   ancienne place à la nouvelle */
function disposer(){
  var g=GL; if(!g) return;
  var anime=!reduitMouvement(), tous=[], avant=[];
  g.sections.forEach(function(S){ S.seq.forEach(function(c){ tous.push(c); }); });
  if(anime){
    tous.forEach(function(c){ avant.push(c.getBoundingClientRect()); });
    tous.forEach(function(c){ c.style.transition="none"; c.style.transform=""; });
  }
  if(g.place.parentNode) g.place.parentNode.removeChild(g.place);
  g.sections.forEach(function(S, s){
    var seq=S.seq.slice();
    if(s===g.cible.s) seq.splice(g.cible.i, 0, g.place);
    empiler(S.cols, seq);
  });
  if(!anime) return;
  var bouges=[];
  tous.forEach(function(c, j){
    var b=c.getBoundingClientRect(), dx=avant[j].left-b.left, dy=avant[j].top-b.top;
    if(Math.abs(dx)<0.5 && Math.abs(dy)<0.5) return;
    c.style.transform="translate("+dx+"px,"+dy+"px)"; bouges.push(c);
  });
  if(!bouges.length) return;
  void document.body.offsetWidth;
  bouges.forEach(function(c){ c.style.transition="transform .2s cubic-bezier(.2,.8,.2,1)"; c.style.transform=""; });
}
/* à chaque image : près du haut ou du bas de l'écran, la page défile
   toute seule ; et si le doigt a bougé, on revoit la place visée */
function defiler(){
  var g=GL; if(!g || g.pose) return;
  var hd=document.querySelector("header");
  var haut=(hd ? hd.getBoundingClientRect().bottom : 0)+48, bas=window.innerHeight-56, v=0;
  if(g.y<haut) v=-Math.min(20, 2+(haut-g.y)/4);
  else if(g.y>bas) v=Math.min(20, 2+(g.y-bas)/4);
  if(v){
    var y0=window.scrollY;
    window.scrollBy(0, v);
    if(window.scrollY!==y0) g.bouge=true;
  }
  if(g.bouge){ g.bouge=false; cibler(); }
  g.raf=requestAnimationFrame(defiler);
}
function poser(annule){
  var g=GL; if(!g || g.pose) return;
  g.pose=true; FIN_GLISSE=Date.now();
  cancelAnimationFrame(g.raf);
  var fini=false;
  function fin(){
    if(fini) return; fini=true;
    GL=null;
    document.body.classList.remove("k-glisse");
    if(g.fantome.parentNode) g.fantome.parentNode.removeChild(g.fantome);
    if(annule){ render(); return; }
    var S=g.sections[g.cible.s], seq=S.seq, i=g.cible.i;
    ranger(g.id, seq[i] ? seq[i].getAttribute("data-apercu") : null,
                 i>0 ? seq[i-1].getAttribute("data-apercu") : null, S.epingle);
  }
  if(annule || reduitMouvement() || !g.place.isConnected){ fin(); return; }
  /* elle se pose à sa place */
  var r=g.place.getBoundingClientRect();
  g.fantome.style.transition="transform .16s ease, scale .16s ease, box-shadow .16s ease";
  g.fantome.style.transform="translate3d("+r.left+"px,"+r.top+"px,0)";
  g.fantome.style.scale="1";
  g.fantome.addEventListener("transitionend", fin);
  setTimeout(fin, 230);
}
function brancherRangement(){
  var host=$("listes");
  host.addEventListener("pointerdown", function(e){
    if(GL || OUVERTE) return;
    /* un second doigt : ce n'est pas un rangement */
    if(APPUI){ clearTimeout(APPUI.t); APPUI=null; return; }
    if(e.pointerType==="mouse" && e.button!==0) return;
    var c=e.target.closest ? e.target.closest(".keep .k-carte") : null;
    if(!c) return;
    var a={carte:c, x0:e.clientX, y0:e.clientY, x:e.clientX, y:e.clientY, id:e.pointerId,
           souris:e.pointerType==="mouse", t:0};
    APPUI=a;
    /* au doigt et au crayon : un appui long, pour ne pas gêner le défilement */
    if(!a.souris) a.t=setTimeout(function(){ if(APPUI===a) lever(a.carte, a.x, a.y, a.id); }, 400);
  });
  window.addEventListener("pointermove", function(e){
    if(GL){
      if(e.pointerId!==GL.pointeur || GL.pose) return;
      GL.x=e.clientX; GL.y=e.clientY; GL.bouge=true; suivre();
      return;
    }
    var a=APPUI; if(!a || e.pointerId!==a.id) return;
    a.x=e.clientX; a.y=e.clientY;
    var d=Math.hypot(a.x-a.x0, a.y-a.y0);
    if(a.souris){
      if(d>6){ lever(a.carte, a.x0, a.y0, a.id); if(GL){ GL.x=a.x; GL.y=a.y; GL.bouge=true; suivre(); } }
    } else if(d>9){ clearTimeout(a.t); APPUI=null; }     /* le doigt fait défiler la page */
  });
  window.addEventListener("pointerup", function(e){
    if(GL && e.pointerId===GL.pointeur){ poser(false); return; }
    if(APPUI && e.pointerId===APPUI.id){ clearTimeout(APPUI.t); APPUI=null; }
  });
  window.addEventListener("pointercancel", function(e){
    if(GL && e.pointerId===GL.pointeur){ poser(true); return; }
    if(APPUI && e.pointerId===APPUI.id){ clearTimeout(APPUI.t); APPUI=null; }
  });
  /* liste en main : la page ne défile pas sous le doigt, et le lâcher n'ouvre rien
     (l'aperçu touché reste dans la grille : ses événements y remontent) */
  host.addEventListener("touchmove", function(e){ if(GL) e.preventDefault(); }, {passive:false});
  host.addEventListener("touchend", function(e){ if(GL) e.preventDefault(); }, {passive:false});
  window.addEventListener("click", function(e){
    if(GL || Date.now()-FIN_GLISSE < 450){ e.stopPropagation(); e.preventDefault(); }
  }, true);
  host.addEventListener("contextmenu", function(e){
    if(GL || (APPUI && !APPUI.souris)) e.preventDefault();
  });
  /* on quitte la fenêtre en tenant une liste : elle revient à sa place */
  window.addEventListener("blur", function(){ if(GL) poser(true); });
  document.addEventListener("keydown", function(e){
    if(GL && e.key==="Escape"){ e.preventDefault(); poser(true); return; }
    if(!e.altKey || e.ctrlKey || e.metaKey) return;
    var c=e.target;
    if(!c || !c.classList || !c.classList.contains("k-carte") || !host.contains(c)) return;
    var sens = e.key==="ArrowLeft" || e.key==="ArrowUp" ? -1 : e.key==="ArrowRight" || e.key==="ArrowDown" ? 1 : 0;
    if(!sens) return;
    e.preventDefault();
    deplacerAuClavier(c, sens);
  });
}

/* ---------- la liste ouverte en grand ---------- */
function listeDe(id){ return N.listes.filter(function(x){ return x.id===id; })[0] || null; }
/* ---------- les listes masquées ----------
   Masquer une liste la retire de ma page (et du compteur de l'accueil)

function ouvrirListe(id){
  if(!listeDe(id)) return;
  OUVERTE=id;
  try{ if(!(history.state && history.state.liste)) history.pushState({liste:id}, ""); }catch(e){}
  render();
}
function fermerListe(){
  try{ if(history.state && history.state.liste){ history.back(); return; } }catch(e){}
  fermerVraiment();
}
function fermerVraiment(){
  var l=listeDe(OUVERTE);
  OUVERTE=null;
  /* comme sur Keep : une liste restée vide ne s'enregistre pas */
  if(l && listeVide(l)){
    if(l.local){ N.listes=N.listes.filter(function(x){ return x!==l; }); save(); }
    else { supprimer(l); return; }
  }
  render();
  if(l){
    var a=document.querySelector('[data-apercu="'+l.id+'"]');
    if(a && a.focus) try{ a.focus({preventScroll:true}); }catch(e){}
  }
}
function peindreEditeur(){
  var fond=$("editeur");
  var l=OUVERTE ? listeDe(OUVERTE) : null;
  if(!l){
    if(OUVERTE){ OUVERTE=null; try{ if(history.state && history.state.liste) history.back(); }catch(e){} }
    if(fond){ fond.hidden=true; fond.textContent=""; }
    document.body.classList.remove("ed-ouvert");
    return;
  }
  if(!fond){
    fond=document.createElement("div"); fond.id="editeur"; fond.className="ed-fond";
    fond.addEventListener("click", function(e){ if(e.target===fond) fermerListe(); });
    document.body.appendChild(fond);
  }
  var haut=fond.scrollTop;
  fond.textContent="";
  var p=document.createElement("div"); p.className="ed-panneau";
  p.setAttribute("role","dialog"); p.setAttribute("aria-label", l.titre || "Liste");
  p.appendChild(carte(l));
  var bas=document.createElement("div"); bas.className="ed-bas";
  var f=document.createElement("button"); f.type="button"; f.className="ed-fermer"; f.textContent="Fermer";
  f.addEventListener("click", fermerListe);
  bas.appendChild(f); p.appendChild(bas);
  fond.appendChild(p);
  fond.hidden=false; fond.scrollTop=haut;
  document.body.classList.add("ed-ouvert");
}

    tags.appendChild(tag(partagee.length>2
      ? ("partagée · "+partagee.length+" personnes")

  pied.appendChild(etat);

  var outils=document.createElement("div"); outils.className="n-outils";

  }));
  outils.appendChild(petit("etiquette","Partage et date", function(){
    l.details = !l.details; l.palette=false; render();

    if(cachee){ masquer(l, false); render(); toast(nomListe(l)+" est de nouveau affichée."); return; }
    masquer(l, true);
    fermerListe();
    toast(nomListe(l)+" est masquée : « Listes masquées », en bas de la page, pour la revoir.", "Annuler", function(){ masquer(l, false); render(); });
  }));
  outils.appendChild(petit("corbeille","Supprimer la liste", function(){
    if(!window.confirm("Supprimer cette liste ?")) return;
    supprimer(l);
  }, true));
  pied.appendChild(outils);

function tag(texte, genre){
  var s=document.createElement("span"); s.className="n-tag "+genre;

    +"background:rgba(255,255,255,.75);color:"+couleur;
  s.textContent=texte; return s;
}

function ligneItem(l, it, i){
  var row=document.createElement("div"); row.className="n-item"+(it.fait?" fait":"");

    +"display:flex;align-items:center;justify-content:center;border-radius:var(--r-field);"
    +(it.fait ? "background:#1C1E22;border:2px solid #1C1E22;" : "background:transparent;border:2px solid rgba(28,30,34,.45);");

      +'stroke-width:3;stroke-linecap:round;stroke-linejoin:round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
    : '';
  case_.addEventListener("click", function(){

  var txt=document.createElement("textarea"); txt.rows=1; txt.value=it.texte;
  txt.placeholder="Tâche"; txt.className="n-texte";

    +"font-family:inherit;font-size:15px;padding:4px 0;min-height:0;border-radius:0;line-height:1.3;display:block;white-space:pre-wrap;"
    +(it.fait ? "color:#767D8B;text-decoration:line-through;" : "color:#1C1E22;");
  txt.setAttribute("data-item", l.id);
  ajusterHauteur(txt);
  txt.addEventListener("input", function(){ it.texte=txt.value.replace(/\n/g, " "); toucheItem(l, it); save(false); ajusterHauteur(txt); });
  txt.addEventListener("blur", function(){ save(); });
  txt.addEventListener("keydown", function(e){
    if(e.key==="Enter"){
      e.preventDefault();
      l.items.splice(i+1, 0, {id:uid(), texte:"", fait:false, maj:maintenant()});

    row.appendChild(chip);

var JOURS_COURTS=["dim.","lun.","mar.","mer.","jeu.","ven.","sam."];
function texteRappel(r){
  if(!r || !r.quand) return "";
  var d=new Date(r.quand+"T12:00:00"), a=r.quand.split("-");
  var auj=new Date(); auj.setHours(12,0,0,0);
  var ecart=Math.round((d-auj)/864e5);
  var jour = ecart===0 ? "aujourd'hui" : ecart===1 ? "demain" : (JOURS_COURTS[d.getDay()]+" "+a[2]+"/"+a[1]+(a[0]!==String(auj.getFullYear()) ? "/"+a[0] : ""));
  return jour+" à "+(r.heure||"08:00").replace(":", "h");
}
function deux(n){ return (n<10?"0":"")+n; }
/* le petit panneau sous la ligne : le jour, l'heure, Enregistrer ou Retirer */
function ouvrirRappel(l, it, row){
  var vieux=document.getElementById("panneauRappel"); if(vieux){ var meme=vieux.dataset.item===it.id; vieux.remove(); if(meme) return; }
  var p=document.createElement("div"); p.id="panneauRappel"; p.dataset.item=it.id;
  p.style.cssText="flex:0 0 100%;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 8px 32px;padding:10px;"
    +"border-radius:var(--r-field);background:rgba(255,255,255,.8);box-shadow:0 1px 4px rgba(0,0,0,.08)";
  var h=new Date(Date.now()+3600e3); h.setMinutes(h.getMinutes()<30 ? 30 : 60, 0, 0);
  var r=it.rappel || {quand:h.getFullYear()+"-"+deux(h.getMonth()+1)+"-"+deux(h.getDate()), heure:deux(h.getHours())+":"+deux(h.getMinutes())};
  var jour=document.createElement("input"); jour.type="date"; jour.value=r.quand; jour.setAttribute("aria-label","Jour du rappel");
  var heure=document.createElement("input"); heure.type="time"; heure.value=r.heure||"08:00"; heure.setAttribute("aria-label","Heure du rappel");
  [jour, heure].forEach(function(x){ x.style.cssText="min-height:38px;padding:6px 10px;border:1px solid rgba(28,30,34,.18);border-radius:var(--r-field);"
    +"background:#fff;font-family:inherit;font-size:15px;color:#1C1E22;width:auto;flex:0 0 auto"; });
  function bouton(t, plein, fn){
    var b=document.createElement("button"); b.type="button"; b.textContent=t;
    b.style.cssText="min-height:38px;padding:0 14px;border:0;border-radius:var(--r-field);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;"
      +(plein ? "background:#1C1E22;color:#fff" : "background:rgba(28,30,34,.08);color:#1C1E22");
    b.addEventListener("click", fn); return b;
  }
  var ok=bouton("Enregistrer", true, function(){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(jour.value)){ toast("Choisissez le jour du rappel."); return; }
    it.rappel={quand:jour.value, heure:/^\d{2}:\d{2}/.test(heure.value) ? heure.value.slice(0,5) : "08:00", qui:AUTEUR_MOI || MOI};
    toucheItem(l, it); save(); render();
    toast("Rappel "+texteRappel(it.rappel)+" : une notification arrivera à l'heure dite.");
  });
  p.appendChild(jour); p.appendChild(heure); p.appendChild(ok);
  if(it.rappel) p.appendChild(bouton("Retirer", false, function(){ delete it.rappel; toucheItem(l, it); save(); render(); toast("Rappel retiré."); }));
  row.appendChild(p);
  try{ jour.focus({preventScroll:true}); }catch(e){}
}

function normaliser(t){
  return String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
}
function choix(titre, valeur, source, libelle, placeholder, poser){
  /* saisie assistée : on tape, la liste filtre, on choisit dans les résultats */
  var box=document.createElement("div");
  box.style.cssText="margin-bottom:12px;width:100%";
  var lab=document.createElement("p"); lab.className="legend"; lab.textContent=titre;
  box.appendChild(lab);

  if(valeur){
    var pil=document.createElement("span");
    pil.style.cssText="display:inline-flex;align-items:center;gap:8px;padding:8px 10px 8px 13px;border-radius:var(--r-field);"
      +"background:rgba(255,255,255,.85);color:var(--ink);font-size:14.5px;font-weight:600";
    pil.appendChild(document.createTextNode(libelle(valeur)));
    var x=document.createElement("button"); x.type="button"; x.textContent="×";
    x.setAttribute("aria-label","Retirer");
    x.style.cssText="flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;min-width:32px;min-height:32px;"
      +"padding:0;margin:0;border:0;border-radius:50%;background:rgba(28,30,34,.10);color:var(--ink-2);font-size:19px;line-height:1;cursor:pointer";
    x.addEventListener("click", function(){ poser(""); });
    pil.appendChild(x);
    box.appendChild(pil);
    return box;
  }

  var saisie=document.createElement("input"); saisie.type="text";
  saisie.placeholder=placeholder; saisie.autocapitalize="off"; saisie.spellcheck=false;
  saisie.style.cssText="width:100%;min-height:44px;padding:11px 14px;border:0;border-radius:var(--r-field);"
    +"background:rgba(255,255,255,.85);font-size:16px;font-family:inherit";
  box.appendChild(saisie);

  var res=document.createElement("div");
  res.style.cssText="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px";
  box.appendChild(res);

  function peindre(){
    res.textContent="";
    var q=normaliser(saisie.value);
    var liste=source();
    var vus=liste.filter(function(o){
      if(!q) return true;
      return normaliser(libelle(o.valeur)+" "+o.valeur).indexOf(q)>=0;
    }).slice(0, 8);
    if(!liste.length){
      var v=document.createElement("span"); v.className="hint"; v.style.margin="0";
      v.textContent="Liste indisponible hors connexion.";
      res.appendChild(v); return;
    }
    if(!vus.length){
      var w=document.createElement("span"); w.className="hint"; w.style.margin="0";
      w.textContent="Aucune correspondance.";
      res.appendChild(w); return;
    }
    vus.forEach(function(o){
      var b=document.createElement("button"); b.type="button";
      b.style.cssText="border:0;border-radius:var(--r-field);background:rgba(255,255,255,.85);color:var(--ink-2);"
        +"font-family:inherit;font-size:13.5px;font-weight:600;padding:8px 12px;min-height:36px;cursor:pointer";
      b.textContent=libelle(o.valeur);
      b.addEventListener("click", function(){ poser(o.valeur); });
      res.appendChild(b);
    });
  }
  saisie.addEventListener("input", peindre);
  peindre();
  return box;
}
function nomEquipe(saisie){
  /* même contrôle qu'à la publication : on valide le nom sur l'équipe */
  var t=normaliser(saisie);
  if(!t) return null;
  var exact=null, debut=[];
  EQUIPE.forEach(function(p){
    var n=normaliser(p.nom);
    if(n===t) exact=p.nom;
    else if(n.indexOf(t)===0) debut.push(p.nom);
  });
  if(exact) return exact;
  if(debut.length===1) return debut[0];
  return null;
}
/* ---------- partage d'une liste ----------
   Une to-do list n'est pas toujours un chantier : un achat à faire, un
   rendez-vous, une info d'agence. Le partage sert à ça — plusieurs
   personnes sur la même liste, chacune coche de son côté. */
function partageDe(l){
  var noms=Array.isArray(l.partage) ? l.partage.slice() : [];
  if(l.pour && noms.indexOf(l.pour)<0) noms.push(l.pour);
  return noms;
}
function poserPartage(l, noms){
  l.partage=noms.slice();
  l.pour="";                       /* l'ancien champ unique est absorbé */
  touche(l); save(); render();
}
function saisiePartage(l){
  var box=document.createElement("div");
  box.style.cssText="margin-bottom:12px;width:100%";
  var lab=document.createElement("p"); lab.className="legend";
  lab.textContent="Partagée avec";
  box.appendChild(lab);
  var noms=partageDe(l);
  var mien = !dAutrui(l);

  if(noms.length){
    var pils=document.createElement("div");
    pils.style.cssText="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px";
    noms.forEach(function(nom){
      pils.appendChild(PastillePersonne(nom, mien ? function(){ poserPartage(l, noms.filter(function(n){ return n!==nom; })); } : null));
    });
    box.appendChild(pils);
  }

  if(!mien){
    var note=document.createElement("p"); note.className="hint"; note.style.margin="0";
    note.textContent="Liste de "+l.auteur+". Vous pouvez la remplir et la cocher ; "
      +"le partage se règle chez son auteur.";
    box.appendChild(note);
    return box;
  }

  /* une recherche : on tape, les collègues qui correspondent s'affichent dessous (personnes.js) */
  box.appendChild(ChercherPersonne({personnes:EQUIPE.filter(function(p){ return !estMoi(p.nom); }), exclure:noms,
    placeholder:"Rechercher un collègue",
    ajouter:function(nom){
      if(noms.indexOf(nom)>=0){ toast(nom+" y a déjà accès."); return; }
      poserPartage(l, noms.concat([nom]));
      toast("Partagée avec "+nom+".");
    }}));
  var aide=document.createElement("p"); aide.className="hint"; aide.style.margin="8px 0 0";
  aide.textContent="Chacun la voit dans sa To-do list et peut cocher. "
    +"Deux personnes qui cochent en même temps ne s'effacent pas : chaque ligne garde sa dernière modification.";
  box.appendChild(aide);
  return box;
}

  d.appendChild(saisiePartage(l));

function champ(libelle, valeur, liste, fn){
  var lab=document.createElement("label"); lab.className="f";
  var s=document.createElement("span"); s.textContent=libelle;
  var i=document.createElement("input"); i.type="text"; i.value=valeur||"";
  if(liste) i.setAttribute("list", liste);
  i.addEventListener("input", function(){ fn(i.value); });
  lab.appendChild(s); lab.appendChild(i);
  return lab;
}
function champDate(libelle, valeur, fn){
  var lab=document.createElement("label"); lab.className="f";
  var s=document.createElement("span"); s.textContent=libelle;
  var i=document.createElement("input"); i.type="date"; i.value=valeur||"";
  i.addEventListener("change", function(){ fn(i.value); });
  lab.appendChild(s); lab.appendChild(i);
  return lab;
}
function frDateHeure(iso){
  if(!iso) return "";
  var a=dateLocale(iso).split("-");
  return a[2]+"/"+a[1]+"/"+a[0]+" à "+heureLocale(iso);
}
window.__notes = { corbeille: function(){ ouvrirCorbeille(); } };

function peindreCorbeille(d){
  var corps=$("corbCorps"); corps.textContent="";
  function titre(t){ var h=document.createElement("h3"); h.textContent=t; corps.appendChild(h); }
  function ligne(tb, ts, libelle, action){
    var r=document.createElement("div"); r.className="cb-l";
    var t=document.createElement("div"); t.className="t";
    var b=document.createElement("b"); b.textContent=tb;
    var sp=document.createElement("span"); sp.textContent=ts;
    t.appendChild(b); t.appendChild(sp);
    var bt=document.createElement("button"); bt.type="button"; bt.className="act ghost"; bt.textContent=libelle;
    bt.addEventListener("click", function(){ action(bt); });
    r.appendChild(t); r.appendChild(bt); corps.appendChild(r);
  }
  titre("Listes supprimées");
  if(!(d.corbeille||[]).length){
    var p=document.createElement("p"); p.className="hint";
    p.textContent="Aucune. Une liste supprimée reste ici 60 jours.";
    corps.appendChild(p);
  }
  (d.corbeille||[]).forEach(function(n){
    ligne(n.titre || "Liste sans titre",
      n.taches+" tâche"+(n.taches>1?"s":"")+" · supprimée le "+frDateHeure(n.supprimeeLe),
      "Restaurer", function(bt){ restaurer("note-restaurer", "&id="+encodeURIComponent(n.id), bt); });
  });
  titre("Copies automatiques");
  var ex=document.createElement("p"); ex.className="hint";
  ex.textContent="Chaque jour, le site garde une copie de toutes vos listes (14 jours). « Récupérer » rapporte les listes de ce jour-là qui manquent aujourd'hui, sans toucher aux autres.";
  corps.appendChild(ex);
  if(!(d.sauvegardes||[]).length){
    var q=document.createElement("p"); q.className="hint"; q.textContent="Pas encore de copie : la première se fait à la prochaine modification.";
    corps.appendChild(q);
  }
  (d.sauvegardes||[]).forEach(function(c){
    var j=c.jour.split("-");
    ligne(j[2]+"/"+j[1]+"/"+j[0]+" — "+c.listes+" liste"+(c.listes>1?"s":"")+", "+c.taches+" tâche"+(c.taches>1?"s":""),
      (c.titres||[]).join(" · "),
      "Récupérer", function(bt){ restaurer("notes-restaurer-jour", "&jour="+encodeURIComponent(c.jour), bt); });
  });
}
function restaurer(action, params, bt){
  bt.disabled=true; bt.textContent="…";
  fetch(apiUrl(action)+params, {method:"POST", headers:apiEnTetes(), body:"{}"})
    .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d}; }); })
    .then(function(res){
      if(!res.ok){ bt.disabled=false; bt.textContent="Réessayer"; toast(res.d.erreur || "Impossible pour le moment."); return; }
      var n=res.d.restaurees||0;
      (res.d.ids||[]).forEach(oublierSuppression);
      /* ce qui revient n'est plus « supprimé » sur ce téléphone */
      tirer_serveur(function(){
        toast(n ? n+" liste"+(n>1?"s":"")+" de retour." : "Rien ne manquait : toutes ces listes sont déjà là.");
        ouvrirCorbeille();
      });
    })
    .catch(function(){ bt.disabled=false; bt.textContent="Réessayer"; toast("Pas de réseau."); });
}

function supprimer(l){
  /* La suppression reste « à dire au serveur » tant qu'il ne l'a pas
     prise : hors connexion, elle part à la prochaine synchronisation.
     Le serveur met la liste à la corbeille (60 jours). */
  N.aSupprimer = N.aSupprimer || [];
  if(N.aSupprimer.indexOf(l.id)<0) N.aSupprimer.push(l.id);
  N.listes = N.listes.filter(function(x){ return x.id!==l.id; });
  try{ window.storage.set("notes:local", JSON.stringify(N)); }catch(e){}
  render();
  var envoi = apiPret(true) ? envoyerSuppression(l.id) : Promise.resolve(false);
  toast("Liste « "+(l.titre||"sans titre")+" » supprimée.", "Annuler", function(){ annulerSuppression(l, envoi); });
}
/* « Annuler » juste après : la liste revient telle quelle. Si le serveur
   l'avait déjà mise de côté, on la lui fait restaurer. */
function annulerSuppression(l, envoi){
  oublierSuppression(l.id);
  if(!N.listes.some(function(x){ return x.id===l.id; })) N.listes.push(l);
  try{ window.storage.set("notes:local", JSON.stringify(N)); }catch(e){}
  render();
  envoi.then(function(parti){
    if(!parti){ save(); toast("Liste « "+(l.titre||"sans titre")+" » remise."); return; }
    fetch(apiUrl("note-restaurer")+"&id="+encodeURIComponent(l.id), {method:"POST", headers:apiEnTetes(), body:"{}"})
      .then(function(r){ return r.ok; }).catch(function(){ return false; })
      .then(function(ok){
        tirer_serveur(function(){ save(); });
        toast(ok ? "Liste « "+(l.titre||"sans titre")+" » remise." : "Pas de réseau : la liste revient dès la connexion retrouvée.");
      });
  });
}

/* ---------- annotation : l'outil commun (annotation.js) ----------
   Photos et croquis gardent leurs annotations comme des objets : on les
   retouche plus tard, la photo d'origine restant intacte à côté. */
function openSketch(p, index, after){
  if(!p) return;
  if(!p.photos) p.photos=[];
  var suite = after || function(){};
  var nom = (p.nom||"").trim();
  if(index===undefined || index===null){
    Annotation.croquis({titre:"Croquis" + (nom ? " - "+nom : "")}).then(function(ph){
      if(!ph) return;
      p.photos.push(ph);
      toast("Croquis ajouté.");
      save(); suite(); refreshHeader();
    });
    return;
  }
  var ph=p.photos[index];
  if(!ph) return;
  Annotation.photo(ph, {titre:"Annoter" + (nom ? " - "+nom : "")}).then(function(r){
    if(!r) return;
    toast("Photo annotée.");
    save(); suite(); refreshHeader();
  }).catch(function(){ toast("Image illisible."); });
}

/* ---------- photos et croquis ---------- */
var LISTE_PHOTO=null;
function photoPour(l){
  LISTE_PHOTO=l;
  $("filePhoto").click();
}
function cible(l){
  l.photos = l.photos || [];
  return {nom: l.titre || "liste", photos: l.photos};
}
function croquisVierge(l){
  LISTE_PHOTO=l;
  openSketch(cible(l), null, function(){ touche(l); save(); render(); });
}
function ouvrirCroquis(l, index){
  LISTE_PHOTO=l;
  openSketch(cible(l), index, function(){ touche(l); save(); render(); });
}
function refreshHeader(){ /* l'en-tête affiche l'état de synchronisation, rien à recalculer */ }

    .then(function(r){ return r.ok ? r.json() : Promise.reject(); })

/* ---------- liaisons ---------- */
function bindAll(){
  $("btnNouvelle").addEventListener("click", nouvelleListe);
  $("btnCorbeille").addEventListener("click", ouvrirCorbeille);
  $("btnMasquees").addEventListener("click", ouvrirMasquees);
  $("masqFermer").addEventListener("click", function(){ $("masquees").hidden=true; });
  $("masquees").addEventListener("click", function(e){ if(e.target===this) this.hidden=true; });
  document.addEventListener("keydown", function(e){ if(e.key==="Escape" && !$("masquees").hidden) $("masquees").hidden=true; });
  $("toRegOk").addEventListener("click", validerReglages);
  $("toRegFermer").addEventListener("click", function(){ $("toReglages").hidden=true; });
  $("toReglages").addEventListener("click", function(e){ if(e.target===this) this.hidden=true; });
  document.addEventListener("keydown", function(e){ if(e.key==="Escape" && !$("toReglages").hidden) $("toReglages").hidden=true; });
  $("corbFermer").addEventListener("click", function(){ $("corbeille").hidden=true; });
  $("corbeille").addEventListener("click", function(e){ if(e.target===this) this.hidden=true; });
  document.addEventListener("keydown", function(e){ if(e.key==="Escape" && !$("corbeille").hidden) $("corbeille").hidden=true; });
  $("btnHaut").addEventListener("click", function(){ window.scrollTo({top:0, behavior:"smooth"}); });
  $("q").addEventListener("input", render);
  brancherRangement();
  var attente=null;
  window.addEventListener("resize", function(){
    /* l'écran tourne pendant qu'on tient une liste : elle revient à sa place */
    if(GL && window.innerWidth!==GL.largeur) poser(true);
    clearTimeout(attente);
    attente=setTimeout(function(){ if(nbColonnes()!==NB_COLONNES) render(); }, 120);
  });
  window.addEventListener("popstate", function(){ if(OUVERTE) fermerVraiment(); });
  document.addEventListener("keydown", function(e){
    if(e.key==="Escape" && OUVERTE && !Annotation.ouvert()) fermerListe();
  });
  $("filePhoto").addEventListener("change", function(){
    var files=this.files, n=files.length, done=0, l=LISTE_PHOTO;
    if(!l){ this.value=""; return; }
    l.photos = l.photos || [];
    Array.prototype.forEach.call(files, function(f){
      compress(f, function(ph){
        if(ph) l.photos.push(ph);
        if(++done===n){ touche(l); save(); render(); }
      });
    });
    this.value="";
  });
  /* au retour sur la page, on récupère ce qui a changé ailleurs */
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden) tirer_serveur();
  });
  window.addEventListener("focus", function(){ tirer_serveur(); });
  window.addEventListener("online", function(){ tirer_serveur(function(){ pousser_serveur(); }); });
}
/* ---------- retour aux rapports quand on vient de la liste ---------- */
(function retourRapports(){
  try{
    var vient = document.referrer && document.referrer.indexOf("rapports.html")>=0;

      try{ vient = sessionStorage.getItem("retour:rapports")==="1"; }catch(e){}

    barre.insertBefore(a, barre.children[1] || null);
  }catch(e){}
})();

function start(){
  bindAll();
  charger_local(function(){
    render();
    /* ?liste=… : l'accueil ouvre directement la liste concernée */
    try{
      var id=new URLSearchParams(location.search).get("liste");
      if(id && listeDe(id)){
        history.replaceState(null, "", location.pathname);
        ouvrirListe(id);

    majSync(apiPret(true) ? "cours" : "hors");

    /* à l'ouverture : on lit le serveur, et on ne lui renvoie que ce qui est nouveau ici */
    tirer_serveur(function(){ if(tirer_serveur.aPousser === false) majSync("ok"); else pousser_serveur(); });
  });
}
start();
