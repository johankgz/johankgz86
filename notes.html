<style>
:root{
  --bg:#EAEDF4;
  --card:#FFFDF8;
  --field:#E2E6EE;
  --ink:#1C1E22;
  --ink-2:#5D626D;
  --ink-3:#767D8B;
  --rule:#CFD5E1;
  --accent:#2563EB;
  --accent-soft:#EAF1FF;
  --solar:#E8A33D;
  --solar-soft:#EAF1FF;
  --danger:#A6291F;
  --danger-soft:#F8E4E0;
  --ok:#5E6E42;
  --r-card:2px;
  --r-field:2px;
  --tap:48px;
  --shadow:0 1px 2px rgba(28,30,34,.05), 0 10px 28px -18px rgba(28,30,34,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.45;letter-spacing:-.01em;
  padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));
  -webkit-text-size-adjust:100%;
}

/* ---------- en-tête ---------- */
header{
  position:sticky;top:0;z-index:20;
  background:rgba(241,243,247,.86);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid rgba(28,30,34,.07);
  padding:calc(10px + env(safe-area-inset-top,0px)) 14px 9px;
}
.h-row{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
header h1{font-size:21px;font-weight:700;letter-spacing:-.03em;margin:0}
header .ref{font-size:13px;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums}
nav{
  display:flex;gap:2px;overflow-x:auto;margin-top:10px;padding:3px;
  background:rgba(118,125,139,.12);border-radius:var(--r-field);scrollbar-width:none;
}
nav::-webkit-scrollbar{display:none}
nav button{
  flex:0 0 auto;border:0;background:transparent;color:var(--ink-2);
  border-radius:var(--r-field);padding:7px 14px;font-size:14px;font-weight:600;font-family:inherit;
  letter-spacing:-.01em;cursor:pointer;transition:background .18s ease,color .18s ease;
}
nav button[aria-current="true"]{
  background:var(--card);color:var(--ink);
  box-shadow:none;
}

main{max-width:760px;margin:0 auto;padding:16px 14px 8px}
section[hidden]{display:none}

/* ---------- cartes ---------- */
.block{
  background:var(--card);border-radius:var(--r-field);
  box-shadow:var(--shadow);padding:16px;margin-bottom:14px;
}
.block > h2{
  font-size:17px;font-weight:700;letter-spacing:-.02em;
  margin:0 0 14px;padding:0;
}
label.f{display:block;margin-bottom:14px}
label.f > span{display:block;font-size:13.5px;font-weight:500;color:var(--ink-2);margin-bottom:6px}
input[type=text],input[type=tel],input[type=email],input[type=number],input[type=date],textarea,select{
  width:100%;min-height:var(--tap);padding:12px 14px;font-size:16px;line-height:1.35;
  font-family:inherit;color:var(--ink);background:var(--field);
  border:1px solid transparent;border-radius:var(--r-field);
  transition:background .15s ease,border-color .15s ease;
}
input[type=email]{min-height:52px}
select{appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);
  background-position:calc(100% - 19px) 21px, calc(100% - 13px) 21px;
  background-size:6px 6px, 6px 6px;background-repeat:no-repeat;padding-right:38px}
input:focus,textarea:focus,select:focus{
  outline:none;background:var(--card);border-color:var(--accent);
  box-shadow:0 0 0 4px rgba(37,99,235,.16);
}
textarea{min-height:112px;resize:vertical;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:430px){.grid2{grid-template-columns:1fr}}

/* ---------- pastilles de choix ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{
  display:inline-flex;align-items:center;min-height:42px;padding:9px 16px;border-radius:var(--r-field);
  background:var(--field);color:var(--ink);font-size:14.5px;font-weight:500;
  cursor:pointer;user-select:none;transition:background .15s ease,color .15s ease,transform .1s ease;
}
.chip:active{transform:scale(.97)}
.chip input{position:absolute;opacity:0;width:0;height:0}
.chip.on{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 4px 14px -6px rgba(37,99,235,.7)}
.chip.on.multi{background:var(--accent)}
#tab-pv .chip.on{background:var(--solar);color:#20180A;box-shadow:0 4px 14px -6px rgba(242,160,7,.75)}
.legend{font-size:13.5px;font-weight:500;color:var(--ink-2);margin:0 0 8px}
.hint{font-size:13px;color:var(--ink-3);margin:8px 0 0;line-height:1.4}
.err{font-size:13.5px;color:var(--danger);margin:8px 0 0}
.ok{font-size:13.5px;color:var(--ok);margin:8px 0 0}

/* ---------- boutons ---------- */
button.act{
  min-height:var(--tap);padding:12px 18px;border-radius:var(--r-field);border:0;
  background:var(--field);color:var(--ink);font-size:15px;font-family:inherit;font-weight:600;
  letter-spacing:-.01em;cursor:pointer;transition:transform .1s ease,filter .15s ease;
}
button.act:active{transform:scale(.975)}
button.act.solid{background:var(--ink);color:#fff}
button.act.blue{background:var(--accent);color:#fff;box-shadow:0 6px 18px -10px rgba(37,99,235,.9)}
button.act.ghost{background:var(--accent-soft);color:var(--accent)}
button.act.danger{background:var(--danger-soft);color:var(--danger)}
button.act.rec{background:var(--accent-soft);color:var(--accent)}
button.act:disabled{opacity:.4}
#tab-pv button.act.solid{background:var(--solar);color:#20180A}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- pièces ---------- */
.room{border-radius:var(--r-field);background:var(--card);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.room > .head{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.room[data-open="1"] > .head{border-bottom:1px solid var(--rule)}
.room > .head .n{
  font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;color:#fff;background:var(--accent);
  border-radius:var(--r-field);padding:3px 9px;min-width:28px;text-align:center;
}
.room > .head .t{flex:1;font-weight:650;font-size:16px;letter-spacing:-.02em}
.room > .head .meta{font-size:12.5px;color:var(--ink-3)}
.room .body{padding:16px}
.room[data-open="0"] .body{display:none}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(106px,1fr));gap:10px;margin-top:12px}
.thumb{position:relative;border-radius:var(--r-field);overflow:hidden;background:#15171A;box-shadow:var(--shadow)}
.thumb img{display:block;width:100%;height:106px;object-fit:cover}
.thumb input{width:100%;border:0;border-radius:0;min-height:40px;font-size:16px;padding:7px 9px;background:#fff}
.thumb .del{
  position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:0;
  background:rgba(10,13,18,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  color:#fff;font-size:17px;line-height:1;cursor:pointer;
}
.thumb .ann{right:42px;font-size:15px}
.dictating{background:var(--danger)!important;color:#fff!important;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
@media(prefers-reduced-motion:reduce){.dictating{animation:none;opacity:.75}
  *{transition:none!important}}

/* ---------- résultats photovoltaïques ---------- */
.calc{
  display:flex;align-items:center;justify-content:center;min-height:var(--tap);min-width:124px;
  padding:12px 14px;border-radius:var(--r-field);background:var(--solar-soft);color:#7A5200;
  font-size:15.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;
}
.pvres{border-radius:var(--r-field);overflow:hidden;box-shadow:var(--shadow)}
.pvres .top{
  display:flex;flex-wrap:wrap;gap:4px;padding:16px;color:#fff;
  background:linear-gradient(135deg,#16233A 0%,#2563EB 100%);
}
.pvres .top b{display:block;font-size:24px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pvres .top span{font-size:12.5px;color:rgba(255,255,255,.72)}
.pvres .cell{flex:1;min-width:112px}
.pvmonths{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--rule)}
.pvmonths div{background:#fff;padding:9px 3px;text-align:center;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pvmonths div b{display:block;font-size:13.5px;color:var(--ink);font-weight:650}
.simcard{border-radius:var(--r-field);overflow:hidden;margin-bottom:12px;background:var(--card);box-shadow:var(--shadow)}
.simcard img{display:block;width:100%;max-height:200px;object-fit:cover}
.simcard .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;font-size:13.5px}
.simcard .meta b{font-size:14.5px}

/* ---------- navigation bas de page ---------- */
.stepnav{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:nowrap;margin:2px 0 16px}
.stepnav button{
  flex:0 0 auto;min-height:44px;padding:9px 15px;border-radius:var(--r-field);border:0;
  background:var(--card);color:var(--ink);font-family:inherit;font-size:14.5px;font-weight:600;
  cursor:pointer;white-space:nowrap;box-shadow:var(--shadow);transition:transform .1s ease;
}
.stepnav button:active{transform:scale(.96)}
.stepnav button:disabled{opacity:.35;box-shadow:none}
.stepnav button.next{background:var(--accent);color:#fff}
.stepnav .dots{display:flex;gap:5px;align-items:center;justify-content:center;flex:1 1 auto}
.stepnav .dots button{
  flex:0 0 auto;width:32px;height:32px;min-height:32px;padding:0;border-radius:50%;
  font-size:13.5px;font-variant-numeric:tabular-nums;box-shadow:none;background:rgba(118,125,139,.16);
  color:var(--ink-2);display:flex;align-items:center;justify-content:center;
}
.stepnav .dots button[aria-current="true"]{background:var(--ink);color:#fff}

/* ---------- notifications ---------- */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:28px;z-index:80;
  background:rgba(28,30,34,.94);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  color:#fff;padding:13px 20px;border-radius:var(--r-field);font-size:14.5px;font-weight:500;max-width:88%;
  box-shadow:0 12px 32px -12px rgba(0,0,0,.6);
}
.toast[hidden]{display:none}
.toast .toast-act{margin-left:14px;min-height:36px;padding:6px 14px;border:0;border-radius:999px;background:#3B82F6;color:#1E2329;
  font:inherit;font-weight:700;cursor:pointer}

/* ---------- plein écran : croquis et implantation ---------- */
#sketch,#toit{
  position:fixed;inset:0;z-index:60;background:#15171A;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);
}
#sketch[hidden],#toit[hidden]{display:none}
.sk-bar{
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:#202226;
}
.sk-bar.bottom{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));margin-top:auto}
.sk-bar button{
  min-height:44px;padding:10px 15px;border-radius:var(--r-field);border:0;background:rgba(255,255,255,.1);
  color:#EAEDF4;font-size:14.5px;font-family:inherit;font-weight:600;cursor:pointer;
}
.sk-bar button:active{transform:scale(.96)}
.sk-bar button.on{background:#fff;color:#1C1E22}
.sk-bar button.go{background:var(--accent);color:#fff;margin-left:auto}
.sk-bar .title{color:#767D8B;font-size:13.5px;font-weight:500;margin-right:auto;padding-left:4px}
.sk-bar .mini{display:flex;flex-direction:column;font-size:11px;color:#767D8B;gap:3px}
.sk-bar .mini input{
  width:86px;min-height:40px;font-size:16px;padding:7px 10px;background:rgba(255,255,255,.1);
  color:#fff;border:0;border-radius:var(--r-field);
}
.sk-dot{width:38px;height:38px;min-height:38px;border-radius:50%;padding:0;border:2px solid rgba(255,255,255,.25)}
.sk-dot.on{border-color:#fff;box-shadow:0 0 0 3px #15171A,0 0 0 5px #fff}
#sk_colors{padding-top:0;gap:11px;background:#202226}
.sk-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;overflow:hidden}
#sk_canvas{background:#fff;border-radius:var(--r-field);max-width:100%;max-height:100%;touch-action:none;
  box-shadow:0 18px 50px -20px rgba(0,0,0,.8)}
#toit_canvas{background:#000;border-radius:var(--r-field);max-width:100%;max-height:100%;touch-action:none;
  box-shadow:0 18px 50px -20px rgba(0,0,0,.8)}

.menu-link{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:var(--r-field);background:rgba(118,125,139,.14);color:var(--ink-2);font-size:13px;font-weight:600;text-decoration:none;margin-right:10px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(106px,1fr));gap:10px;margin-top:12px}
.thumb{position:relative;border-radius:var(--r-field);overflow:hidden;background:#15171A;box-shadow:var(--shadow)}
.thumb img{display:block;width:100%;height:106px;object-fit:cover}
.thumb input{width:100%;border:0;border-radius:0;min-height:40px;font-size:16px;padding:7px 9px;background:#fff}
.thumb .del{
  position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:0;
  background:rgba(10,13,18,.62);color:#fff;font-size:17px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;
}
#sketch,#toit{
  position:fixed;inset:0;z-index:60;background:#15171A;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);
}
#sketch[hidden],#toit[hidden]{display:none}
.sk-bar{
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:#202226;
}
.sk-bar.bottom{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));margin-top:auto}
.sk-bar button{
  min-height:44px;padding:10px 15px;border-radius:var(--r-field);border:0;background:rgba(255,255,255,.1);
  color:#EAEDF4;font-size:14.5px;font-family:inherit;font-weight:600;cursor:pointer;
}
.sk-bar button:active{transform:scale(.96)}
.sk-bar button.on{background:#fff;color:#1C1E22}
.sk-bar button.go{background:var(--accent);color:#fff;margin-left:auto}
.sk-bar .title{color:#767D8B;font-size:13.5px;font-weight:500;margin-right:auto;padding-left:4px}
.sk-bar .mini{display:flex;flex-direction:column;font-size:11px;color:#767D8B;gap:3px}
.sk-bar .mini input{
  width:86px;min-height:40px;font-size:16px;padding:7px 10px;background:rgba(255,255,255,.1);
  color:#fff;border:0;border-radius:var(--r-field);
}

.sk-dot.on{border-color:#fff;box-shadow:0 0 0 3px #15171A,0 0 0 5px #fff}

#sk_canvas{background:#fff;border-radius:var(--r-field);max-width:100%;max-height:100%;touch-action:none;
  box-shadow:0 18px 50px -20px rgba(0,0,0,.8)}
input[type="date"],input[type="time"]{min-width:0;width:100%;-webkit-appearance:none;appearance:none}
html{-webkit-text-size-adjust:100%}
body{touch-action:manipulation}
button,.act,.chip,label,input,select,textarea,a{touch-action:manipulation}

/* ---------- carte de liste ---------- */
.note{border-radius:var(--r-field);padding:14px 15px 10px;margin-bottom:12px;border:1px solid rgba(28,30,34,.10);
 box-shadow:none}
.note.jaune{background:#FDF3D3;border-color:#F0E2B4}
.note.vert{background:#E6F4E4;border-color:#CBE6C7}
.note.bleu{background:#E3EEFC;border-color:#C8DCF6}
.note.rose{background:#FBE6E6;border-color:#F3CFCF}
.note.violet{background:#EFE8FB;border-color:#DCD0F4}
.note.gris{background:#EEF1F5;border-color:#DCE2EA}
.note.finie{opacity:.7}

.note .n-tete{display:flex;align-items:flex-start;gap:10px}
.note .n-titre{flex:1 1 auto!important;width:auto!important;min-width:0;border:0!important;background:none!important;
 font-family:inherit;font-size:17px!important;font-weight:700;letter-spacing:-.02em;color:var(--ink);
 padding:2px 0!important;min-height:0!important;border-radius:0!important}
.note .n-titre:focus{outline:none;box-shadow:none!important;background:none!important}
.note .n-pin{flex:0 0 auto;width:32px;height:32px;min-height:32px;border:0;border-radius:50%;
 background:rgba(255,255,255,.6);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.note .n-pin svg{width:16px;height:16px;stroke:var(--ink-2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.note .n-pin.on{background:#fff}
.note .n-pin.on svg{stroke:#B07807;fill:rgba(201,133,7,.35)}

.note .n-tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.note .n-tag{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:var(--r-field);background:rgba(255,255,255,.75);color:var(--ink-2)}
.note .n-tag.acc{color:var(--accent)}
.note .n-tag.rouge{color:var(--danger)}
.note .n-tag.ambre{color:#9A6A05}

.note .n-items{margin-top:8px}
.note .n-item{display:flex!important;align-items:center;gap:11px;padding:2px 0;min-height:38px}
.note .n-case{flex:0 0 auto!important;width:22px!important;height:22px!important;min-height:22px!important;
 border:2px solid rgba(28,30,34,.45)!important;border-radius:var(--r-field)!important;background:transparent!important;
 padding:0!important;cursor:pointer;display:flex;align-items:center;justify-content:center}
.note .n-case.on{background:var(--ink)!important;border-color:var(--ink)!important}
.note .n-case svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.note .n-texte{flex:1 1 auto!important;width:auto!important;min-width:0;border:0!important;background:none!important;
 font-family:inherit;font-size:15.5px!important;color:var(--ink);padding:6px 0!important;min-height:0!important;
 border-radius:0!important;line-height:1.35}
.note .n-texte:focus{outline:none;box-shadow:none!important;background:none!important}
.note .n-item.fait .n-texte{color:var(--ink-3);text-decoration:line-through}
.note .n-del{flex:0 0 auto;width:26px;height:26px;min-height:26px;border:0;border-radius:50%;background:none;
 color:var(--ink-3);font-size:17px;line-height:1;cursor:pointer;padding:0}
.note .n-plus{display:flex;align-items:center;gap:11px;width:100%;margin-top:2px;border:0;background:none;
 color:var(--ink-3);font-family:inherit;font-size:15px;padding:9px 0;cursor:pointer;text-align:left}
.note .n-plus b{width:22px;text-align:center;font-size:19px;font-weight:400;color:var(--ink-3)}

.note .thumbs{grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:10px}
.note .thumb img{height:88px}

.note .n-pied{display:flex;align-items:center;gap:6px;margin-top:8px;padding-top:8px;
 border-top:1px solid rgba(28,30,34,.08);flex-wrap:wrap}
.note .n-etat{flex:1 1 100%;order:2;font-size:11.5px;color:var(--ink-3);margin-top:4px}
.note .n-outils{display:flex;gap:4px;order:1;flex:1}
.note .n-petit{width:36px;height:36px;min-height:36px;border:0;border-radius:50%;background:rgba(255,255,255,.7);

/* =====================================================================
   INSTRUMENT — la couche d'habillage du site
   ---------------------------------------------------------------------
   Direction : un instrument de mesure, pas un tableau de bord de vaisseau.
   Le vocabulaire est technique — traits d'un pixel, équerres de repère,
   chiffres en chasse fixe, graphite et orange électrique — mais les
   surfaces de travail restent claires et contrastées : la fiche se
   remplit dehors, en plein soleil, avec des gants.

   Deux couleurs, deux rôles, jamais l'un pour l'autre :
      orange  ce sur quoi on agit    (boutons, liens, onglet courant)
      cyan    ce que l'outil mesure  (chiffres, repères, carte, états)

   Tout part des variables ci-dessous. Une valeur suffit à reprendre le
   site entier.
   ===================================================================== */

/* ---------- une seule police, hébergée ici : elle marche hors réseau ---------- */
@font-face{
  font-family:"Plus Jakarta Sans";
  src:url("./polices/jakarta-var.woff2") format("woff2-variations");
  font-weight:200 800; font-style:normal; font-display:swap;
}

:root{
  /* graphite : le châssis */
  --g-900:#0A0E14;
  --g-800:#10161F;
  --g-700:#1A2230;
  --g-600:#27313F;
  --trait-tech:rgba(255,255,255,.10);

  /* surfaces de travail : claires, pour le plein soleil */
  --bg:#0A0F1A;          /* anthracite : le site est un châssis, les fiches sont dessus */
  --card:#FFFFFF;
  --field:#EFF1F4;
  --champ-fond:#FFFFFF;
  --champ-bord:#D8DDE4;
  --rule:rgba(10,14,20,.09);
  --ink:#0C1119;
  --ink-2:#4B5563;
  --ink-3:#6B7684;

  /* ce sur quoi on agit */
  --accent:#2563EB;
  --accent-fonce:#1D4ED8;
  --accent-vif:#3B82F6;          /* sur graphite, il faut qu'il brille */
  --accent-soft:#EEF4FF;

  /* ce que l'outil mesure */
  --data:#0E7490;
  --data-vif:#22D3EE;
  --data-soft:#E7F4F7;

  /* familles, toutes au même niveau */
  --violet:#5B5F80;      --violet-soft:#EFEFF4;
  --vert:#3F6B52;        --vert-soft:#EAF2ED;
  --ambre:#8A6524;       --ambre-soft:#F1F5FB;
  --rouge:#A03A33;       --rouge-soft:#F8EDEB;
  --solar:#8A6524;       --solar-soft:#F1F5FB;
  --danger:#A03A33;      --danger-soft:#F8EDEB;
  --ok:#3F6B52;          --ok-soft:#EAF2ED;

  /* géométrie : des angles francs, pas des galets */
  --r-card:10px;
  --r-field:8px;
  --r-pill:999px;

  --ombre-1:0 1px 2px rgba(10,14,20,.05);
  --ombre-2:0 1px 2px rgba(10,14,20,.05), 0 10px 24px -14px rgba(10,14,20,.35);
  --ombre-3:0 22px 48px -20px rgba(10,14,20,.45);
  --shadow:var(--ombre-2);

  --sans:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  /* tout est dans la même police : --mono ne change que les chiffres,
     qui restent tabulaires pour que les colonnes s'alignent */
  --mono:var(--sans);
}

html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  letter-spacing:-.006em;
}

/* ---------- les valeurs : mêmes lettres, chiffres alignés ----------
   références, dates, poids, compteurs : ce sont des valeurs. Elles
   gardent des chiffres tabulaires, donc de largeur égale : une valeur
   qui change ne fait pas danser la ligne. */
.mono,.ref,.num,.n,.etat,time,
input[type="number"],input[type="date"],input[type="time"],input[type="tel"]{
  font-variant-numeric:tabular-nums;
}

/* ---------- les intertitres ---------- */
h2.sec,.legend{
  font-size:11px;
  font-weight:600;
  letter-spacing:.11em;
  text-transform:uppercase;
  color:var(--ink-3);
}

/* ---------- surfaces ---------- */
.block,.travaux,.notifs,.restaurer{
  background:var(--card);
  border:1px solid var(--rule);
  border-radius:var(--r-card);
  box-shadow:var(--ombre-1);
}
.block h2{
  font-size:15.5px;font-weight:600;letter-spacing:-.015em;color:var(--ink);
}
h1{font-weight:600;letter-spacing:-.03em}
.hint{color:var(--ink-3);line-height:1.55}

/* ---------- champs : blancs, cernés, avec une amorce à gauche ---------- */
input[type="text"],input[type="search"],input[type="tel"],input[type="email"],
input[type="number"],input[type="date"],input[type="time"],input[type="url"],
input[type="password"],
input:not([type]),textarea,select{
  background:var(--champ-fond);
  border:1px solid var(--champ-bord);
  border-radius:var(--r-field);
  transition:border-color .16s ease, box-shadow .16s ease;
}
input::placeholder,textarea::placeholder{color:#9AA4B0}
input:hover:not(:focus),textarea:hover:not(:focus),select:hover:not(:focus){border-color:#BFC7D1}
input:focus,textarea:focus,select:focus{
  outline:none;background:#fff;
  border-color:var(--data);
  box-shadow:0 0 0 3px rgba(14,116,144,.16);
}
label span{font-weight:500;color:var(--ink-2)}

/* ---------- boutons ---------- */
button,.act,button.p{
  border-radius:var(--r-field);
  font-family:var(--sans);
  font-weight:600;
  letter-spacing:-.008em;
  transition:background .16s ease,color .16s ease,border-color .16s ease,
             box-shadow .16s ease,transform .08s ease;
}
button.p,.act.blue,.act.solid,button.go,.sk-bar button.go{
  background:var(--accent);color:#fff;border:1px solid transparent;
  box-shadow:0 1px 2px rgba(29,78,216,.3);
}
.act.ghost{
  background:#fff;color:var(--ink-2);
  border:1px solid var(--champ-bord);box-shadow:var(--ombre-1);
}
.act.danger{background:var(--rouge-soft);color:var(--rouge);border:1px solid rgba(160,58,51,.18);box-shadow:none}
button:active,.act:active,button.p:active{transform:translateY(1px)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,
textarea:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--data);outline-offset:2px;
}

/* ---------- pastilles et étiquettes ---------- */
.chip,.chips label{
  border-radius:var(--r-pill);
  border:1px solid var(--champ-bord);
  background:#fff;color:var(--ink-2);font-weight:500;
  transition:background .16s ease,border-color .16s ease,color .16s ease;
}
.chip.on,.chips label.on{
  background:var(--accent-soft);border-color:rgba(37,99,235,.4);
  color:var(--accent-fonce);font-weight:600;
}
.tag,.f .tag{
  border-radius:var(--r-pill);
  font-size:11px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;padding:4px 10px;
}
.ref{
  font-size:11.5px;font-weight:700;letter-spacing:.04em;
  border-radius:var(--r-field);
}

/* ---------- le châssis : en-tête sombre, trait technique ---------- */
header{
  background:var(--g-900);
  border-bottom:1px solid var(--trait-tech);
  color:#E7ECF2;
  position:relative;
}
header::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,var(--accent-vif),rgba(34,211,238,.55),transparent 72%);
}
header h1{color:#F2F5F9;font-weight:600}
header .hint,header .meta,header .etat{color:#8A97A6}
.menu-link,header a[href="./index.html"]{
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.18);
  border-radius:var(--r-field);
  color:#EDF1F6;
  box-shadow:none;
}
#hdrRef,header .ref{
  color:var(--data-vif);background:none;letter-spacing:.05em;font-weight:600;
}

/* ---------- barre d'onglets : une réglette ---------- */
nav#nav{
  gap:2px;padding:4px;margin:10px -2px 0;
  background:var(--g-800);
  border:1px solid var(--trait-tech);
  border-radius:10px;
}
nav#nav button{
  padding:7px 6px 6px;border-radius:7px;
  color:#8A97A6;font-weight:500;font-size:10.5px;
  letter-spacing:.02em;
}
nav#nav button[aria-current="true"]{
  color:#0A0E14;background:var(--accent-vif);
  font-weight:600;box-shadow:0 0 0 1px rgba(59,130,246,.5),0 6px 16px -8px rgba(59,130,246,.9);
}
nav#nav button svg{stroke-width:1.9}
.avance{margin-top:8px}
.avance .barre{height:3px;border-radius:0;background:rgba(255,255,255,.12)}
.avance .barre i{border-radius:0;background:linear-gradient(90deg,var(--accent-vif),var(--data-vif))}
.avance .etape{color:#8A97A6}
.avance .etape b{color:#E7ECF2}

/* ---------- l'équerre de repère : la signature de la maison ---------- */
.equerre{position:relative}
.equerre::before,.equerre::after{
  content:"";position:absolute;width:10px;height:10px;pointer-events:none;
  border:1px solid var(--data-vif);opacity:.55;
}
.equerre::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.equerre::after{bottom:-1px;right:-1px;border-left:0;border-top:0}

/* ---------- le survol, là où il existe ---------- */
@media (hover:hover){
  button.p:hover,.act.blue:hover,.act.solid:hover,button.go:hover{
    background:var(--accent-fonce);box-shadow:0 2px 10px -3px rgba(29,78,216,.5);
  }
  .act.ghost:hover{background:#FAFBFC;border-color:#BFC7D1;color:var(--ink)}
  .act.danger:hover{background:#F4E2DF}
  .chip:hover:not(.on),.chips label:hover:not(.on){border-color:#BFC7D1;background:#FAFBFC}
  .block:hover,.travaux:hover{box-shadow:var(--ombre-2)}
  .menu-link:hover,header a[href="./index.html"]:hover{background:rgba(255,255,255,.14);color:#fff}
  nav#nav button:hover:not([aria-current="true"]){color:#C7D0DA;background:rgba(255,255,255,.06)}
}
@media (prefers-reduced-motion:reduce){
  button,.act,input,textarea,select,.chip,.chips label,.block,.travaux{transition:none}
  button:active,.act:active,button.p:active{transform:none}
}

/* =====================================================================
   SUR LE FOND ANTHRACITE
   ---------------------------------------------------------------------
   Le fond de page est devenu sombre : les fiches restent des feuilles
   blanches posées dessus, mais tout ce qui s'écrit À CÔTÉ des fiches —
   intertitres, signature, salutation, boutons de page — doit passer en
   clair, sinon il disparaît. Deux valeurs suffisent, mesurées sur
   #0A0F1A : 9,2 pour la première, 5,3 pour la seconde.
   Les deux couleurs de rôle passent à leur version vive, la sourde ne
   tient pas sur le sombre.
   ===================================================================== */
:root{
  --sur-fond:#E9ECF2;
  --sur-fond-2:#AEB7BF;
  --trait-fond:rgba(255,255,255,.14);
}
h2.sec,.sec{color:var(--sur-fond-2)}
.signature,.signature b,.signature span,.signature .version{color:var(--sur-fond-2)}
.signature .version{opacity:.85}
.tete .salut{color:var(--sur-fond)}
.tete .salut em{color:var(--accent-vif)}
.tete .meta{color:var(--sur-fond-2)}
.marque-app{color:var(--data-vif)}
.haut button{background:rgba(255,255,255,.08);color:var(--sur-fond-2)}
.haut button:hover{background:rgba(255,255,255,.14);color:var(--sur-fond)}
.grille{border-top-color:var(--trait-fond)}

#champRecherche > span{color:var(--sur-fond-2)}
#vide{color:var(--sur-fond-2)}
.stepnav .dots button{color:var(--sur-fond-2);border-color:var(--trait-fond)}
.stepnav .dots button[aria-current="true"]{background:var(--sur-fond);color:var(--g-900)}

/* =====================================================================
   LA GRILLE FAÇON KEEP
   ===================================================================== */
@media (min-width:820px){
  main{max-width:1240px}
  main > .row, #champRecherche{max-width:640px;margin-left:auto!important;margin-right:auto!important}
}
#champRecherche input[type=search]{width:100%;min-height:46px;padding:11px 14px;font-size:16px;font-family:inherit;
  color:var(--ink);background:#fff;border:1px solid var(--champ-bord,#D8DDE4);border-radius:10px;-webkit-appearance:none;appearance:none}
#champRecherche input[type=search]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.16)}
.keep{display:flex;gap:10px;align-items:flex-start;margin-bottom:6px}
.keep-col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:10px}
.k-carte{position:relative;border-radius:12px;overflow:hidden;cursor:pointer;

.k-carte:active{transform:scale(.985)}

.k-carte.vert{background:#E6F4E4;border-color:#CBE6C7}
.k-carte.bleu{background:#E3EEFC;border-color:#C8DCF6}
.k-carte.rose{background:#FBE6E6;border-color:#F3CFCF}
.k-carte.violet{background:#EFE8FB;border-color:#DCD0F4}
.k-carte.gris{background:#EEF1F5;border-color:#DCE2EA}

.k-pin svg{width:16px;height:16px;stroke:#B07807;fill:rgba(201,133,7,.35);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.k-titre{font-size:15px;font-weight:700;letter-spacing:-.015em;line-height:1.3;margin:0 0 6px;

.k-case{flex:0 0 auto;width:17px;height:17px;min-height:17px;margin-top:2px;padding:0;cursor:pointer;
  border:1.8px solid rgba(28,30,34,.45);border-radius:4px;background:transparent}
.k-case:hover{border-color:#1C1E22;background:rgba(255,255,255,.6)}
.k-texte{flex:1 1 auto;min-width:0;font-size:13.5px;line-height:1.35;overflow-wrap:anywhere}
.k-plus,.k-faits,.k-vide{margin:6px 0 0;font-size:12.5px;color:#5D626D}

@media (hover:hover){

}
/* ranger les listes : la liste en main, la place qu'elle prendra */
.k-carte{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.k-photo{-webkit-user-drag:none}
.k-carte.k-source{display:none}
.k-carte.k-leve{position:fixed;left:0;top:0;z-index:70;margin:0;pointer-events:none;cursor:grabbing;
  scale:1.04;will-change:transform;animation:kLeve .14s ease-out;
  box-shadow:0 24px 46px -14px rgba(10,14,20,.5),0 3px 10px rgba(10,14,20,.16);
  transition:box-shadow .14s ease}
@keyframes kLeve{from{scale:1;box-shadow:0 1px 2px rgba(10,14,20,.08)}}
.k-place{border-radius:12px;border:2px dashed rgba(28,30,34,.26);background:rgba(28,30,34,.05)}
html.theme-sombre .k-place{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.06)}
body.k-glisse{-webkit-user-select:none;user-select:none;cursor:grabbing}
@media (prefers-reduced-motion:reduce){ .k-carte.k-leve{animation:none} }

/* la liste ouverte en grand */

  -webkit-overflow-scrolling:touch;display:flex;justify-content:center;align-items:flex-start;

<script>
(function(){
/* ---------- session expirée : retour à la connexion ---------- */
(function(){
  var brut = window.fetch;
  window.fetch = function(){
    return brut.apply(this, arguments).then(function(r){
      if(r && r.status === 401){
        try{
          r.clone().json().then(function(d){
            if(d && d.erreur && String(d.erreur).indexOf("Session") >= 0){
              try{ localStorage.removeItem("outils:session"); }catch(e){}
              location.replace("./index.html?sortie=expiree");
            }
          }).catch(function(){});
        }catch(e){}
      }
      return r;
    });
  };
})();

/* ---------- session ---------- */
var SESSION=null;
try{ SESSION=JSON.parse(localStorage.getItem("outils:session")||"null"); }catch(e){}
var ENLIGNE = location.protocol==="http:" || location.protocol==="https:";
if(ENLIGNE && (!SESSION || !SESSION.jeton)){
  location.replace("./index.html?sortie");
}
function jetonSession(){ return SESSION && SESSION.jeton ? SESSION.jeton : ""; }

if(!window.storage){
  window.storage = {
    get:function(k){ try{ var v=localStorage.getItem(k); return Promise.resolve(v===null?null:{key:k,value:v}); }catch(e){ return Promise.resolve(null); } },
    set:function(k,v){ try{ localStorage.setItem(k,v); return Promise.resolve({key:k,value:v}); }catch(e){ return Promise.reject(e); } },
    delete:function(k){ try{ localStorage.removeItem(k); }catch(e){} return Promise.resolve({key:k,deleted:true}); },
    list:function(p){ var out=[]; try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(!p||k.indexOf(p)===0) out.push(k); } }catch(e){} return Promise.resolve({keys:out}); }
  };
}


/* ---------- accès au site ---------- */
function baseSite(){
  try{ return location.origin.indexOf("http")===0 ? location.origin : ""; }catch(e){ return ""; }
}
function jetonSession(){
  try{ var s=JSON.parse(localStorage.getItem("outils:session")||"null"); return s && s.jeton ? s.jeton : ""; }catch(e){ return ""; }
}
function apiUrl(a){ return baseSite()+"/api/rapports?action="+a; }
function apiEnTetes(){ return {"content-type":"application/json","x-auth":jetonSession()}; }
function apiPret(silencieux){
  if(!baseSite() || !jetonSession()){
    if(!silencieux) toast("Ouvrez l'appli depuis votre site, en étant connecté.");
    return false;
  }
  return true;
}

function compress(file, cb){
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var max=1400, w=img.width, h=img.height;
      if(w>max||h>max){ var r=Math.min(max/w,max/h); w=Math.round(w*r); h=Math.round(h*r); }
      var cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      cb({data:cv.toDataURL("image/jpeg",0.72), w:w, h:h, legende:""});
    };
    img.onerror=function(){ cb(null); };
    img.src=fr.result;
  };
  fr.onerror=function(){ cb(null); };
  fr.readAsDataURL(file);
}


var $ = function(id){ return document.getElementById(id); };
var toastT;
function toast(msg, action, fn){
  var t=$("toast"); t.textContent=msg; t.hidden=false;
  if(action){
    var b=document.createElement("button"); b.type="button"; b.className="toast-act"; b.textContent=action;
    b.addEventListener("click", function(){ t.hidden=true; clearTimeout(toastT); fn(); });
    t.appendChild(b);
  }
  clearTimeout(toastT); toastT=setTimeout(function(){ t.hidden=true; }, action ? 7000 : 2400);
}
function uid(){ return "n"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function maintenant(){ return new Date().toISOString(); }
function frCourt(iso){
  if(!iso) return "";
  var a=dateLocale(iso).split("-");
  return a[2]+"/"+a[1];
}
function frJour(iso){
  if(!iso) return "";
  var d=new Date(iso+"T12:00:00");
  var J=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
  var auj=jourLocal();
  if(iso===auj) return "aujourd'hui";
  var demain=jourLocal(new Date(Date.now()+864e5));
  if(iso===demain) return "demain";
  if(iso<auj) return "en retard";
  var dans=(Date.parse(iso+"T12:00:00")-Date.now())/864e5;
  if(dans<7) return J[d.getDay()];
  return frCourt(iso);
}
function ilya(iso){
  if(!iso) return "";
  var m=Math.round((Date.now()-Date.parse(iso))/60000);
  if(m<1) return "à l'instant";
  if(m<60) return "il y a "+m+" min";
  var h=Math.round(m/60);
  if(h<24) return "il y a "+h+" h";
  return "le "+frCourt(iso);
}

var N={listes:[], aSupprimer:[]}, FILTRE="toutes", EQUIPE=[], DOSSIERS=[], SYNC="local";
var MOI=(SESSION && SESSION.nom) ? SESSION.nom : "";
/* Le nom sous lequel le serveur signe mes listes (« Johan ») n'est pas
   forcément celui de la session (« Johan Klughertz ») : on retient le
   sien pour reconnaître mes listes. */
var AUTEUR_MOI="";
try{ AUTEUR_MOI=localStorage.getItem("notes:moi")||""; }catch(e){}
function estMoi(nom){ return !!nom && (nom === MOI || nom === AUTEUR_MOI); }
function dAutrui(l){ return !!l.auteur && !estMoi(l.auteur); }
var COULEURS=[["jaune","#FDF3D3"],["vert","#E6F4E4"],["bleu","#E3EEFC"],
              ["rose","#FBE6E6"],["violet","#EFE8FB"],["gris","#EEF1F5"]];

/* ---------- stockage local ---------- */
var saveT;
function save(pousser){
  clearTimeout(saveT);
  saveT=setTimeout(function(){
    try{ window.storage.set("notes:local", JSON.stringify(N)); }catch(e){}
    if(pousser!==false) pousser_serveur();
  }, 350);
}
function charger_local(cb){
  try{
    window.storage.get("notes:local").then(function(r){
      if(r && r.value){ try{ N=JSON.parse(r.value); }catch(e){} }
      if(!N.listes) N.listes=[];
      if(!N.aSupprimer) N.aSupprimer=[];
      /* l'ancienne liste des suppressions ne sert plus : c'est la
         corbeille du serveur qui fait foi */
      delete N.supprimees;
      cb();
    }).catch(cb);
  }catch(e){ cb(); }
}

/* ---------- synchronisation ---------- */
function majSync(etat, detail){
  SYNC=etat;
  var e=$("syncEtat");
  /* rien quand tout va bien : seul un souci s'affiche (hors connexion, envoi refusé) */
  e.textContent = etat==="ok" || etat==="cours" ? ""
    : etat==="hors" ? "hors connexion" : (detail||"");
  e.style.color = etat==="ok" ? "var(--ok)" : (etat==="hors" ? "var(--ink-3)" : "var(--ink-2)");
}
var envoiEnCours=false, aRenvoyer=false;
function pousser_serveur(){
  if(!apiPret(true)) { majSync("hors"); return; }
  if(envoiEnCours){ aRenvoyer=true; return; }
  envoiEnCours=true; majSync("cours");
  fetch(apiUrl("notes-enregistrer"), {method:"POST", headers:apiEnTetes(),
    body:JSON.stringify(N.ordre ? {listes:N.listes, ordre:N.ordre} : {listes:N.listes})})
    .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
    .then(function(d){
      envoiEnCours=false;
      majSync("ok");
      if(aRenvoyer){ aRenvoyer=false; pousser_serveur(); }
    })
    .catch(function(){ envoiEnCours=false; majSync("hors"); });
}
function tirer_serveur(cb){
  var fini=false;
  function fin(){ if(fini) return; fini=true; if(cb) cb(); }
  tirer_serveur.aPousser = undefined;
  if(!apiPret(true)){ majSync("hors"); fin(); return; }
  majSync("cours");
  fetch(apiUrl("notes"), {headers:apiEnTetes()})
    .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
    .then(function(d){
      /* y a-t-il ici quelque chose que le serveur n'a pas ? (sinon, rien à renvoyer) */
      var dist={}; (d.listes||[]).forEach(function(x){ dist[x.id]=x.maj||""; });
      tirer_serveur.aPousser = N.listes.some(function(l){ return !(l.id in dist) || (l.maj||"") > dist[l.id]; })
        || !!(N.aSupprimer && N.aSupprimer.length)
        || !!(N.ordre && (!d.ordre || (N.ordre.maj||"") > (d.ordre.maj||"")));
      if(d.moi){ AUTEUR_MOI=d.moi; try{ localStorage.setItem("notes:moi", d.moi); }catch(e){} }
      /* l'ordre rangé sur un autre appareil : le plus récent l'emporte */
      if(d.ordre && Array.isArray(d.ordre.ids) && (!N.ordre || (d.ordre.maj||"") > (N.ordre.maj||"")))
        N.ordre={ids:d.ordre.ids.slice(), maj:d.ordre.maj||"", masquees:(d.ordre.masquees||[]).slice()};
      fusionner(d.listes||[], d.supprimees||[]);
      majSync("ok");
      try{ window.storage.set("notes:local", JSON.stringify(N)); }catch(e){}
      render();
      /* les suppressions en attente partent d'abord, l'envoi ensuite */
      return supprimerEnAttente(d.listes||[], d.supprimees||[]).then(fin);
    })
    .catch(function(){ majSync("hors"); fin(); });
}
function fusionner(distantes, jeteesServeur){
  /* la version la plus récente gagne, liste par liste */
  /* ce qui est supprimé : la corbeille du serveur, plus ce qu'on a
     supprimé ici sans avoir encore pu le lui dire */
  var jetees = (N.aSupprimer || []).concat(jeteesServeur || []);
  distantes = distantes.filter(function(d){ return jetees.indexOf(d.id)<0; });
  var par={};
  N.listes.forEach(function(l){ par[l.id]=l; });
  distantes.forEach(function(d){
    var loc=par[d.id];
    if(!loc){ N.listes.push(d); par[d.id]=d; return; }
    if((d.maj||"") > (loc.maj||"")){
      for(var k in d) loc[k]=d[k];
    }
  });
  /* Une liste ne disparaît d'ici que si elle a été supprimée — ici ou
     ailleurs (le serveur tient la corbeille). Une liste à moi que le
     serveur ne renvoie pas n'est PAS supprimée : elle lui manque, et le
     prochain envoi la lui rend. C'est ce qui a permis, avant, de tout
     perdre : un serveur qui répondait « rien » effaçait aussi le
     téléphone. Seule une liste d'un collègue qui ne me la partage plus
     s'en va. */
  var ids={};
  distantes.forEach(function(d){ ids[d.id]=1; });
  N.listes = N.listes.filter(function(l){
    if(jetees.indexOf(l.id)>=0) return false;
    if(ids[l.id] || l.local) return true;
    /* « moi » tel que le serveur signe mes listes ; sans cette
       réponse, dans le doute, on garde */
    return !l.auteur || !AUTEUR_MOI || l.auteur === AUTEUR_MOI;
  });
  trier();
}
/* une liste supprimée ici hors connexion : le serveur l'a encore, on
   la lui fait mettre à la corbeille maintenant */
function supprimerEnAttente(distantes, jeteesServeur){
  var envois=[];
  (N.aSupprimer||[]).slice().forEach(function(id){
    if((jeteesServeur||[]).indexOf(id)>=0 || !distantes.some(function(d){ return d.id===id; })){
      oublierSuppression(id); return;
    }
    envois.push(envoyerSuppression(id));
  });
  return Promise.all(envois);
}
function oublierSuppression(id){
  N.aSupprimer=(N.aSupprimer||[]).filter(function(x){ return x!==id; });
  try{ window.storage.set("notes:local", JSON.stringify(N)); }catch(e){}
}
function envoyerSuppression(id){
  return fetch(apiUrl("note-supprimer")+"&id="+encodeURIComponent(id), {headers:apiEnTetes()})
    .then(function(r){ if(r.ok) oublierSuppression(id); return r.ok; })
    .catch(function(){ return false; });
}
/* Une liste reste à sa place : on la retrouve là où on l'a laissée, qu'on
   la modifie ou qu'on la coche. Les épinglées d'abord ; dans chaque partie,
   l'ordre où je les ai rangées à la main (N.ordre, le même sur tous mes
   appareils). Une liste pas encore rangée (une nouvelle, ou tant que rien
   n'a été rangé) passe devant, la plus récente d'abord. */
function creeLe(l){
  if(l.cree) return l.cree;
  var m=/^n([0-9a-z]+)[0-9a-z]{4}$/.exec(l.id||"");
  var t=m ? parseInt(m[1], 36) : NaN;
  if(isFinite(t) && t > 1e12 && t < 4e12) return new Date(t).toISOString();
  return l.maj || "";
}
function trier(){
  var rang={};
  ((N.ordre && N.ordre.ids) || []).forEach(function(id, i){ rang[id]=i; });
  N.listes.sort(function(a,b){
    if(!!b.epingle !== !!a.epingle) return b.epingle ? 1 : -1;
    var ra=rang[a.id], rb=rang[b.id];
    if(ra!==undefined && rb!==undefined) return ra-rb;
    if(ra!==undefined || rb!==undefined) return ra===undefined ? -1 : 1;
    return creeLe(b).localeCompare(creeLe(a));
  });
}

/* ---------- listes ---------- */
function nouvelleListe(){
  var l={id:uid(), titre:"", items:[{id:uid(), texte:"", fait:false}],
         epingle:false, couleur:"jaune", pour:"", partage:[], quand:"",
         photos:[], cree:maintenant(), maj:maintenant(), local:true};
  N.listes.unshift(l);
  save();
  ouvrirListe(l.id);
  var champ=document.querySelector('[data-titre="'+l.id+'"]');
  if(champ) champ.focus();
}
function touche(l){ l.maj=maintenant(); l.local=false; }
/* Une liste partagée est modifiée à plusieurs. On date chaque case, pas
   seulement la liste : le serveur peut alors fusionner case par case au
   lieu de laisser le dernier qui enregistre effacer le travail de
   l'autre. */
function toucheItem(l, it){ it.maj=maintenant(); touche(l); }
/* une liste vient d'être terminée : confettis et un mot */
function feter(l){
  var f=$("fete"); if(!f) return;
  f.textContent="";
  var reduit=false;
  try{ reduit=window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}
  var couleurs=["#3B82F6","#22C55E","#3B82F6","#EAB308","#EC4899","#8B5CF6"];
  if(!reduit){
    for(var i=0;i<42;i++){
      var c=document.createElement("span");
      c.style.left=(2+((i*37+i*i*11)%96))+"%";
      c.style.background=couleurs[i%6];
      c.style.setProperty("--dx", (((i*37)%140)-70)+"px");
      c.style.animationDelay=(((i*7)%11)*0.04)+"s";
      f.appendChild(c);
    }
  }
  var b=document.createElement("div"); b.className="bravo";
  b.textContent="Liste « "+(l.titre||"sans titre")+" » terminée !";
  f.appendChild(b);
  f.hidden=false;
  clearTimeout(feter.t);
  feter.t=setTimeout(function(){ f.hidden=true; f.textContent=""; }, 2400);
}
function cocherItem(l, it, fait){
  var avant=toutFait(l);
  it.fait=fait; it.faitLe = fait ? maintenant() : ""; it.maj=maintenant();
  touche(l); save(); render();
  if(fait && !avant && toutFait(l)) feter(l);
}

function restantes(l){ return (l.items||[]).filter(function(i){ return !i.fait; }).length; }
function toutFait(l){ return (l.items||[]).length>0 && restantes(l)===0; }

function visibles(){
  var q=($("q") && $("q").value || "").trim().toLowerCase();
  return N.listes.filter(function(l){
    /* une liste masquée ne revient que si on la cherche */
    if(!q && estMasquee(l)) return false;
    if(FILTRE==="epinglees" && !l.epingle) return false;
    if(FILTRE==="partagees" && !partageDe(l).length && !dAutrui(l)) return false;
    if(FILTRE==="faites" && !toutFait(l)) return false;
    if(q){
      var foin=[l.titre, l.auteur].concat(partageDe(l))
                 .concat((l.items||[]).map(function(i){ return i.texte; }))
        .join(" ").toLowerCase();
      if(foin.indexOf(q)<0) return false;
    }
    return true;
  });
}

/* ---------- la grille, façon Keep ----------
   Les listes s'affichent en colonnes, chacune à sa hauteur : un aperçu
   (titre, cases à faire, cochées, photo) qu'on coche directement, et
   qu'on touche pour l'ouvrir en grand et la modifier. */
var OUVERTE=null, NB_COLONNES=0;
function render(){
  /* une liste en main : on redessine quand elle est posée (poser() le fait) */
  if(GL) return;
  RENDU_EN_COURS=true;
  try{ rendre(); } finally { RENDU_EN_COURS=false; }
  if(TO_EDIT && !OUVERTE){
    var ed=document.querySelector("#listes .to-edit");
    if(ed){
      ajusterHauteur(ed);
      var pos = TO_EDIT.debut || TO_EDIT.curseur==null ? ed.value.length : TO_EDIT.curseur;
      TO_EDIT.debut=false;
      try{ ed.focus({preventScroll:true}); ed.setSelectionRange(pos, pos); }catch(e){}
    } else TO_EDIT=null;
  }
}
function rendre(){
  var host=$("listes");
  var actif=document.activeElement;
  if(TO_EDIT && actif && actif.classList && actif.classList.contains("to-edit")) TO_EDIT.curseur=actif.selectionStart;
  var focusAjout = actif && actif.id==="toAjout";
  var focusCarte = actif && actif.classList && actif.classList.contains("tc-champ") ? actif.getAttribute("data-liste") : null;
  host.textContent="";
  trier();
  var mode=vue();
  document.body.classList.toggle("vue-simple", mode!=="grille");
  document.body.classList.toggle("vue-onglets", mode==="onglets");
  document.body.classList.toggle("vue-cartes", mode==="cartes");
  if(mode!=="grille"){
    var vues=N.listes.filter(nonMasquee);
    $("vide").hidden = vues.length>0;
    $("vide").textContent = N.listes.length ? TOUT_MASQUE : VIDE_TEXTE;
    $("champRecherche").hidden = true;
    if(vues.length){ if(mode==="onglets") renderOnglets(host); else renderCartes(host); }
    peindreEditeur();
    peindreBoutonMasquees();
    if(!OUVERTE){
      var ch = mode==="onglets" ? ((focusAjout || TO_FOCUS) && $("toAjout"))
             : ((focusCarte || TC_FOCUS) && host.querySelector('.tc-champ[data-liste="'+(focusCarte || TC_FOCUS)+'"]'));
      if(ch) try{ ch.focus({preventScroll:true}); }catch(e){}
    }
    TO_FOCUS=false; TC_FOCUS=null;
    return;
  }
  var liste=visibles();
  $("vide").hidden = liste.length>0;
  /* tout est masqué : on le dit, plutôt que « aucune liste » */
  $("vide").textContent = N.listes.length && !N.listes.some(nonMasquee) && !(($("q") && $("q").value)||"").trim() ? TOUT_MASQUE : VIDE_TEXTE;
  $("champRecherche").hidden = N.listes.length<4;

  var epinglees=liste.filter(function(l){ return l.epingle; });
  var autres=liste.filter(function(l){ return !l.epingle; });
  NB_COLONNES=nbColonnes();
  if(epinglees.length){ titreSection(host, "Épinglées"); grille(host, epinglees, true); }
  if(autres.length){ if(epinglees.length) titreSection(host, "Autres"); grille(host, autres, false); }
  peindreEditeur();
  peindreBoutonMasquees();
}
var VIDE_TEXTE="Aucune liste pour l'instant. Touchez « Nouvelle liste » pour commencer.";
var TOUT_MASQUE="Toutes vos listes sont masquées : « Listes masquées », en bas, pour les revoir.";
function nbColonnes(){
  var w=$("listes").clientWidth || (window.innerWidth-28);
  return Math.max(2, Math.min(6, Math.floor((w+10)/220)));
}
/* ---------- la vue « trois onglets » ----------
   Mes trois listes principales en onglets ; celle qu'on choisit s'ouvre
   en grand, avec la saisie juste dessous. Toucher le rond (ou glisser la
   ligne vers la gauche) la règle : elle se raye puis disparaît, avec
   « Annuler ». Les autres listes sont rangées en dessous. Les réglages
   (quelles listes, ce que fait le rond, l'ancienne vue en cartes) sont
   propres à l'appareil. */
var TO_DRAFT="", TO_FOCUS=false;
var FONDS_LISTE={jaune:"#FDF3D3",vert:"#E6F4E4",bleu:"#E3EEFC",rose:"#FBE6E6",violet:"#EFE8FB",gris:"#EEF1F5"};
var POINTS_LISTE={jaune:"#E8B931",vert:"#4E9F57",bleu:"#4A7FD0",rose:"#D9707A",violet:"#8C6CD0",gris:"#8C96A3"};
function pref(k, d){ try{ var v=localStorage.getItem("notes:"+k); return v===null ? d : v; }catch(e){ return d; } }
function prefSet(k, v){ try{ localStorage.setItem("notes:"+k, v); }catch(e){} }
/* la vue : « grille » (la to-do list d’origine, par défaut), « onglets » ou « cartes » (mes 3 listes) */
function vue(){
  /* la to-do list comme avant : la grille de listes à cocher, par défaut.
     Une fois, chacun y revient ; les onglets et les cartes restent dans les réglages. */
  if(pref("vueAvant","")!=="1"){ prefSet("vue","grille"); prefSet("vueAvant","1"); }
  var v=pref("vue","grille"); return v==="onglets" || v==="cartes" ? v : "grille";
}
function vueOnglets(){ return vue()==="onglets"; }
function rondSupprime(){ return pref("rond","suppr")!=="coche"; }
function aFaireDe(l){ return (l.items||[]).filter(function(i){ return !i.fait && textePlein(i); }); }
function mesTrois(){
  var ids=[]; try{ ids=JSON.parse(pref("trois","[]"))||[]; }catch(e){ ids=[]; }
  var l3=ids.map(listeDe).filter(Boolean).filter(nonMasquee).slice(0,3);
  if(l3.length) return l3;
  /* rien de choisi : les épinglées d'abord, puis les plus récentes */
  var ep=N.listes.filter(function(l){ return l.epingle && nonMasquee(l); });
  var rest=N.listes.filter(function(l){ return !l.epingle && nonMasquee(l); });
  return ep.concat(rest).slice(0,3);
}
function metaDe(l){
  var m=[], pa=partageDe(l);
  if(dAutrui(l)) m.push("de "+l.auteur);
  else if(pa.length) m.push("partagée avec "+(pa.length>2 ? pa.length+" personnes" : pa.join(", ")));
  if(l.quand) m.push("pour le "+frJour(l.quand));
  return m.join("  ·  ");
}
function renderOnglets(host){
  var trois=mesTrois();
  var choisie=listeDe(pref("onglet",""));
  if(!choisie || trois.indexOf(choisie)<0) choisie=trois[0];
  var tabs=document.createElement("div"); tabs.className="to-onglets";
  tabs.setAttribute("role","tablist"); tabs.setAttribute("aria-label","Mes listes principales");
  tabs.style.setProperty("--n", String(trois.length));
  trois.forEach(function(l){
    var b=document.createElement("button"); b.type="button"; b.className="to-tab"; b.setAttribute("role","tab");
    b.setAttribute("aria-selected", l===choisie ? "true" : "false");
    b.setAttribute("data-onglet", l.id);
    var n=aFaireDe(l).length;
    var t=document.createElement("b"); t.textContent=l.titre || "Sans titre";
    var c=document.createElement("span"); c.textContent=n ? n+" à faire" : "rien à faire";
    b.appendChild(t); b.appendChild(c);
    b.addEventListener("click", function(){ if(l===choisie) return; prefSet("onglet", l.id); TO_DRAFT=""; render(); });
    tabs.appendChild(b);
  });
  host.appendChild(tabs);
  host.appendChild(panneauListe(choisie));

  var autres=N.listes.filter(function(l){ return trois.indexOf(l)<0 && nonMasquee(l); });
  var sec=document.createElement("div"); sec.className="to-sec";
  var h=document.createElement("h2"); h.textContent=autres.length ? "Autres listes" : "Vos listes";
  var ch=document.createElement("button"); ch.type="button"; ch.id="btnTrois"; ch.textContent="Choisir mes 3 listes";
  ch.addEventListener("click", ouvrirReglages);
  sec.appendChild(h); sec.appendChild(ch); host.appendChild(sec);
  if(!autres.length) return;
  var box=document.createElement("div"); box.className="to-autres";
  autres.forEach(function(l){
    var a=document.createElement("button"); a.type="button"; a.className="to-autre"; a.setAttribute("data-apercu", l.id);
    var pt=document.createElement("i"); pt.className="pt"; pt.style.background=POINTS_LISTE[l.couleur]||POINTS_LISTE.jaune;
    var t=document.createElement("b"); t.textContent=l.titre || "Sans titre";
    var n=aFaireDe(l).length, info=[n ? n+" à faire" : "rien à faire"];
    if(dAutrui(l)) info.push("de "+l.auteur); else if(partageDe(l).length) info.push("partagée");
    var sp=document.createElement("span"); sp.textContent=info.join(" · ");
    a.appendChild(pt); a.appendChild(t); a.appendChild(sp);
    a.insertAdjacentHTML("beforeend", '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>');
    a.setAttribute("aria-label", "Ouvrir la liste "+(l.titre||"sans titre")+", "+info.join(", "));
    a.addEventListener("click", function(){ ouvrirListe(l.id); });
    box.appendChild(a);
  });
  host.appendChild(box);
}
function panneauListe(l){
  var fond=FONDS_LISTE[l.couleur]||FONDS_LISTE.jaune;
  var p=document.createElement("section"); p.className="to-panneau"; p.style.background=fond;
  p.setAttribute("role","tabpanel"); p.setAttribute("aria-label", l.titre || "Liste");
  p.setAttribute("data-liste", l.id);
  var t=document.createElement("div"); t.className="to-tete";
  var m=document.createElement("span"); m.className="to-meta"; m.textContent=metaDe(l);
  var o=document.createElement("button"); o.type="button"; o.className="to-plus";
  o.setAttribute("aria-label","Ouvrir « "+(l.titre||"la liste")+" » en grand : titre, couleur, partage, rappels, photos");
  o.innerHTML='<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><circle cx="5.5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18.5" cy="12" r="1.8"/></svg>';
  o.addEventListener("click", function(){ ouvrirListe(l.id); });
  t.appendChild(m); t.appendChild(o); p.appendChild(t);

  var items=aFaireDe(l);
  items.forEach(function(it){ p.appendChild(ligneTache(l, it, fond)); });
  if(!items.length){
    var v=document.createElement("p"); v.className="to-vide";
    v.textContent=(l.items||[]).some(textePlein) ? "Tout est réglé ici. Bien joué !" : "Liste vide : ajoutez une tâche ci-dessous.";
    p.appendChild(v);
  }
  var faits=(l.items||[]).filter(function(i){ return i.fait && textePlein(i); });
  if(faits.length){
    var fx=document.createElement("div"); fx.className="to-faits";
    var ft=document.createElement("span"); ft.textContent="✓ "+faits.length+" cochée"+(faits.length>1?"s":"");
    var eff=document.createElement("button"); eff.type="button"; eff.textContent="Effacer";
    eff.setAttribute("aria-label","Effacer les "+faits.length+" tâche"+(faits.length>1?"s":"")+" cochée"+(faits.length>1?"s":""));
    eff.addEventListener("click", function(){
      var L=listeDe(l.id)||l, avant=(L.items||[]).slice();
      L.items=avant.filter(function(i){ return !(i.fait && textePlein(i)); });
      touche(L); save(); render();
      toast(faits.length+" cochée"+(faits.length>1?"s":"")+" effacée"+(faits.length>1?"s":"")+".", "Annuler", function(){
        var L2=listeDe(l.id); if(!L2) return;
        L2.items=avant.map(function(i){ return Object.assign({}, i, {maj:maintenant()}); });
        touche(L2); save(); render();
      });
    });
    fx.appendChild(ft); fx.appendChild(eff); p.appendChild(fx);
  }
  var f=document.createElement("form"); f.className="to-ajout";
  var inp=document.createElement("input"); inp.type="text"; inp.id="toAjout";
  inp.placeholder="Ajouter une tâche…"; inp.setAttribute("enterkeyhint","done"); inp.autocomplete="off";
  inp.setAttribute("aria-label","Nouvelle tâche dans « "+(l.titre||"la liste")+" »");
  inp.value=TO_DRAFT;
  inp.addEventListener("input", function(){ TO_DRAFT=inp.value; });
  var ok=document.createElement("button"); ok.type="submit"; ok.textContent="Ajouter";
  f.appendChild(inp); f.appendChild(ok);
  f.addEventListener("submit", function(e){
    e.preventDefault();
    var tx=inp.value.trim(); if(!tx){ inp.focus(); return; }
    var L=listeDe(l.id)||l;
    L.items=(L.items||[]).filter(function(i){ return textePlein(i) || i.rappel; });
    L.items.push({id:uid(), texte:tx, fait:false, maj:maintenant()});
    touche(L); TO_DRAFT=""; TO_FOCUS=true; save(); render();
  });
  p.appendChild(f);
  return p;
}
/* ---------- la vue « cartes » (option B) ----------
   Mes trois listes l'une sous l'autre, chacune repliable, une croix pour
   retirer une ligne, « + Ajouter » dessous ; les autres listes en tuiles. */
var TC_DRAFTS={}, TC_AJOUT=null, TC_FOCUS=null;
function plies(){ try{ return JSON.parse(pref("plies","[]"))||[]; }catch(e){ return []; } }

  var trois=mesTrois(), pl=plies();
  trois.forEach(function(l){ host.appendChild(carteListe(l, pl.indexOf(l.id)<0)); });

  var g=document.createElement("div"); g.className="tc-reste";

    var a=document.createElement("button"); a.type="button"; a.className="tc-tuile"; a.setAttribute("data-apercu", l.id);
    a.style.setProperty("--pt", POINTS_LISTE[l.couleur]||POINTS_LISTE.jaune);
    var t=document.createElement("b"); t.textContent=l.titre || "Sans titre";
    var n=aFaireDe(l).length, info=[n ? n+" à faire" : "rien à faire"];
    if(dAutrui(l)) info.push("de "+l.auteur); else if(partageDe(l).length) info.push("partagée");
    var sp=document.createElement("span"); sp.textContent=info.join(" · ");
    a.appendChild(t); a.appendChild(sp);
    a.setAttribute("aria-label","Ouvrir la liste "+(l.titre||"sans titre")+", "+info.join(", "));
    a.addEventListener("click", function(){ ouvrirListe(l.id); });
    g.appendChild(a);
  });

}
function carteListe(l, ouverte){
  var fond=FONDS_LISTE[l.couleur]||FONDS_LISTE.jaune;
  var c=document.createElement("section"); c.className="tc-carte"; c.style.background=fond;
  c.setAttribute("data-liste", l.id); c.setAttribute("aria-label", l.titre || "Liste");
  var items=aFaireDe(l);
  var tete=document.createElement("div"); tete.className="tc-tete";
  var pli=document.createElement("button"); pli.type="button"; pli.className="tc-pli";
  pli.setAttribute("aria-expanded", ouverte ? "true" : "false");
  var t=document.createElement("b"); t.textContent=l.titre || "Sans titre";
  var nb=document.createElement("span"); nb.className="tc-nb"; nb.textContent=String(items.length);
  nb.setAttribute("aria-label", items.length+" à faire");
  pli.appendChild(t); pli.appendChild(nb);
  pli.insertAdjacentHTML("beforeend", '<svg class="tc-fl" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>');
  pli.addEventListener("click", function(){
    var p=plies().filter(function(x){ return x!==l.id; });
    if(ouverte) p.push(l.id);
    prefSet("plies", JSON.stringify(p)); render();
  });
  var o=document.createElement("button"); o.type="button"; o.className="to-plus";
  o.setAttribute("aria-label","Ouvrir « "+(l.titre||"la liste")+" » en grand : titre, couleur, partage, rappels, photos");
  o.innerHTML='<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><circle cx="5.5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18.5" cy="12" r="1.8"/></svg>';
  o.addEventListener("click", function(){ ouvrirListe(l.id); });
  tete.appendChild(pli); tete.appendChild(o); c.appendChild(tete);
  if(!ouverte) return c;
  var meta=metaDe(l);
  if(meta){ var m=document.createElement("p"); m.className="tc-meta"; m.textContent=meta; c.appendChild(m); }
  items.forEach(function(it){ c.appendChild(ligneTache(l, it, fond, true)); });
  if(!items.length){
    var v=document.createElement("p"); v.className="to-vide";
    v.textContent=(l.items||[]).some(textePlein) ? "Tout est réglé ici. Bien joué !" : "Rien pour l'instant.";
    c.appendChild(v);
  }
  var faits=(l.items||[]).filter(function(i){ return i.fait && textePlein(i); });
  if(faits.length){
    var fx=document.createElement("div"); fx.className="to-faits";
    var ft=document.createElement("span"); ft.textContent="✓ "+faits.length+" cochée"+(faits.length>1?"s":"");
    var eff=document.createElement("button"); eff.type="button"; eff.textContent="Effacer";
    eff.addEventListener("click", function(){
      var L=listeDe(l.id)||l, avant=(L.items||[]).slice();
      L.items=avant.filter(function(i){ return !(i.fait && textePlein(i)); });
      touche(L); save(); render();
      toast(faits.length+" cochée"+(faits.length>1?"s":"")+" effacée"+(faits.length>1?"s":"")+".", "Annuler", function(){
        var L2=listeDe(l.id); if(!L2) return;
        L2.items=avant.map(function(i){ return Object.assign({}, i, {maj:maintenant()}); }); touche(L2); save(); render();
      });
    });
    fx.appendChild(ft); fx.appendChild(eff); c.appendChild(fx);
  }
  if(TC_AJOUT===l.id){
    var f=document.createElement("form"); f.className="to-ajout tc-form";
    var inp=document.createElement("input"); inp.type="text"; inp.className="tc-champ"; inp.setAttribute("data-liste", l.id);
    inp.placeholder="Nouvelle tâche…"; inp.setAttribute("enterkeyhint","done"); inp.autocomplete="off";
    inp.setAttribute("aria-label","Nouvelle tâche dans « "+(l.titre||"la liste")+" »");
    inp.value=TC_DRAFTS[l.id]||"";
    inp.addEventListener("input", function(){ TC_DRAFTS[l.id]=inp.value; });
    inp.addEventListener("keydown", function(e){ if(e.key==="Escape"){ e.stopPropagation(); TC_AJOUT=null; TC_DRAFTS[l.id]=""; render(); } });
    var ok=document.createElement("button"); ok.type="submit"; ok.textContent="Ajouter";
    f.appendChild(inp); f.appendChild(ok);
    f.addEventListener("submit", function(e){
      e.preventDefault();
      var tx=inp.value.trim(); if(!tx){ TC_AJOUT=null; render(); return; }
      var L=listeDe(l.id)||l;
      L.items=(L.items||[]).filter(function(i){ return textePlein(i) || i.rappel; });
      L.items.push({id:uid(), texte:tx, fait:false, maj:maintenant()});
      touche(L); TC_DRAFTS[l.id]=""; TC_FOCUS=l.id; save(); render();
    });
    c.appendChild(f);
  } else {
    var aj=document.createElement("button"); aj.type="button"; aj.className="tc-ajouter";
    aj.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Ajouter</span>';
    aj.setAttribute("aria-label","Ajouter une tâche dans « "+(l.titre||"la liste")+" »");
    aj.addEventListener("click", function(){ TC_AJOUT=l.id; TC_FOCUS=l.id; render(); });
    c.appendChild(aj);
  }
  return c;
}
function ligneTache(l, it, fond, croix){
  var w=document.createElement("div"); w.className="to-l"; w.setAttribute("data-item", it.id);
  var sup=document.createElement("div"); sup.className="to-sup"; sup.setAttribute("aria-hidden","true"); sup.textContent="Supprimer";
  var r=document.createElement("div"); r.className="to-ligne"; r.style.background=fond;
  var b=document.createElement("button"); b.type="button"; b.className="to-rond";
  b.setAttribute("aria-label", (rondSupprime() ? "Régler et retirer « " : "Cocher « ")+it.texte+" »");
  b.innerHTML='<i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg></i>';
  b.addEventListener("click", function(){
    if(w.classList.contains("partie")) return;
    if(!rondSupprime()){ cocherItem(listeDe(l.id)||l, it, true); return; }
    w.classList.add("partie");
    retirerTache(l, it, 520);
  });
  var tx;
  if(TO_EDIT && TO_EDIT.liste===l.id && TO_EDIT.item===it.id){
    /* la ligne en cours de modification : toute la phrase, le curseur au bout */
    tx=document.createElement("textarea"); tx.className="to-edit"; tx.rows=1; tx.value=TO_EDIT.valeur;
    tx.setAttribute("aria-label","Modifier « "+it.texte+" »"); tx.setAttribute("enterkeyhint","done");
    tx.addEventListener("input", function(){ TO_EDIT.valeur=tx.value.replace(/\n/g, " "); ajusterHauteur(tx); });
    tx.addEventListener("keydown", function(e){
      if(e.key==="Enter"){ e.preventDefault(); finEdition(true); }
      else if(e.key==="Escape"){ e.preventDefault(); e.stopPropagation(); finEdition(false); }
    });
    tx.addEventListener("blur", function(){ if(!RENDU_EN_COURS) finEdition(true); });
  } else {
    tx=document.createElement("span"); tx.className="to-texte"; tx.textContent=it.texte;
    if(it.rappel){ var sm=document.createElement("small"); sm.textContent="Rappel "+texteRappel(it.rappel); tx.appendChild(sm); }
    tx.setAttribute("role","button"); tx.tabIndex=0;
    tx.setAttribute("aria-label","Modifier « "+it.texte+" »");
    function editer(){ if(Date.now()-(r._glisse||0) < 450) return; TO_EDIT={liste:l.id, item:it.id, valeur:it.texte, debut:true}; render(); }
    tx.addEventListener("click", editer);
    tx.addEventListener("keydown", function(e){ if(e.key==="Enter" || e.key===" "){ e.preventDefault(); editer(); } });
  }
  if(croix){
    /* vue « cartes » : le rond seulement s'il coche ; la croix à droite retire la ligne */
    if(!rondSupprime()) r.appendChild(b);
    else r.classList.add("sans-rond");
    r.appendChild(tx);
    var x=document.createElement("button"); x.type="button"; x.className="tc-x";
    x.setAttribute("aria-label","Retirer « "+it.texte+" »");
    x.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>';
    x.addEventListener("click", function(){ if(w.classList.contains("partie")) return; w.classList.add("partie"); retirerTache(l, it, 420); });
    r.appendChild(x);
  } else { r.appendChild(b); r.appendChild(tx); }
  w.appendChild(sup); w.appendChild(r);
  glisserPourRetirer(r, function(){ w.classList.add("partie"); retirerTache(l, it, 260); });
  return w;
}
/* une zone de texte à la hauteur de son contenu */
function ajusterHauteur(t){
  function f(){ t.style.height="auto"; t.style.height=Math.max(t.scrollHeight, 22)+"px"; }
  f(); if(window.requestAnimationFrame) requestAnimationFrame(f);
}
var TO_EDIT=null, RENDU_EN_COURS=false;
function finEdition(garder){
  var e=TO_EDIT; if(!e) return;
  TO_EDIT=null;
  if(garder){
    var L=listeDe(e.liste), it=L && (L.items||[]).filter(function(x){ return x.id===e.item; })[0];
    var v=String(e.valeur||"").replace(/\s+/g, " ").trim();
    if(it && v && v!==it.texte){ it.texte=v; toucheItem(L, it); save(); }
  }
  render();
}
function reduitMouvement(){ try{ return window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; } }
function retirerTache(l, it, delai){
  setTimeout(function(){
    var L=listeDe(l.id); if(!L) return;
    var i=(L.items||[]).map(function(x){ return x.id; }).indexOf(it.id);
    if(i<0){ render(); return; }
    var garde=L.items[i];
    var restait=aFaireDe(L).length;
    L.items.splice(i,1);
    touche(L); save(); render();
    if(restait===1) feter(L);
    toast("« "+garde.texte+" » retirée.", "Annuler", function(){
      var L2=listeDe(l.id); if(!L2) return;
      L2.items=L2.items||[];
      /* une copie neuve : la ligne revient même si la suppression est déjà partie */
      L2.items.splice(Math.min(i, L2.items.length), 0, Object.assign({}, garde, {id:uid(), maj:maintenant()}));
      touche(L2); save(); render();
    });
  }, reduitMouvement() ? 0 : delai);
}
/* glisser une ligne vers la gauche, au doigt (ou à la souris) */
function glisserPourRetirer(r, fn){
  var x0=null, y0=0, dx=0, actif=false;
  r.addEventListener("pointerdown", function(e){
    if(e.pointerType==="mouse" && e.button!==0) return;
    if(e.target.closest && e.target.closest(".to-rond, .tc-x, .to-edit")) return;
    x0=e.clientX; y0=e.clientY; dx=0; actif=false;
  });
  r.addEventListener("pointermove", function(e){
    if(x0===null) return;
    var mx=e.clientX-x0, my=e.clientY-y0;
    if(!actif){
      if(mx < -12 && Math.abs(mx) > Math.abs(my)*1.4){
        actif=true; r.classList.add("glisse");
        try{ r.setPointerCapture(e.pointerId); }catch(_){}
      } else if(Math.abs(my) > 12 || mx > 12){ x0=null; return; }
      else return;
    }
    dx=Math.min(0, mx);
    r.style.transform="translateX("+dx+"px)";
  });
  function fin(){
    if(x0===null) return;
    x0=null;
    if(!actif) return;
    actif=false; r.classList.remove("glisse"); r._glisse=Date.now();
    if(dx < -Math.min(110, r.offsetWidth*0.32)){ r.style.transform="translateX(-105%)"; fn(); }
    else r.style.transform="";
  }
  r.addEventListener("pointerup", fin);
  r.addEventListener("pointercancel", function(){ if(x0===null) return; x0=null; actif=false; r.classList.remove("glisse"); r.style.transform=""; });
}
/* ---------- les réglages de la vue ---------- */
function ouvrirReglages(){
  var v=$("toReglages"), c=$("toRegCorps"); c.textContent="";
  function h3(t){ var h=document.createElement("h3"); h.textContent=t; c.appendChild(h); }
  function hint(t){ var p=document.createElement("p"); p.className="hint"; p.textContent=t; c.appendChild(p); }
  function choix(type, nom, val, lib, coche){
    var lab=document.createElement("label"); lab.className="tr-choix";
    var i=document.createElement("input"); i.type=type; i.name=nom; i.value=val; i.checked=!!coche;
    var sp=document.createElement("span"); sp.textContent=lib;
    lab.appendChild(i); lab.appendChild(sp); c.appendChild(lab); return i;
  }
  h3("Mes 3 listes principales");
  hint("Cochez jusqu'à trois listes. Les autres restent en dessous.");
  var pris=mesTrois();
  N.listes.filter(nonMasquee).forEach(function(l){
    var i=choix("checkbox", "trois", l.id, l.titre || "Sans titre", pris.indexOf(l)>=0);
    i.addEventListener("change", function(){
      if(i.checked && c.querySelectorAll('input[name="trois"]:checked').length > 3){ i.checked=false; toast("Trois listes au maximum."); }
    });
  });
  h3("Le rond devant une tâche");
  choix("radio", "rond", "suppr", "La retire (la liste reste courte)", rondSupprime());
  choix("radio", "rond", "coche", "La coche (elle reste, en bas, cochée)", !rondSupprime());
  h3("Affichage");
  var v0=vue();
  choix("radio", "vue", "grille", "Toutes les listes, comme avant (par défaut)", v0==="grille");
  choix("radio", "vue", "cartes", "Mes 3 listes l'une sous l'autre, le reste en tuiles", v0==="cartes");

/* Chaque aperçu va dans la colonne la moins haute (à égalité, celle qui en
   a le moins) : la première liste en haut à gauche, puis de gauche à
   droite. Le même calcul place les listes pendant qu'on en déplace une. */
var ECART=10;
function colonneDe(hs, nbs){
  var k=0;
  for(var i=1;i<hs.length;i++) if(hs[i] < hs[k]-0.5 || (Math.abs(hs[i]-hs[k])<=0.5 && nbs[i] < nbs[k])) k=i;
  return k;
}
function empiler(cols, cartes){
  var hs=cols.map(function(){ return 0; }), nbs=cols.map(function(){ return 0; });
  cartes.forEach(function(c){
    var k=colonneDe(hs, nbs);
    cols[k].appendChild(c);
    if(c._h==null) c._h=c.getBoundingClientRect().height;
    hs[k]+=(nbs[k] ? ECART : 0)+c._h; nbs[k]++;

/* ---------- ranger les listes à la main ----------
   Un appui long sur une liste (à la souris : la saisir et la tirer) la
   détache : elle suit le doigt, les autres s'écartent pour lui faire de
   la place, et elle se pose là où on la lâche — la première en haut à
   gauche. Lâchée parmi les épinglées, elle s'épingle ; parmi les autres,
   elle ne l'est plus. Au clavier : Alt + flèches. L'ordre est à moi seul
   (une liste partagée garde sa place chez les autres) et il suit sur tous
   mes appareils. La liste d'un collègue reste dans sa partie : l'épingle
   est sur la liste, l'épingler l'épinglerait aussi chez lui. */
var GL=null, APPUI=null, FIN_GLISSE=0;
/* la liste « id » va juste avant « avantId », ou juste après « apresId » */
function ranger(id, avantId, apresId, epingle){
  var l=listeDe(id);
  if(!l){ render(); return false; }
  trier();
  var avant=N.listes.map(function(x){ return x.id; });
  var ids=avant.filter(function(x){ return x!==id; });
  var k = avantId && ids.indexOf(avantId)>=0 ? ids.indexOf(avantId)
        : apresId && ids.indexOf(apresId)>=0 ? ids.indexOf(apresId)+1 : ids.length;
  ids.splice(k, 0, id);
  var epingleChange = !!l.epingle !== !!epingle;
  if(!epingleChange && ids.join("|")===avant.join("|")){ render(); return false; }
  if(epingleChange){ l.epingle=!!epingle; touche(l); }
  N.ordre={ids:ids, maj:maintenant(), masquees:masquees().slice()};
  /* gardé tout de suite : l'appli peut être fermée aussitôt la liste posée */
  try{ window.storage.set("notes:local", JSON.stringify(N)); }catch(e){}
  save(); render();
  return true;
}
/* au clavier : Alt + ← / → avance ou recule la liste d'une place */
function deplacerAuClavier(carte, sens){
  var g=carte.closest(".keep"); if(!g || !g._cartes) return;
  var seq=g._cartes, i=seq.indexOf(carte), id=carte.getAttribute("data-apercu"), l=listeDe(id);
  if(i<0 || !l) return;
  var nom="« "+((l.titre||"").trim() || "Sans titre")+" »", j=i+sens;
  if(j<0 || j>=seq.length){ toast(nom+(sens<0 ? " est déjà la première." : " est déjà la dernière.")); return; }
  var reste=seq.filter(function(c){ return c!==carte; });
  ranger(id, reste[j] ? reste[j].getAttribute("data-apercu") : null,
             j>0 ? reste[j-1].getAttribute("data-apercu") : null, g.getAttribute("data-epingle")==="1");
  var c=document.querySelector('#listes .keep [data-apercu="'+id+'"]');
  if(c) try{ c.focus(); }catch(e){}
  toast(nom+" : place "+(j+1)+" sur "+seq.length+".");
}
/* où irait l'aperçu glissé à la place i de la suite : la colonne et le haut */
function positionDe(seq, i, nbCol){
  var hs=[], nbs=[];
  for(var c=0;c<nbCol;c++){ hs.push(0); nbs.push(0); }
  for(var j=0;j<i;j++){ var k=colonneDe(hs, nbs); hs[k]+=(nbs[k] ? ECART : 0)+seq[j]._h; nbs[k]++; }
  var k2=colonneDe(hs, nbs);
  return {col:k2, top:hs[k2]+(nbs[k2] ? ECART : 0)};
}
function lever(carte, x, y, pointeur){
  APPUI=null;
  var keeps=Array.prototype.slice.call(document.querySelectorAll("#listes .keep"));
  var g0=carte.closest(".keep");
  if(!carte.isConnected || !g0 || keeps.indexOf(g0)<0 || OUVERTE) return;
  var r=carte.getBoundingClientRect();
  var sections=keeps.map(function(g){
    g._cartes.forEach(function(c){ c._h=c.getBoundingClientRect().height; });
    return {keep:g, cols:g._cols, epingle:g.getAttribute("data-epingle")==="1",
            seq:g._cartes.filter(function(c){ return c!==carte; })};
  });
  /* la place laissée vide, et la liste en main (une copie : l'aperçu
     touché reste dans la page, caché, pour que le doigt garde la main) */
  var place=document.createElement("div"); place.className="k-place";
  place.style.height=r.height+"px"; place._h=r.height;
  carte.parentNode.insertBefore(place, carte);
  var fantome=carte.cloneNode(true);
  fantome.classList.add("k-leve"); fantome.removeAttribute("tabindex"); fantome.removeAttribute("data-apercu");
  fantome.setAttribute("aria-hidden","true");
  fantome.style.width=r.width+"px"; fantome.style.height=r.height+"px";
  carte.classList.add("k-source");
  document.body.appendChild(fantome);
  var s=keeps.indexOf(g0);
  GL={id:carte.getAttribute("data-apercu"), carte:carte, fantome:fantome, place:place, sections:sections,
      dx:x-r.left, dy:y-r.top, w:r.width, h:r.height, x:x, y:y, pointeur:pointeur,
      cible:{s:s, i:g0._cartes.indexOf(carte)}, raf:0, pose:false, bouge:false, largeur:window.innerWidth,
      seule: dAutrui(listeDe(carte.getAttribute("data-apercu"))||{}) ? s : null};
  document.body.classList.add("k-glisse");
